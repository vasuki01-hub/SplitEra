              <div class="form-group">
                <label>Payment Mode</label>
                <select name="mode" required>
                  <option value="Cash">Cash</option>
                  <option value="Online">Online</option>
                  <option value="GPay">GPay</option>
                  <option value="Card">Card</option>
                </select>
              </div>
              
              <div class="form-group">
                <label>Remarks (optional)</label>
                <textarea name="remarks" rows="3"></textarea>
              </div>
              
              <div class="form-group">
                <label>Attachments (optional)</label>
                <input type="file" id="expense-files-new" multiple accept="image" style="padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text);">
                <div id="expense-preview" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin-top: 12px;"></div>
              </div>
              
              <button type="submit" class="btn-primary">Add Expense</button>
            </form>
          </div>
        </div>
      `;
      
      document.body.insertAdjacentHTML('beforeend', modalHTML);
      
      // File preview
      document.getElementById('expense-files-new').addEventListener('change', function(e) {
        const preview = document.getElementById('expense-preview');
        preview.innerHTML = '';
        Array.from(e.target.files).forEach((file, idx) => {
          const reader = new FileReader();
          reader.onload = function(event) {
            preview.innerHTML += `
              <div style="position: relative; aspect-ratio: 1; border: 2px solid var(--border); border-radius: 6px; overflow: hidden;">
                <img src="${event.target.result}" style="width: 100%; height: 100%; object-fit: cover;">
                <button type="button" onclick="removePreviewFile('expense-files-new', 'expense-preview', ${idx})" style="position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: none; background: rgba(0,0,0,0.7); color: white; font-size: 12px; cursor: pointer; font-weight: 700;">✕</button>
              </div>
            `;
          };
          reader.readAsDataURL(file);
        });
      });
      
      document.getElementById('add-expense-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const filesInput = document.getElementById('expense-files-new');
        
        let attachments = [];
        if (filesInput.files.length > 0) {
          Array.from(filesInput.files).forEach(file => {
            attachments.push(URL.createObjectURL(file));
          });
        }
        
        const newExpense = {
          id: Date.now().toString(),
          userId: currentUser.id,
          date: formData.get('date'),
          description: formData.get('description'),
          category: formData.get('category'),
          mode: formData.get('mode'),
          remarks: formData.get('remarks'),
          amount: parseFloat(formData.get('amount')),
          attachments: attachments,
          createdAt: new Date().toISOString()
        };
        
        expenses.push(newExpense);
        mockDB.expenses.push(newExpense);
        saveToDB();
        
        closeModal();
        showToast('Expense added successfully! 💸');
        renderPersonal(document.getElementById('main-content'));
      });
    };

    window.editExpense = function(id) {
      alert('Edit expense: ' + id);
    };

    window.deleteExpense = function(id) {
      if (confirm('Delete this expense?')) {
        mockDB.expenses = mockDB.expenses.filter(e => e.id !== id);
        saveToDB();
        loadUserData();
        renderPage('personal');
        showToast('Expense deleted');
      }
    };

    // Calendar Page
    function renderCalendar(content) {
      const selectedYear = window.calendarFilters?.year || 'all';
      const selectedMonth = window.calendarFilters?.month || new Date().getMonth();
      
      const years = ['all', ...new Set([
        ...expenses.map(e => new Date(e.date).getFullYear()),
        ...credits.map(c => new Date(c.date).getFullYear()),
        ...groups.flatMap(g => (g.expenses || []).map(e => new Date(e.date).getFullYear()))
      ])].sort((a, b) => {
        if (a === 'all') return -1;
        if (b === 'all') return 1;
        return b - a;
      });
      
      const months = [
        { value: 0, label: 'January' }, { value: 1, label: 'February' }, { value: 2, label: 'March' },
        { value: 3, label: 'April' }, { value: 4, label: 'May' }, { value: 5, label: 'June' },
        { value: 6, label: 'July' }, { value: 7, label: 'August' }, { value: 8, label: 'September' },
        { value: 9, label: 'October' }, { value: 10, label: 'November' }, { value: 11, label: 'December' }
      ];
      
      content.innerHTML = `
        <div class="section">
          <div class="section-header">
            <h2 class="section-title">Calendar View</h2>
          </div>
          
          <div style="display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap;">
            <select id="calendar-year-filter" style="min-width: 150px; padding: 12px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);">
              ${years.map(y => `<option value="${y}" ${selectedYear == y ? 'selected' : ''}>${y === 'all' ? 'All Time' : y}</option>`).join('')}
            </select>
            <select id="calendar-month-filter" style="min-width: 150px; padding: 12px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);" ${selectedYear === 'all' ? 'disabled' : ''}>
              ${months.map(m => `<option value="${m.value}" ${selectedMonth == m.value ? 'selected' : ''}>${m.label}</option>`).join('')}
            </select>
          </div>
          
          <div id="calendar-container"></div>
        </div>
      `;
      
      document.getElementById('calendar-year-filter').addEventListener('change', applyCalendarFilters);
      document.getElementById('calendar-month-filter').addEventListener('change', applyCalendarFilters);
      
      if (selectedYear === 'all') {
        renderAllTimeCalendar();
      } else {
        renderMonthCalendar(parseInt(selectedYear), parseInt(selectedMonth));
      }
    }

    function applyCalendarFilters() {
      const year = document.getElementById('calendar-year-filter').value;
      const month = document.getElementById('calendar-month-filter').value;
      const monthSelect = document.getElementById('calendar-month-filter');
      
      if (year === 'all') {
        monthSelect.disabled = true;
      } else {
        monthSelect.disabled = false;
      }
      
      window.calendarFilters = { year, month: parseInt(month) };
      renderCalendar(document.getElementById('main-content'));
    }

    function renderAllTimeCalendar() {
      const container = document.getElementById('calendar-container');
      
      // Group all data by year-month
      const yearMonths = new Set();
      expenses.forEach(e => {
        const date = new Date(e.date);
        yearMonths.add(`${date.getFullYear()}-${date.getMonth()}`);
      });
      credits.forEach(c => {
        const date = new Date(c.date);
        yearMonths.add(`${date.getFullYear()}-${date.getMonth()}`);
      });
      groups.forEach(g => {
        (g.expenses || []).forEach(e => {
          const date = new Date(e.date);
          yearMonths.add(`${date.getFullYear()}-${date.getMonth()}`);
        });
      });
      
      const sortedYearMonths = Array.from(yearMonths).sort().reverse();
      
      container.innerHTML = sortedYearMonths.map(ym => {
        const [year, month] = ym.split('-').map(Number);
        const monthName = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][month];
        
        return `
          <h3 style="margin: 24px 0 16px 0; padding: 12px; background: var(--bg); border-left: 4px solid var(--primary); font-size: 18px;">
            ${monthName} ${year}
          </h3>
          ${generateCalendarGrid(year, month)}
        `;
      }).join('');
    }

    function renderMonthCalendar(year, month) {
      const container = document.getElementById('calendar-container');
      container.innerHTML = generateCalendarGrid(year, month);
    }

    function generateCalendarGrid(year, month) {
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const startingDayOfWeek = firstDay.getDay();
      const daysInMonth = lastDay.getDate();
      
      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      
      let html = `
        <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 32px;">
          ${dayNames.map(day => `<div style="text-align: center; font-weight: 700; padding: 12px; background: var(--bg);">${day}</div>`).join('')}
      `;
      
      // Empty cells before first day
      for (let i = 0; i < startingDayOfWeek; i++) {
        html += `<div style="background: var(--bg); opacity: 0.3; min-height: 100px; border-radius: 8px;"></div>`;
      }
      
      // Days of month
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayData = getDayData(dateStr);
        
        const totalAmount = dayData.credits - dayData.personalExpenses - dayData.groupExpenses;
        const eventCount = dayData.eventCount;
        
        html += `
          <div style="background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; min-height: 100px; position: relative; cursor: pointer;" onclick="openDayModal('${dateStr}')">
            <div style="font-weight: 700; font-size: 18px; margin-bottom: 8px;">${day}</div>
            ${eventCount > 0 ? `
              <div style="font-size: 12px; opacity: 0.7; margin-bottom: 4px;">${eventCount} event${eventCount > 1 ? 's' : ''}</div>
              <div style="font-weight: 600; color: ${totalAmount >= 0 ? 'var(--success)' : 'var(--error)'};">
                ${formatCurrency(totalAmount)}
              </div>
              <div style="position: absolute; bottom: 8px; right: 8px; cursor: pointer;">ℹ️</div>
            ` : '<div style="font-size: 12px; opacity: 0.5;">No events</div>'}
          </div>
        `;
      }
      
      html += `</div>`;
      return html;
    }

    function getDayData(dateStr) {
      const dayCredits = credits.filter(c => c.date === dateStr);
      const dayExpenses = expenses.filter(e => e.date === dateStr);
      const dayGroupExpenses = groups.flatMap(g => (g.expenses || []).filter(e => e.date === dateStr));
      
      return {
        credits: dayCredits.reduce((sum, c) => sum + parseFloat(c.amount), 0),
        personalExpenses: dayExpenses.reduce((sum, e) => sum + parseFloat(e.amount), 0),
        groupExpenses: dayGroupExpenses.reduce((sum, e) => sum + parseFloat(e.amount), 0),
        eventCount: dayCredits.length + dayExpenses.length + dayGroupExpenses.length,
        events: [...dayCredits, ...dayExpenses, ...dayGroupExpenses]
      };
    }

    window.openDayModal = function(dateStr) {
      const dayData = getDayData(dateStr);
      const date = new Date(dateStr);
      const formattedDate = date.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      
      const dailyTotal = dayData.credits - dayData.personalExpenses - dayData.groupExpenses;
      
      const modalHTML = `
        <div class="modal-overlay" onclick="if(event.target === this) closeModal()">
          <div class="modal" style="max-width: 800px;">
            <div class="modal-header">
              <h3 class="modal-title">${formattedDate}</h3>
              <button type="button" class="modal-close" onclick="closeModal()">✕</button>
            </div>
            
            <div style="margin-bottom: 24px; padding: 16px; background: var(--bg); border-radius: 8px;">
              <h4 style="margin-bottom: 12px;">Daily Summary</h4>
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px;">
                <div>
                  <div style="font-size: 12px; opacity: 0.7;">Credits</div>
                  <div style="font-weight: 600; color: var(--success);">+${formatCurrency(dayData.credits)}</div>
                </div>
                <div>
                  <div style="font-size: 12px; opacity: 0.7;">Personal</div>
                  <div style="font-weight: 600; color: var(--error);">-${formatCurrency(dayData.personalExpenses)}</div>
                </div>
                <div>
                  <div style="font-size: 12px; opacity: 0.7;">Group</div>
                  <div style="font-weight: 600; color: var(--error);">-${formatCurrency(dayData.groupExpenses)}</div>
                </div>
                <div>
                  <div style="font-size: 12px; opacity: 0.7;">Total</div>
                  <div style="font-weight: 700; color: ${dailyTotal >= 0 ? 'var(--success)' : 'var(--error)'};">
                    ${formatCurrency(dailyTotal)}
                  </div>
                </div>
              </div>
            </div>
            
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Type</th>
                    <th>Description</th>
                    <th>Amount</th>
                  </tr>
                </thead>
                <tbody>
                  ${credits.filter(c => c.date === dateStr).map(c => `
                    <tr>
                      <td><span style="color: var(--success); font-weight: 600;">Credit</span></td>
                      <td>${c.description || c.source || 'N/A'}</td>
                      <td style="color: var(--success); font-weight: 600;">+${formatCurrency(c.amount)}</td>
                    </tr>
                  `).join('')}
                  ${expenses.filter(e => e.date === dateStr).map(e => `
                    <tr>
                      <td><span style="color: var(--error); font-weight: 600;">Personal</span></td>
                      <td>${e.description}</td>
                      <td style="color: var(--error); font-weight: 600;">-${formatCurrency(e.amount)}</td>
                    </tr>
                  `).join('')}
                  ${groups.flatMap(g => (g.expenses || []).filter(e => e.date === dateStr).map(e => `
                    <tr>
                      <td><span style="color: var(--error); font-weight: 600;">Group: ${g.name}</span></td>
                      <td>${e.description}</td>
                      <td style="color: var(--error); font-weight: 600;">-${formatCurrency(e.amount)}</td>
                    </tr>
                  `)).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
      
      document.body.insertAdjacentHTML('beforeend', modalHTML);
    };

    // Details Page
    function renderDetails(content) {
      const searchQuery = window.detailsFilters?.search || '';
      const selectedYear = window.detailsFilters?.year || 'all';
      const selectedMonth = window.detailsFilters?.month || 'all';
      
      // Combine all data
      let allData = [
        ...credits.map(c => ({ ...c, section: 'Credit', type: 'credit' })),
        ...expenses.map(e => ({ ...e, section: 'Personal', type: 'personal' })),
        ...groups.flatMap(g => (g.expenses || []).map(e => ({ ...e, section: `Group: ${g.name}`, type: 'group', groupId: g.id, groupName: g.name })))
      ];
      
      // Apply filters
      if (searchQuery) {
        allData = allData.filter(item => {
          const searchStr = `${item.date} ${item.description} ${item.amount} ${item.mode || ''} ${item.remarks || ''} ${item.section}`.toLowerCase();
          return searchStr.includes(searchQuery.toLowerCase());
        });
      }
      
      if (selectedYear !== 'all') {
        allData = allData.filter(item => new Date(item.date).getFullYear() === parseInt(selectedYear));
        if (selectedMonth !== 'all') {
          allData = allData.filter(item => new Date(item.date).getMonth() === parseInt(selectedMonth));
        }
      }
      
      // Sort by date descending
      allData.sort((a, b) => new Date(b.date) - new Date(a.date));
      
      // Group by year-month for all-time view
      const groupedData = {};
      if (selectedYear === 'all') {
        allData.forEach(item => {
          const date = new Date(item.date);
          const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
          if (!groupedData[key]) groupedData[key] = [];
          groupedData[key].push(item);
        });
      }
      
      const years = ['all', ...new Set(allData.map(item => new Date(item.date).getFullYear()))].sort((a, b) => {
        if (a === 'all') return -1;
        if (b === 'all') return 1;
        return b - a;
      });
      
      const months = [
        { value: 'all', label: 'All Time' },
        { value: '0', label: 'January' }, { value: '1', label: 'February' }, { value: '2', label: 'March' },
        { value: '3', label: 'April' }, { value: '4', label: 'May' }, { value: '5', label: 'June' },
        { value: '6', label: 'July' }, { value: '7', label: 'August' }, { value: '8', label: 'September' },
        { value: '9', label: 'October' }, { value: '10', label: 'November' }, { value: '11', label: 'December' }
      ];
      
      content.innerHTML = `
        <div class="section">
          <div class="section-header">
            <h2 class="section-title">Details View</h2>
            <button class="btn-secondary" onclick="exportDetailsPDF()">📄 Export PDF</button>
          </div>
          
          <div style="display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap;">
            <input type="text" id="details-search" placeholder="Search by date, amount, description, mode..." value="${searchQuery}" style="flex: 1; min-width: 200px; padding: 12px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);">
            <select id="details-year-filter" style="min-width: 150px; padding: 12px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);">
              ${years.map(y => `<option value="${y}" ${selectedYear == y ? 'selected' : ''}>${y === 'all' ? 'All Time' : y}</option>`).join('')}
            </select>
            <select id="details-month-filter" style="min-width: 150px; padding: 12px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);" ${selectedYear === 'all' ? 'disabled' : ''}>
              ${months.map(m => `<option value="${m.value}" ${selectedMonth == m.value ? 'selected' : ''}>${m.label}</option>`).join('')}
            </select>
          </div>
          
          <div class="table-container">
            ${selectedYear === 'all' && Object.keys(groupedData).length > 0 ?
              Object.keys(groupedData).sort().reverse().map(yearMonth => {
                const [year, month] = yearMonth.split('-');
                const monthName = months.find(m => m.value === String(parseInt(month) - 1))?.label || month;
                const monthData = groupedData[yearMonth];
                
                return `
                  <h3 style="margin: 24px 0 16px 0; padding: 12px; background: var(--success); color: white; border-radius: 8px; font-size: 18px;">
                    ${monthName} ${year}
                  </h3>
                  <table>
                    <thead>
                      <tr>
                        <th>Date</th>
                        <th>Section</th>
                        <th>Description & Attachments</th>
                        <th>Mode</th>
                        <th>Remarks</th>
                        <th>Amount</th>
                        <th>Actions</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${renderDetailsRows(monthData)}
                    </tbody>
                  </table>
                `;
              }).join('')
            : `
              <table>
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Section</th>
                    <th>Description & Attachments</th>
                    <th>Mode</th>
                    <th>Remarks</th>
                    <th>Amount</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  ${renderDetailsRows(allData)}
                </tbody>
              </table>
            `}
          </div>
        </div>
      `;
      
      document.getElementById('details-search').addEventListener('input', applyDetailsFilters);
      document.getElementById('details-year-filter').addEventListener('change', applyDetailsFilters);
      document.getElementById('details-month-filter').addEventListener('change', applyDetailsFilters);
    }

    function applyDetailsFilters() {
      const search = document.getElementById('details-search').value;
      const year = document.getElementById('details-year-filter').value;
      const month = document.getElementById('details-month-filter').value;
      const monthSelect = document.getElementById('details-month-filter');
      
      if (year === 'all') {
        monthSelect.disabled = true;
        monthSelect.value = 'all';
      } else {
        monthSelect.disabled = false;
      }
      
      window.detailsFilters = { search, year, month };
      renderDetails(document.getElementById('main-content'));
    }

    function renderDetailsRows(dataList) {
      if (dataList.length === 0) {
        return `<tr><td colspan="7" style="text-align: center;">No data found</td></tr>`;
      }
      
      return dataList.map((item, idx) => {
        const isEditing = window.editingDetailIdx === idx && window.editingDetailType === item.type;
        
        if (isEditing && item.type !== 'group') {
          return `
            <tr style="background: var(--bg);">
              <td><input type="date" id="edit-detail-date-${idx}" value="${item.date}" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text);"></td>
              <td>${item.section}</td>
              <td>
                <input type="text" id="edit-detail-desc-${idx}" value="${item.description || ''}" placeholder="Description" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text); margin-bottom: 8px;">
                <div>
                  <input type="file" id="edit-detail-files-${idx}" multiple accept="image" style="display: none;">
                  <button type="button" class="btn-small btn-change" onclick="document.getElementById('edit-detail-files-${idx}').click()">📎 Add Files</button>
                  <div id="edit-detail-attachments-${idx}" style="margin-top: 8px;"></div>
                </div>
              </td>
              <td><input type="text" id="edit-detail-mode-${idx}" value="${item.mode || ''}" placeholder="Mode" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text);"></td>
              <td><input type="text" id="edit-detail-remarks-${idx}" value="${item.remarks || ''}" placeholder="Remarks" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text);"></td>
              <td><input type="number" step="0.01" id="edit-detail-amount-${idx}" value="${item.amount}" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text);"></td>
              <td>
                <button class="btn-small btn-change" onclick="saveDetailEdit('${item.type}', '${item.id}', ${idx})">💾</button>
                <button class="btn-small btn-remove" onclick="cancelDetailEdit()">✕</button>
              </td>
            </tr>
          `;
        }
        
        return `
          <tr>
            <td>${new Date(item.date).toLocaleDateString()}</td>
            <td><span style="font-weight: 600; color: ${item.type === 'credit' ? 'var(--success)' : 'var(--error)'};">${item.section}</span></td>
            <td>
              <div style="margin-bottom: 8px;">${item.description || 'N/A'}</div>
              ${item.attachments && item.attachments.length > 0 ? `
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                  ${item.attachments.map((att, attIdx) => `
                    <div style="position: relative; width: 60px; height: 60px; border: 2px solid var(--border); border-radius: 4px; overflow: hidden;">
                      <img src="${att}" alt="Attachment" style="width: 100%; height: 100%; object-fit: cover; cursor: pointer;" onclick="window.open('${att}', '_blank')">
                      <button onclick="removeDetailAttachment('${item.type}', '${item.id}', ${attIdx})" style="position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%; border: none; background: rgba(0,0,0,0.6); color: white; font-size: 10px; cursor: pointer;">✕</button>
                    </div>
                  `).join('')}
                </div>
              ` : '<small style="opacity: 0.5;">No attachments</small>'}
            </td>
            <td>${item.mode || 'N/A'}</td>
            <td>${item.remarks || 'N/A'}</td>
            <td style="font-weight: 600; color: ${item.type === 'credit' ? 'var(--success)' : 'var(--error)'};">
              ${item.type === 'credit' ? '+' : '-'}${formatCurrency(item.amount)}
            </td>
            <td>
              ${item.type !== 'group' ? `<button class="btn-small btn-change" onclick="editDetailInline('${item.type}', ${idx})">✏️</button>` : ''}
              <button class="btn-small btn-remove" onclick="deleteDetail('${item.type}', '${item.id}')">🗑️</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    window.editDetailInline = function(type, idx) {
      window.editingDetailIdx = idx;
      window.editingDetailType = type;
      renderDetails(document.getElementById('main-content'));
    };

    window.cancelDetailEdit = function() {
      window.editingDetailIdx = null;
      window.editingDetailType = null;
      renderDetails(document.getElementById('main-content'));
    };

    window.saveDetailEdit = function(type, id, idx) {
      const date = document.getElementById(`edit-detail-date-${idx}`).value;
      const description = document.getElementById(`edit-detail-desc-${idx}`).value;
      const mode = document.getElementById(`edit-detail-mode-${idx}`).value;
      const remarks = document.getElementById(`edit-detail-remarks-${idx}`).value;
      const amount = document.getElementById(`edit-detail-amount-${idx}`).value;
      const filesInput = document.getElementById(`edit-detail-files-${idx}`);
      
      let item;
      if (type === 'credit') {
        item = credits.find(c => c.id === id);
      } else if (type === 'personal') {
        item = mockDB.expenses.find(e => e.id === id);
      }
      
      if (!item) return;
      
      let attachments = item.attachments || [];
      if (filesInput && filesInput.files.length > 0) {
        Array.from(filesInput.files).forEach(file => {
          attachments.push(URL.createObjectURL(file));
        });
      }
      
      item.date = date;
      item.description = description;
      item.mode = mode;
      item.remarks = remarks;
      item.amount = parseFloat(amount);
      item.attachments = attachments;
      
      saveToDB();
      loadUserData();
      window.editingDetailIdx = null;
      window.editingDetailType = null;
      showToast('Item updated!');
      renderDetails(document.getElementById('main-content'));
    };

    window.removeDetailAttachment = function(type, id, attIdx) {
      if (!confirm('Remove this attachment?')) return;
      
      let item;
      if (type === 'credit') {
        item = credits.find(c => c.id === id);
      } else if (type === 'personal') {
        item = mockDB.expenses.find(e => e.id === id);
      } else if (type === 'group') {
        // Find in groups
        groups.forEach(g => {
          const exp = (g.expenses || []).find(e => e.id === id);
          if (exp) item = exp;
        });
      }
      
      if (item && item.attachments) {
        item.attachments.splice(attIdx, 1);
        saveToDB();
        loadUserData();
        showToast('Attachment removed');
        renderDetails(document.getElementById('main-content'));
      }
    };

    window.deleteDetail = function(type, id) {
      if (!confirm('Delete this item?')) return;
      
      if (type === 'credit') {
        mockDB.credits = mockDB.credits.filter(c => c.id !== id);
      } else if (type === 'personal') {
        mockDB.expenses = mockDB.expenses.filter(e => e.id !== id);
      } else if (type === 'group') {
        groups.forEach(g => {
          g.expenses = (g.expenses || []).filter(e => e.id !== id);
        });
      }
      
      saveToDB();
      loadUserData();
      showToast('Item deleted');
      renderDetails(document.getElementById('main-content'));
    };

    window.exportDetailsPDF = function() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      
      // Green header
      doc.setFillColor(39, 174, 96);
      doc.rect(0, 0, 210, 25, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(20);
      doc.setFont(undefined, 'bold');
      doc.text('SplitEra - Details View', 105, 15, { align: 'center' });
      
      doc.setTextColor(0, 0, 0);
      doc.setFontSize(10);
      doc.text(`Generated: ${new Date().toLocaleDateString()}`, 14, 32);
      
      let yPos = 40;
      
      // Combine all data
      let allData = [
        ...credits.map(c => ({ ...c, section: 'Credit', type: 'credit' })),
        ...expenses.map(e => ({ ...e, section: 'Personal', type: 'personal' })),
        ...groups.flatMap(g => (g.expenses || []).map(e => ({ ...e, section: `Group: ${g.name}`, type: 'group' })))
      ];
      
      // Sort by date
      allData.sort((a, b) => new Date(b.date) - new Date(a.date));
      
      // Group by year-month
      const groupedData = {};
      allData.forEach(item => {
        const date = new Date(item.date);
        const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
        if (!groupedData[key]) groupedData[key] = [];
        groupedData[key].push(item);
      });
      
      Object.keys(groupedData).sort().reverse().forEach(yearMonth => {
        const [year, month] = yearMonth.split('-');
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const monthName = monthNames[parseInt(month) - 1];
        const monthData = groupedData[yearMonth];
        
        // Month header
        doc.setFillColor(39, 174, 96);
        doc.rect(14, yPos, 182, 8, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(12);
        doc.setFont(undefined, 'bold');
        doc.text(`${monthName} ${year}`, 16, yPos + 5);
        
        yPos += 12;
        
        // Table
        doc.autoTable({
          startY: yPos,
          head: [['Date', 'Section', 'Description', 'Amount']],
          body: monthData.map(item => [
            new Date(item.date).toLocaleDateString(),
            item.section,
            item.description || 'N/A',
            `${item.type === 'credit' ? '+' : '-'}${formatCurrency(item.amount)}`
          ]),
          theme: 'grid',
          headStyles: { fillColor: [39, 174, 96] },
          margin: { left: 14, right: 14 }
        });
        
        yPos = doc.lastAutoTable.finalY + 10;
        
        // Check if need new page
        if (yPos > 270) {
          doc.addPage();
          yPos = 20;
        }
      });
      
      doc.save('splitera-details.pdf');
      showToast('Details PDF exported! 📄');
    };

          </div>
          
          <!-- App Settings Section -->
          <div style="background: var(--bg); padding: 24px; border-radius: 12px; margin-bottom: 24px;">
            <h3 style="font-size: 20px; font-weight: 700; margin-bottom: 24px;">App Settings</h3>
            
            <form id="settings-form">
              <div class="dashboard-grid">
                <div class="form-group">
                  <label>Language</label>
                  <select name="language" id="settings-language">

                <div class="form-group">
                  <label>Currency</label>
                  <select name="currency" id="settings-currency">
                    ${currencies.map(c => `<option value="${c.code}" data-symbol="${c.symbol}" ${userSettings.currency === c.code ? 'selected' : ''}>${c.code} - ${c.symbol} ${c.name}</option>`).join('')}
                  </select>
                </div>
                
                <div class="form-group">
                  <label>Country</label>
                  <select name="country" id="settings-country">
                    ${countries.map(c => `<option value="${c}" ${userSettings.country === c ? 'selected' : ''}>${c}</option>`).join('')}
                  </select>
                </div>
                
                <div class="form-group">
                  <label>Dark Mode</label>
                  <div style="display: flex; align-items: center; gap: 12px; margin-top: 8px;">
                    <input type="checkbox" id="dark-mode-toggle" ${currentTheme === 'dark' ? 'checked' : ''} style="width: 20px; height: 20px; cursor: pointer;">
                    <label for="dark-mode-toggle" style="cursor: pointer; margin: 0;">Enable Dark Mode</label>
                  </div>

              <div style="margin-top: 24px;">
                <button type="submit" class="btn-primary">💾 Save Settings</button>

            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
              <button class="btn-secondary" onclick="exportAllDataPDF()">📄 Export as PDF</button>
              <button class="btn-secondary" onclick="exportAllDataJSON()">📥 Export as JSON</button>
            </div>
          </div>

      `;
      
      // Profile edit form handler
      const profileForm = document.getElementById('profile-edit-form');
      if (profileForm) {
        profileForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const formData = new FormData(e.target);
          
          currentUser.firstName = formData.get('firstName');
          currentUser.lastName = formData.get('lastName');
          currentUser.email = formData.get('email');
          currentUser.countryCode = formData.get('countryCode');
          currentUser.contact = `${formData.get('countryCode')}${formData.get('contactNumber')}`;
          
          const newPassword = formData.get('newPassword');
          if (newPassword) {
            currentUser.password = newPassword;
          }
          
          // Update in database
          const userIdx = mockDB.users.findIndex(u => u.id === currentUser.id);
          if (userIdx !== -1) {
            mockDB.users[userIdx] = currentUser;
            saveToDB();
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
          }
          
          showToast('Profile updated successfully!');
          toggleProfileEdit();
          renderMainApp();
        });
      }
      
      // Settings form handler
      const settingsForm = document.getElementById('settings-form');
      if (settingsForm) {
        settingsForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const formData = new FormData(e.target);
          
          const currencySelect = document.getElementById('settings-currency');
          const selectedOption = currencySelect.options[currencySelect.selectedIndex];
          
          userSettings.language = formData.get('language');
          userSettings.currency = formData.get('currency');
          userSettings.currencySymbol = selectedOption.dataset.symbol;
          userSettings.country = formData.get('country');
          
          localStorage.setItem('userSettings', JSON.stringify(userSettings));
          
          showToast('Settings saved successfully!');
          renderMainApp();
        });
      }

     
  
      
      // Dark mode toggle
      const darkModeToggle = document.getElementById('dark-mode-toggle');
      if (darkModeToggle) {
        darkModeToggle.addEventListener('change', (e) => {
          currentTheme = e.target.checked ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', currentTheme);
          localStorage.setItem('theme', currentTheme);
        });
      }
    }

    window.toggleProfileEdit = function() {
      const viewDiv = document.getElementById('profile-view');
      const editDiv = document.getElementById('profile-edit');
      
      if (viewDiv.style.display === 'none') {
        viewDiv.style.display = 'block';
        editDiv.style.display = 'none';
      } else {
        viewDiv.style.display = 'none';
        editDiv.style.display = 'block';
      }
    };

    window.removeProfilePhoto = function() {
      if (confirm('Remove profile photo?')) {
        showToast('Profile photo removed');
        // In production, remove photo from server
      }
    };

    window.exportAllDataPDF = function() {
      showToast('Exporting all data as PDF...');
      // In production, generate comprehensive PDF with all user data
    };

    window.exportAllDataJSON = function() {
      const allData = {
        user: currentUser,
        expenses: expenses,
        credits: credits,
        groups: groups,
        settings: userSettings,
        exportDate: new Date().toISOString()
      };
      
      const dataStr = JSON.stringify(allData, null, 2);
      const dataBlob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(dataBlob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `splitera-data-${new Date().toISOString().split('T')[0]}.json`;
      link.click();
      URL.revokeObjectURL(url);
      
      showToast('Data exported as JSON!');
    };

    // Groups Page
    function renderGroups(content) {
      const userGroups = groups;
      const pendingRequests = groups.filter(g => g.creatorId === currentUser.id && g.joinRequests?.length > 0);
      
      content.innerHTML = `
        <div class="section">
          <div class="section-header">
            <h2 class="section-title">Groups</h2>
            <div style="display: flex; gap: 12px;">
              <button class="btn-secondary" onclick="openCreateGroupModal()">➕ Create Group</button>
              <button class="btn-secondary" onclick="openJoinGroupModal()">🔗 Join Group</button>
            </div>
          </div>
          
          ${pendingRequests.length > 0 ? `
            <div class="pending-requests">
              <h3 style="margin-bottom: 16px; font-size: 18px;">Pending Requests</h3>
              ${pendingRequests.map(g => g.joinRequests.map(req => `
                <div class="request-item">
                  <div>
                    <div style="font-weight: 600;">${req.email}</div>
                    <div style="font-size: 12px; opacity: 0.7;">Group: ${g.name}</div>

                  <div class="request-actions">

          <div class="groups-grid">

              userGroups.map(g => `
                <div class="group-card" onclick="viewGroup('${g.id}')">

                    <h3 class="group-name">${g.name}</h3>

                  <div class="group-actions" onclick="event.stopPropagation()">
                    <button class="btn-small btn-change" onclick="event.stopPropagation(); viewGroup('${g.id}')">View Details</button>
                    ${g.creatorId === currentUser.id ? `
                      <button class="btn-small btn-change" onclick="event.stopPropagation(); editGroup('${g.id}')">✏️ Edit</button>
                      <button class="btn-small btn-remove" onclick="event.stopPropagation(); deleteGroup('${g.id}')">🗑️ Delete</button>
                    ` : ''}
                  </div>

              `).join('')}
          </div>
        </div>
      `;
    }

    window.openCreateGroupModal = function() {
      const modalHTML = `
        <div class="modal-overlay" onclick="if(event.target === this) closeModal()">
          <div class="modal">
            <div class="modal-header">
              <h3 class="modal-title">Create Group</h3>
              <button type="button" class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <form id="create-group-form">
              <div class="form-group">
                <label>Group Name</label>
                <input type="text" name="groupName" required>
              </div>
              <div class="form-group">
                <label>Participant Emails (minimum 1 other member, comma-separated)</label>
                <textarea name="participantEmails" rows="4" placeholder="email1@example.com, email2@example.com" required></textarea>
                <small style="opacity: 0.7;">You will be added automatically as creator</small>
              </div>
              <button type="submit" class="btn-primary">Create Group</button>
            </form>
          </div>
        </div>
      `;
      
      document.body.insertAdjacentHTML('beforeend', modalHTML);
      
      document.getElementById('create-group-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const groupName = formData.get('groupName');
        const participantEmails = formData.get('participantEmails').split(',').map(e => e.trim()).filter(e => e);
        
        if (participantEmails.length < 1) {
          showToast('At least 1 other participant required', true);
          return;
        }
        
        const groupCode = generateGroupCode();
        const newGroup = {
          id: Date.now().toString(),
          name: groupName,
          code: groupCode,
          creatorId: currentUser.id,
          creatorEmail: currentUser.email,
          members: [currentUser.email, ...participantEmails],
          expenses: [],
          joinRequests: [],
          createdAt: new Date().toISOString()
        };
        
        mockDB.groups.push(newGroup);
        saveToDB();
        loadUserData();
        closeModal();
        showToast('Group created successfully!');
        renderPage('groups');
      });
    };

    window.openJoinGroupModal = function() {
      const modalHTML = `
        <div class="modal-overlay" onclick="if(event.target === this) closeModal()">
          <div class="modal" style="max-width: 400px;">
            <div class="modal-header">
              <h3 class="modal-title">Join Group</h3>
              <button type="button" class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <form id="join-group-form">
              <div class="form-group">
                <label>Enter Group Code</label>
                <input type="text" name="groupCode" maxlength="8" style="text-transform: uppercase;" required>
              </div>
              <button type="submit" class="btn-primary">Send Join Request</button>
            </form>
          </div>
        </div>
      `;
      
      document.body.insertAdjacentHTML('beforeend', modalHTML);
      
      document.getElementById('join-group-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const groupCode = formData.get('groupCode').toUpperCase();
        
        const group = mockDB.groups.find(g => g.code === groupCode);
        
        if (!group) {
          showToast('Group not found', true);
          return;
        }
        
        if (group.members?.includes(currentUser.email)) {
          showToast('You are already a member', true);
          return;
        }
        
        const joinRequests = group.joinRequests || [];
        if (joinRequests.some(r => r.email === currentUser.email)) {
          showToast('Request already sent', true);
          return;
        }
        
        joinRequests.push({
          email: currentUser.email,
          name: `${currentUser.firstName} ${currentUser.lastName}`,
          requestedAt: new Date().toISOString()
        });
        
        group.joinRequests = joinRequests;
        saveToDB();
        
        closeModal();
        showToast('Join request sent!');
      });
    };

    window.acceptJoinRequest = function(groupId, email) {
      const group = mockDB.groups.find(g => g.id === groupId);
      if (!group) return;
      
      group.members = group.members || [];
      group.members.push(email);
      group.joinRequests = (group.joinRequests || []).filter(r => r.email !== email);
      
      saveToDB();
      loadUserData();
      showToast('Request accepted');
      renderPage('groups');
    };

    window.denyJoinRequest = function(groupId, email) {
      const group = mockDB.groups.find(g => g.id === groupId);
      if (!group) return;
      
      group.joinRequests = (group.joinRequests || []).filter(r => r.email !== email);
      
      saveToDB();
      loadUserData();
      showToast('Request denied');
      renderPage('groups');
    };

    window.editGroup = function(groupId) {
      const group = mockDB.groups.find(g => g.id === groupId);
      if (!group) return;
      
      const modalHTML = `
        <div class="modal-overlay" onclick="if(event.target === this) closeModal()">
          <div class="modal">
            <div class="modal-header">
              <h3 class="modal-title">Edit Group</h3>
              <button type="button" class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <form id="edit-group-form">
              <div class="form-group">
                <label>Group Name</label>
                <input type="text" name="groupName" value="${group.name}" required>
              </div>
              <div class="form-group">
                <label>Group Code (auto-generated, cannot edit)</label>
                <input type="text" value="${group.code}" disabled style="background: var(--border); cursor: not-allowed;">
              </div>
              <div class="form-group">
                <label>Participant Emails (comma-separated)</label>
                <textarea name="participantEmails" rows="4" required>${group.members.join(', ')}</textarea>
              </div>
              <button type="submit" class="btn-primary">Save Changes</button>
            </form>
          </div>
        </div>
      `;
      
      document.body.insertAdjacentHTML('beforeend', modalHTML);
      
      document.getElementById('edit-group-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const groupName = formData.get('groupName');
        const participantEmails = formData.get('participantEmails').split(',').map(e => e.trim()).filter(e => e);
        
        group.name = groupName;
        group.members = participantEmails;
        
        saveToDB();
        loadUserData();
        closeModal();
        showToast('Group updated successfully!');
        renderPage('groups');
      });
    };

    window.deleteGroup = function(groupId) {
      if (!confirm('Are you sure you want to delete this group? This action cannot be undone.')) return;
      
      mockDB.groups = mockDB.groups.filter(g => g.id !== groupId);
      saveToDB();
      loadUserData();
      showToast('Group deleted');
      renderPage('groups');
    };

    window.viewGroup = function(groupId) {
      const group = mockDB.groups.find(g => g.id === groupId);
      if (!group) return;
      
      const selectedYear = window.groupFilters?.year || 'all';
      const selectedMonth = window.groupFilters?.month || 'all';
      
      let filteredExpenses = (group.expenses || []).slice();
      
      if (selectedYear !== 'all') {
        filteredExpenses = filteredExpenses.filter(e => new Date(e.date).getFullYear() === parseInt(selectedYear));
        if (selectedMonth !== 'all') {
          filteredExpenses = filteredExpenses.filter(e => new Date(e.date).getMonth() === parseInt(selectedMonth));
        }
      }
      
      // Sort by date descending
      filteredExpenses.sort((a, b) => new Date(b.date) - new Date(a.date));
      
      // Group by year-month for all-time view
      const groupedExpenses = {};
      if (selectedYear === 'all') {
        filteredExpenses.forEach(e => {
          const date = new Date(e.date);
          const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
          if (!groupedExpenses[key]) groupedExpenses[key] = [];
          groupedExpenses[key].push(e);
        });
      }
      
      const years = ['all', ...new Set((group.expenses || []).map(e => new Date(e.date).getFullYear()))].sort((a, b) => {
        if (a === 'all') return -1;
        if (b === 'all') return 1;
        return b - a;
      });
      
      const months = [
        { value: 'all', label: 'All Time' },
        { value: '0', label: 'January' },
        { value: '1', label: 'February' },
        { value: '2', label: 'March' },
        { value: '3', label: 'April' },
        { value: '4', label: 'May' },
        { value: '5', label: 'June' },
        { value: '6', label: 'July' },
        { value: '7', label: 'August' },
        { value: '8', label: 'September' },
        { value: '9', label: 'October' },
        { value: '10', label: 'November' },
        { value: '11', label: 'December' }
      ];
      
      // Calculate breakdown
      const memberPayments = {};
      const memberOwes = {};
      group.members.forEach(m => {
        memberPayments[m] = 0;
        memberOwes[m] = 0;
      });
      
      filteredExpenses.forEach(e => {
        memberPayments[e.paidBy] = (memberPayments[e.paidBy] || 0) + parseFloat(e.amount);
        
        if (e.splitType === 'equally') {
          const splitMembers = e.splitMembers || group.members;
          const perPerson = parseFloat(e.amount) / splitMembers.length;
          splitMembers.forEach(m => {
            memberOwes[m] = (memberOwes[m] || 0) + perPerson;
          });
        } else if (e.customSplit) {
          e.customSplit.forEach(s => {
            memberOwes[s.email] = (memberOwes[s.email] || 0) + parseFloat(s.amount);
          });
        }
      });
      
      const totalAmount = filteredExpenses.reduce((sum, e) => sum + parseFloat(e.amount), 0);
      
      const content = document.getElementById('main-content');
      content.innerHTML = `
        <div class="section">
          <div class="section-header">
            <h2 class="section-title">${group.name} <span class="group-code">${group.code}</span></h2>
            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
              <button class="btn-secondary" onclick="addGroupExpense('${groupId}')">➕ Add Expense</button>
              <button class="btn-secondary" onclick="exportGroupPDF('${groupId}')">📄 Export PDF</button>
              <button class="btn-secondary" onclick="leaveGroup('${groupId}')">Leave Group</button>
              <button class="btn-secondary" onclick="renderPage('groups')">← Back</button>
            </div>
          </div>
          
          <div style="margin-bottom: 24px;">
            <h3 style="margin-bottom: 12px;">Members</h3>
            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
              ${group.members.map(m => `
                <span style="padding: 6px 12px; background: var(--bg); border-radius: 6px; font-size: 14px;">${m}</span>
              `).join('')}
            </div>
          </div>
          
          <div style="display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap;">
            <select id="group-year-filter" style="min-width: 150px; padding: 12px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);">
              ${years.map(y => `<option value="${y}" ${selectedYear == y ? 'selected' : ''}>${y === 'all' ? 'All Time' : y}</option>`).join('')}
            </select>
            <select id="group-month-filter" style="min-width: 150px; padding: 12px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);" ${selectedYear === 'all' ? 'disabled' : ''}>
              ${months.map(m => `<option value="${m.value}" ${selectedMonth == m.value ? 'selected' : ''}>${m.label}</option>`).join('')}
            </select>
          </div>
          
          <div class="table-container">
            <h3 style="margin-bottom: 16px;">Group Expenses</h3>
            ${selectedYear === 'all' && Object.keys(groupedExpenses).length > 0 ? 
              Object.keys(groupedExpenses).sort().reverse().map(yearMonth => {
                const [year, month] = yearMonth.split('-');
                const monthName = months.find(m => m.value === String(parseInt(month) - 1))?.label || month;
                const monthExpenses = groupedExpenses[yearMonth];
                const monthTotal = monthExpenses.reduce((sum, e) => sum + parseFloat(e.amount), 0);
                
                return `
                  <h3 style="margin: 24px 0 16px 0; padding: 12px; background: var(--bg); border-left: 4px solid var(--primary); font-size: 18px;">
                    ${monthName} ${year} - Total: ${formatCurrency(monthTotal)}
                  </h3>
                  <table>
                    <thead>
                      <tr>
                        <th>Date</th>
                        <th>Description & Attachments</th>
                        <th>Paid By</th>
                        <th>Split Type</th>
                        <th>Amount</th>
                        <th>Actions</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${renderGroupExpenseRows(groupId, monthExpenses)}
                    </tbody>
                  </table>
                `;
              }).join('') 
            : `
              <table>
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Description & Attachments</th>
                    <th>Paid By</th>
                    <th>Split Type</th>
                    <th>Amount</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  ${renderGroupExpenseRows(groupId, filteredExpenses)}
                </tbody>
              </table>
            `}
          </div>
          
          <div style="margin-top: 24px; padding: 16px; background: var(--bg); border-radius: 8px;">
            <h3 style="margin-bottom: 16px;">Total Group Amount: ${formatCurrency(totalAmount)}</h3>
            
            <h4 style="margin-top: 24px; margin-bottom: 12px;">Breakdown</h4>
            ${group.members.map(m => {
              const paid = memberPayments[m] || 0;
              const owes = memberOwes[m] || 0;
              const balance = paid - owes;
              return `
                <div style="padding: 12px; margin-bottom: 8px; background: var(--card-bg); border-radius: 6px;">
                  <div style="font-weight: 600;">${m}</div>
                  <div style="font-size: 14px; margin-top: 4px;">
                    Total Paid: ${formatCurrency(paid)} | 
                    Owes: ${formatCurrency(owes)} | 
                    <span style="color: ${balance >= 0 ? 'var(--success)' : 'var(--error)'};">
                      ${balance >= 0 ? 'Is Owed' : 'Owes'}: ${formatCurrency(Math.abs(balance))}
                    </span>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
      
      document.getElementById('group-year-filter').addEventListener('change', applyGroupFilters);
      document.getElementById('group-month-filter').addEventListener('change', applyGroupFilters);
    };

    function applyGroupFilters() {
      const year = document.getElementById('group-year-filter').value;
      const month = document.getElementById('group-month-filter').value;
      const monthSelect = document.getElementById('group-month-filter');
      
      if (year === 'all') {
        monthSelect.disabled = true;
        monthSelect.value = 'all';
      } else {
        monthSelect.disabled = false;
      }
      
      window.groupFilters = { year, month };
      const groupId = window.currentViewGroupId;
      if (groupId) viewGroup(groupId);
    }

    function renderGroupExpenseRows(groupId, expensesList) {
      if (expensesList.length === 0) {
        return `<tr><td colspan="6" style="text-align: center;">No expenses yet</td></tr>`;
      }
      
      return expensesList.map((e, idx) => {
        const isEditing = window.editingExpenseIdx === idx;
        const group = mockDB.groups.find(g => g.id === groupId);
        const originalIdx = (group.expenses || []).findIndex(exp => 
          exp.date === e.date && exp.description === e.description && exp.amount === e.amount
        );
        
        if (isEditing) {
          return `
            <tr style="background: var(--bg);">
              <td><input type="date" id="edit-date-${idx}" value="${e.date}" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text);"></td>
              <td>
                <input type="text" id="edit-desc-${idx}" value="${e.description || ''}" placeholder="Description" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text); margin-bottom: 8px;">
                <div>
                  <input type="file" id="edit-files-${idx}" multiple accept="image" style="display: none;">
                  <button type="button" class="btn-small btn-change" onclick="document.getElementById('edit-files-${idx}').click()">📎 Add Files</button>
                  <div id="edit-attachments-${idx}" style="margin-top: 8px;"></div>
                </div>
              </td>
              <td>
                <select id="edit-paidby-${idx}" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text);">
                  ${group.members.map(m => `<option value="${m}" ${e.paidBy === m ? 'selected' : ''}>${m}</option>`).join('')}
                </select>
              </td>
              <td>
                <select id="edit-splittype-${idx}" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text);">
                  <option value="equally" ${e.splitType === 'equally' ? 'selected' : ''}>Split Equally</option>
                  <option value="custom" ${e.splitType === 'custom' ? 'selected' : ''}>Custom Split</option>
                </select>
              </td>
              <td><input type="number" step="0.01" id="edit-amount-${idx}" value="${e.amount}" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text);"></td>
              <td>
                <button class="btn-small btn-change" onclick="saveGroupExpenseEdit('${groupId}', ${originalIdx})">💾</button>
                <button class="btn-small btn-remove" onclick="cancelGroupExpenseEdit()">✕</button>
              </td>
            </tr>
          `;
        }
        
        return `
          <tr>
            <td>${new Date(e.date).toLocaleDateString()}</td>
            <td>
              <div style="margin-bottom: 8px;">${e.description}</div>
              ${e.attachments && e.attachments.length > 0 ? `
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                  ${e.attachments.map((att, attIdx) => `
                    <div style="position: relative; width: 60px; height: 60px; border: 2px solid var(--border); border-radius: 4px; overflow: hidden;">
                      <img src="${att}" alt="Attachment" style="width: 100%; height: 100%; object-fit: cover; cursor: pointer;" onclick="window.open('${att}', '_blank')">
                      <button onclick="removeGroupAttachment('${groupId}', ${originalIdx}, ${attIdx})" style="position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%; border: none; background: rgba(0,0,0,0.6); color: white; font-size: 10px; cursor: pointer;">✕</button>
                    </div>
                  `).join('')}
                </div>
              ` : '<small style="opacity: 0.5;">No attachments</small>'}
            </td>
            <td>${e.paidBy}</td>
            <td>${e.splitType === 'equally' ? 'Split Equally' : 'Custom Split'}${e.splitMembers ? ` (${e.splitMembers.length} members)` : ''}</td>
            <td style="font-weight: 600;">${formatCurrency(e.amount)}</td>
            <td>
              <button class="btn-small btn-change" onclick="editGroupExpenseInline('${groupId}', ${idx})">✏️</button>
              <button class="btn-small btn-remove" onclick="deleteGroupExpense('${groupId}', ${originalIdx})">🗑️</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    window.editGroupExpenseInline = function(groupId, displayIdx) {
      window.editingExpenseIdx = displayIdx;
      window.currentViewGroupId = groupId;
      viewGroup(groupId);
    };

    window.cancelGroupExpenseEdit = function() {
      window.editingExpenseIdx = null;
      const groupId = window.currentViewGroupId;
      if (groupId) viewGroup(groupId);
    };

    window.saveGroupExpenseEdit = function(groupId, originalIdx) {
      const group = mockDB.groups.find(g => g.id === groupId);
      if (!group) return;
      
      const displayIdx = window.editingExpenseIdx;
      const date = document.getElementById(`edit-date-${displayIdx}`).value;
      const description = document.getElementById(`edit-desc-${displayIdx}`).value;
      const paidBy = document.getElementById(`edit-paidby-${displayIdx}`).value;
      const splitType = document.getElementById(`edit-splittype-${displayIdx}`).value;
      const amount = document.getElementById(`edit-amount-${displayIdx}`).value;
      const filesInput = document.getElementById(`edit-files-${displayIdx}`);
      
      let attachments = group.expenses[originalIdx]?.attachments || [];
      
      if (filesInput && filesInput.files.length > 0) {
        // Simulate file upload (in production, upload to server/Firebase)
        Array.from(filesInput.files).forEach(file => {
          attachments.push(URL.createObjectURL(file));
        });
      }
      
      group.expenses[originalIdx] = {
        ...group.expenses[originalIdx],
        date,
        description,
        paidBy,
        splitType,
        amount: parseFloat(amount),
        attachments
      };
      
      saveToDB();
      window.editingExpenseIdx = null;
      showToast('Expense updated!');
      viewGroup(groupId);
    };

    window.removeGroupAttachment = function(groupId, expenseIdx, attachmentIdx) {
      const group = mockDB.groups.find(g => g.id === groupId);
      if (!group || !group.expenses[expenseIdx]) return;
      
      if (confirm('Remove this attachment?')) {
        group.expenses[expenseIdx].attachments.splice(attachmentIdx, 1);
        saveToDB();
        showToast('Attachment removed');
        viewGroup(groupId);
      }
    };

    window.exportGroupPDF = function(groupId) {
      const group = mockDB.groups.find(g => g.id === groupId);
      if (!group) return;
      
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      
      // Blue header
      doc.setFillColor(52, 152, 219);
      doc.rect(0, 0, 210, 25, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(20);
      doc.setFont(undefined, 'bold');
      doc.text(`SplitEra - ${group.name}`, 105, 15, { align: 'center' });
      
      doc.setTextColor(0, 0, 0);
      doc.setFontSize(10);
      doc.text(`Generated: ${new Date().toLocaleDateString()}`, 14, 32);
      doc.text(`Group Code: ${group.code}`, 14, 38);
      
      let yPos = 48;
      
      // Group by year-month
      const groupedExpenses = {};
      (group.expenses || []).forEach(e => {
        const date = new Date(e.date);
        const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
        if (!groupedExpenses[key]) groupedExpenses[key] = [];
        groupedExpenses[key].push(e);
      });
      
      Object.keys(groupedExpenses).sort().reverse().forEach(yearMonth => {
        const [year, month] = yearMonth.split('-');
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const monthName = monthNames[parseInt(month) - 1];
        const monthExpenses = groupedExpenses[yearMonth];
        const monthTotal = monthExpenses.reduce((sum, e) => sum + parseFloat(e.amount), 0);
        
        // Month header
        doc.setFillColor(52, 152, 219);
        doc.rect(14, yPos, 182, 8, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(12);
        doc.setFont(undefined, 'bold');
        doc.text(`${monthName} ${year} - Total: ${formatCurrency(monthTotal)}`, 16, yPos + 5);
        
        yPos += 12;
        
        // Table
        doc.autoTable({
          startY: yPos,
          head: [['Date', 'Description', 'Paid By', 'Split Type', 'Amount']],
          body: monthExpenses.map(e => [
            new Date(e.date).toLocaleDateString(),
            e.description || 'N/A',
            e.paidBy || 'N/A',
            e.splitType === 'equally' ? 'Split Equally' : 'Custom Split',
            formatCurrency(e.amount)
          ]),
          theme: 'grid',
          headStyles: { fillColor: [52, 152, 219] },
          margin: { left: 14, right: 14 }
        });
        
        yPos = doc.lastAutoTable.finalY + 10;
        
        // Check if need new page
        if (yPos > 270) {
          doc.addPage();
          yPos = 20;
        }
      });
      
      doc.save(`splitera-group-${group.name.replace(/\s+/g, '-').toLowerCase()}.pdf`);
      showToast('Group PDF exported! 📄');
    };

    window.addGroupExpense = function(groupId) {
      const group = mockDB.groups.find(g => g.id === groupId);
      if (!group) return;
      
      const modalHTML = `
        <div class="modal-overlay" onclick="if(event.target === this) closeModal()">
          <div class="modal">
            <div class="modal-header">
              <h3 class="modal-title">Add Group Expense</h3>
              <button type="button" class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <form id="group-expense-form">
              <div class="form-group">
                <label>Description</label>
                <input type="text" name="description" required>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Amount</label>
                  <input type="number" step="0.01" name="amount" id="expense-amount" required>
                </div>
                <div class="form-group">
                  <label>Date</label>
                  <input type="date" name="date" value="${new Date().toISOString().split('T')[0]}" required>
                </div>
              </div>
              <div class="form-group">
                <label>Paid By</label>
                <select name="paidBy" required>
                  ${group.members.map(m => `<option value="${m}">${m}</option>`).join('')}
                </select>
              </div>
              <div class="form-group">
                <label>Split Type</label>
                <select name="splitType" id="split-type-select" required>
                  <option value="equally">Split Equally</option>
                  <option value="custom">Custom Split</option>
                </select>
              </div>
              <div class="form-group" id="split-members-section">
                <label>Select Members to Split With</label>
                ${group.members.map(m => `
                  <div style="margin-bottom: 8px;">
                    <label style="display: flex; align-items: center; gap: 8px;">
                      <input type="checkbox" name="splitMembers" value="${m}" checked>
                      <span>${m}</span>
                    </label>
                  </div>
                `).join('')}
              </div>
              <div class="form-group" id="custom-split-section" style="display: none;">
                <label>Custom Split Amounts</label>
                ${group.members.map(m => `
                  <div style="display: flex; gap: 12px; margin-bottom: 8px; align-items: center;">
                    <label style="flex: 1;">${m}</label>
                    <input type="number" step="0.01" name="customSplit_${m}" class="custom-split-input" placeholder="0.00" style="width: 120px; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text);">
                  </div>
                `).join('')}
                <div id="split-total" style="margin-top: 12px; padding: 12px; background: var(--bg); border-radius: 6px; font-weight: 600;"></div>
              </div>
              <div class="form-group">
                <label>Attachments (optional)</label>
                <input type="file" id="expense-files" multiple accept="image" style="padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text);">
              </div>
              <button type="submit" class="btn-primary">Add Expense</button>
            </form>
          </div>
        </div>
      `;
      
      document.body.insertAdjacentHTML('beforeend', modalHTML);
      
      const splitTypeSelect = document.getElementById('split-type-select');
      const splitMembersSection = document.getElementById('split-members-section');
      const customSplitSection = document.getElementById('custom-split-section');
      const amountInput = document.getElementById('expense-amount');
      
      splitTypeSelect.addEventListener('change', function() {
        if (this.value === 'equally') {
          splitMembersSection.style.display = 'block';
          customSplitSection.style.display = 'none';
        } else {
          splitMembersSection.style.display = 'none';
          customSplitSection.style.display = 'block';
          updateSplitTotal();
        }
      });
      
      function updateSplitTotal() {
        const totalAmount = parseFloat(amountInput.value) || 0;
        let splitTotal = 0;
        document.querySelectorAll('.custom-split-input').forEach(input => {
          splitTotal += parseFloat(input.value) || 0;
        });
        const splitTotalDiv = document.getElementById('split-total');
        const difference = totalAmount - splitTotal;
        splitTotalDiv.innerHTML = `
          Total Amount: ${formatCurrency(totalAmount)}<br>
          Split Total: ${formatCurrency(splitTotal)}<br>
          <span style="color: ${Math.abs(difference) < 0.01 ? 'var(--success)' : 'var(--error)'};">
            Difference: ${formatCurrency(difference)}
          </span>
        `;
      }
      
      amountInput.addEventListener('input', updateSplitTotal);
      document.querySelectorAll('.custom-split-input').forEach(input => {
        input.addEventListener('input', updateSplitTotal);
      });
      
      document.getElementById('group-expense-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = {};
        formData.forEach((value, key) => {
          if (!key.startsWith('customSplit_') && key !== 'splitMembers') {
            data[key] = value;
          }
        });
        
        // Get split members
        let splitMembers = [];
        if (data.splitType === 'equally') {
          const checkboxes = document.querySelectorAll('input[name="splitMembers"]:checked');
          splitMembers = Array.from(checkboxes).map(cb => cb.value);
          
          if (splitMembers.length === 0) {
            showToast('Select at least one member to split with', true);
            return;
          }
        }
        
        // Get custom split
        let customSplit = [];
        if (data.splitType === 'custom') {
          group.members.forEach(m => {
            const amount = formData.get(`customSplit_${m}`);
            if (amount && parseFloat(amount) > 0) {
              customSplit.push({ email: m, amount: parseFloat(amount) });
            }
          });
          
          const totalAmount = parseFloat(data.amount);
          const splitTotal = customSplit.reduce((sum, s) => sum + s.amount, 0);
          
          if (Math.abs(totalAmount - splitTotal) > 0.01) {
            showToast('Custom split amounts must equal total amount', true);
            return;
          }
        }
        
        // Handle file attachments
        let attachments = [];
        const filesInput = document.getElementById('expense-files');
        if (filesInput.files.length > 0) {
          Array.from(filesInput.files).forEach(file => {
            attachments.push(URL.createObjectURL(file));
          });
        }
        
        const expense = {
          ...data,
          amount: parseFloat(data.amount),
          splitMembers: splitMembers,
          customSplit: customSplit,
          attachments: attachments,
          createdAt: new Date().toISOString()
        };
        
        group.expenses = group.expenses || [];
        group.expenses.push(expense);
        
        saveToDB();
        loadUserData();
        closeModal();
        showToast('Expense added!');
        window.currentViewGroupId = groupId;
        viewGroup(groupId);
      });
    };

    window.deleteGroupExpense = function(groupId, expenseIndex) {
      if (!confirm('Delete this expense?')) return;

      group.expenses.splice(expenseIndex, 1);

                font-size: 1.25rem;
                color: var(--text);
            }

            .group-body {
                margin-bottom: 1rem;
            }

            .group-body p {
                margin: 0.5rem 0;
                color: var(--text-gray);
            }

            .group-footer {
                display: flex;
                gap: 0.5rem;
                padding-top: 1rem;
                border-top: 1px solid var(--border);
            }

            /* Attachments Display */
            .attachments {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .attachment {
                position: relative;
                width: 60px;
                height: 60px;
                border-radius: 4px;
                overflow: hidden;
                border: 1px solid var(--border);
                cursor: pointer;
                transition: all 0.2s ease;
            }

            .attachment:hover {
                transform: scale(1.05);
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            }

            .attachment img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .attachment-remove {
                position: absolute;
                top: 2px;
                right: 2px;
                background: var(--danger);
                color: white;
                border: none;
                border-radius: 50%;
                width: 20px;
                height: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                font-size: 0.7rem;
                opacity: 0;
                transition: opacity 0.2s ease;
            }

            .attachment:hover .attachment-remove {
                opacity: 1;
            }

            .attachment-download {
                position: absolute;
                bottom: 2px;
                right: 2px;
                background: var(--primary);
                color: white;
                border: none;
                border-radius: 50%;
                width: 20px;
                height: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                font-size: 0.7rem;
                opacity: 0;
                transition: opacity 0.2s ease;
                text-decoration: none;
            }

            .attachment:hover .attachment-download {
                opacity: 1;
            }

            .attachment-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 0.5rem;
            }

            /* Editing Row Highlight */
            .table tbody tr.editing {
                background: rgba(255, 153, 51, 0.1);
                border: 2px solid var(--primary);
            }

            /* Password Input Wrapper */
            .password-input-wrapper {
                position: relative;
            }

            .password-toggle {
                position: absolute;
                right: 10px;
                top: 50%;
                transform: translateY(-50%);
                background: none;
                border: none;
                color: var(--text-gray);
                cursor: pointer;
                padding: 0.5rem;
                font-size: 1rem;
            }

            .password-toggle:hover {
                color: var(--primary);
            }

            /* Form Actions */
            .form-actions {
                display: flex;
                gap: 1rem;
                justify-content: flex-end;
                margin-top: 1.5rem;
                padding-top: 1.5rem;
                border-top: 1px solid var(--border);
            }

            /* Responsive Adjustments */
            @media (max-width: 768px) {
                .calendar-grid {
                    font-size: 0.8rem;
                }

                .calendar-day {
                    min-height: 80px;
                    padding: 0.25rem;
                }

                .calendar-day-number {
                    font-size: 0.9rem;
                }

                .calendar-day-info {
                    font-size: 0.75rem;
                }

                .profile-display {
                    flex-direction: column;
                    align-items: center;
                    text-align: center;
                }

                .profile-field {
                    flex-direction: column;
                    gap: 0.25rem;
                }

                .profile-field label {
                    min-width: auto;
                }

                .settings-grid {
                    grid-template-columns: 1fr;
                }

                .groups-grid {
                    grid-template-columns: 1fr;
                }

                .month-header {
                    font-size: 1rem;
                }
            }

            @media (max-width: 480px) {
                .calendar-day {
                    min-height: 60px;
                    padding: 0.2rem;
                }

                .calendar-day-icon {
                    display: none;
                }
            }

            /* Print Styles */
            @media print {
                .sidebar,
                .navbar,
                .btn,
                .actions,
                .filters {
                    display: none !important;
                }

                .main-content {
                    margin-left: 0;
                    padding: 1rem;
                }

                .card {
                    box-shadow: none;
                    page-break-inside: avoid;
                }

                .table {
                    font-size: 0.9rem;
                }
            }
        `;

        // Inject additional styles
        const styleSheet = document.createElement('style');
        styleSheet.textContent = additionalStyles;
        document.head.appendChild(styleSheet);

        // Utility Functions
        function getMonthName(monthIndex) {
            const months = [
                'January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'
            ];
            return months[monthIndex];
        }

        function generateGroupCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 8; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function filterBySearch(data, searchTerm, fields) {
            if (!searchTerm) return data;

            const term = searchTerm.toLowerCase();
            return data.filter(item => {
                return fields.some(field => {
                    const value = item[field];
                    if (value === null || value === undefined) return false;

                    // Handle date fields - UPDATED
                    if (field === 'date') {
                        const dateObj = safeDate(value); // Use safeDate helper
                        const dateStr = dateObj.toLocaleDateString().toLowerCase();
                        const monthName = getMonthName(dateObj.getMonth()).toLowerCase();
                        return dateStr.includes(term) || monthName.includes(term);
                    }

                    // Handle amount fields
                    if (field === 'amount') {
                        return value.toString().includes(term);
                    }

                    // Handle string fields
                    return value.toString().toLowerCase().includes(term);
                });
            });
        }

        function filterByYearMonth(data, year, month) {
            if (year === 'all' && month === 'all') return data;

            return data.filter(item => {
                const itemDate = safeDate(item.date); // Use safeDate helper

                if (year !== 'all' && itemDate.getFullYear() !== parseInt(year)) {
                    return false;
                }

                if (month !== 'all' && itemDate.getMonth() !== parseInt(month)) {
                    return false;
                }

                return true;
            });
        }

        function groupByMonth(data) {
            const grouped = {};

            data.forEach(item => {
                const date = safeDate(item.date); // Use safeDate helper
                const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;

                if (!grouped[key]) {
                    grouped[key] = [];
                }

                grouped[key].push(item);
            });

            return grouped;
        }

        function viewAttachment(url) {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay show';
            modal.innerHTML = `
                <div class="modal modal-large">
                    <div class="modal-header">
                        <h3 class="modal-title">Attachment Preview</h3>
                        <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="modal-body" style="text-align: center;">
                        <img src="${url}" alt="Attachment" style="max-width: 100%; max-height: 70vh; border-radius: 8px;">
                    </div>
                    <div class="modal-footer">
                        <a href="${url}" download class="btn btn-primary">
                            <i class="fas fa-download"></i>
                            Download
                        </a>
                        <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">
                            Close
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = event.currentTarget.querySelector('i');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }


        function formatDate(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleDateString();
        }

        function formatDateTime(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return date.toLocaleString();
        }

        function showConfirmation(title, message, onConfirm) {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay show';
            modal.innerHTML = `
                <div class="modal">
                    <div class="modal-header">
                        <h3 class="modal-title">${title}</h3>
                        <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="modal-body">
                        <p>${message}</p>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">
                            ${t('cancel')}
                        </button>
                        <button class="btn btn-danger" onclick="confirmAction()">
                            ${t('confirm')}
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            window.confirmAction = () => {
                modal.remove();
                onConfirm();
            };
        }

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        function throttle(func, limit) {
            let inThrottle;
            return function () {
                const args = arguments;
                const context = this;
                if (!inThrottle) {
                    func.apply(context, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            };
        }

        // Search with debounce
        const debouncedSearch = debounce((searchTerm) => {
            if (currentPage === 'details') {
                loadDetails();
            } else if (currentPage === 'credit') {
                loadCredits();
            } else if (currentPage === 'personal') {
                loadPersonalExpenses();
            }
        }, 300);

        // Error Boundary
        window.addEventListener('error', (event) => {
            console.error('Global error:', event.error);
            showToast('Error', 'An unexpected error occurred', 'error');
        });

        window.addEventListener('unhandledrejection', (event) => {
            console.error('Unhandled promise rejection:', event.reason);
            showToast('Error', 'An unexpected error occurred', 'error');
        });



        // Auto-save functionality for forms
        let autoSaveTimeout;
        function enableAutoSave(formId, saveCallback) {
            const form = document.getElementById(formId);
            if (!form) return;

            const inputs = form.querySelectorAll('input, textarea, select');
            inputs.forEach(input => {
                input.addEventListener('input', () => {
                    clearTimeout(autoSaveTimeout);
                    autoSaveTimeout = setTimeout(() => {
                        const draftData = new FormData(form);
                        localStorage.setItem(`draft_${formId}`, JSON.stringify(Object.fromEntries(draftData)));
                        showToast('Info', 'Draft saved', 'info');
                    }, 2000);
                });
            });
        }

        function loadDraft(formId) {
            const draftData = localStorage.getItem(`draft_${formId}`);
            if (!draftData) return;

            const data = JSON.parse(draftData);
            const form = document.getElementById(formId);
            if (!form) return;

            Object.keys(data).forEach(key => {
                const input = form.querySelector(`[name="${key}"]`);
                if (input) {
                    input.value = data[key];
                }
            });
        }

        function clearDraft(formId) {
            localStorage.removeItem(`draft_${formId}`);
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Ctrl/Cmd + K for search
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                const searchInput = document.querySelector('input[type="text"]');
                if (searchInput) searchInput.focus();
            }

            // Escape to close modals
            if (e.key === 'Escape') {
                const modal = document.querySelector('.modal-overlay');
                if (modal) modal.remove();
            }

            // Ctrl/Cmd + S to save (if in edit mode)
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                if (editingRowId) {
                    // Trigger save based on current page
                    if (currentPage === 'credit') {
                        const parts = editingRowId.split('-');
                        saveEditCredit(parts[1]);
                    } else if (currentPage === 'personal') {
                        const parts = editingRowId.split('-');
                        saveEditPersonal(parts[1]);
                    }
                }
            }
        });

        // Accessibility improvements
        function improveAccessibility() {
            // Add ARIA labels to buttons without text
            document.querySelectorAll('button:not([aria-label])').forEach(btn => {
                const icon = btn.querySelector('i');
                if (icon && !btn.textContent.trim()) {
                    const classes = icon.className.split(' ');
                    const iconType = classes.find(c => c.startsWith('fa-'));
                    if (iconType) {
                        const label = iconType.replace('fa-', '').replace(/-/g, ' ');
                        btn.setAttribute('aria-label', label);
                    }
                }
            });

            // Add role to interactive elements
            document.querySelectorAll('.action-btn, .attachment').forEach(el => {
                if (!el.getAttribute('role')) {
                    el.setAttribute('role', 'button');
                }
            });
        }

        // Call accessibility improvements after DOM updates
        const observer = new MutationObserver(() => {
            improveAccessibility();
        });

        observer.observe(document.body, {
            childList: true,
            subtree: true
        });

        // Export functions for global use
        window.splitera = {
            formatCurrency,
            formatDate,
            formatDateTime,
            showConfirmation,
            debounce,
            throttle,
            enableAutoSave,
            loadDraft,
            clearDraft
        };

        // Navigation
        async function navigate(pageId) {
            currentPage = pageId;

            // Update nav links
            document.querySelectorAll('.nav-link, .mobile-nav-link').forEach(link => {
                link.classList.toggle('active', link.dataset.page === pageId);
            });

            // Close mobile menu
            const mobileMenu = document.getElementById('mobileMenu');
            if (mobileMenu) {
                mobileMenu.classList.remove('show');
            }

            // Close user dropdown
            const userDropdown = document.getElementById('userDropdown');
            if (userDropdown) {
                userDropdown.classList.remove('show');
            }

            try {
                switch (pageId) {
                    case 'dashboard': await renderDashboard(); break;
                    case 'credits': await renderCredits(); break;
                    case 'personal': await renderPersonal(); break;
                    case 'groups': await renderGroups(); break;
                    case 'calendar': await renderCalendar(); break;
                    case 'details': await renderDetails(); break;
                    case 'settings': await renderSettings(); break;
                    default: await renderDashboard();
                }
                translateApp();
            } catch (error) {
                console.error('Navigation error:', error);
                showToast('Error', 'Failed to load page: ' + error.message, 'error');
            }
        }

        function mobileNavigate(pageId) {
            navigate(pageId);
        }

        // Add event listeners to desktop nav links
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const page = link.dataset.page;
                    if (page) navigate(page);
                });
            });
        });


        // Initialize app
        firebase.auth().onAuthStateChanged(async (user) => {
            console.log('🔐 Auth state:', user ? 'Logged in' : 'Logged out');

            if (user) {
                try {
                    showLoading();
                    console.log('📥 Loading user from:', user.uid);

                    // Try to get user document
                    const userDoc = await db.collection('users').doc(user.uid).get();

                    if (userDoc.exists) {
                        const userData = userDoc.data();

                        // Build complete user object
                        currentUser = {
                            uid: user.uid,
                            email: user.email,
                            userId: userData.userId || user.uid.substring(0, 8),
                            firstName: userData.firstName || 'User',
                            lastName: userData.lastName || '',
                            phone: userData.phone || '',
                            photoUrl: userData.photoUrl || '',
                            currency: userData.currency || 'USD',
                            country: userData.country || 'US',
                            language: userData.language || 'en',
                            darkMode: userData.darkMode || false
                        };

                        console.log('✅ User loaded:', currentUser.firstName);

                        // Apply user preferences
                        localStorage.setItem('currency', currentUser.currency);
                        localStorage.setItem('country', currentUser.country);
                        localStorage.setItem('language', currentUser.language);
                        currentLanguage = currentUser.language;

                        if (currentUser.darkMode) {
                            document.body.classList.add('dark-mode');
                        } else {
                            document.body.classList.remove('dark-mode');
                        }

                        // Show dashboard
                        renderMainLayout();
                        currentPage = 'dashboard';
                        await navigate('dashboard');

                        hideLoading();
                        console.log('✅ Dashboard loaded');

                    } else {
                        // User document doesn't exist - this is a new user from signup
                        console.log('⚠️ User document not found, might be new signup');

                        // Check if this is right after signup
                        const signupData = sessionStorage.getItem('newUserData');
                        if (signupData) {
                            // Create user document from signup data
                            const newUserData = JSON.parse(signupData);
                            await db.collection('users').doc(user.uid).set({
                                userId: user.uid.substring(0, 8),
                                email: user.email,
                                firstName: newUserData.firstName || 'User',
                                lastName: newUserData.lastName || '',
                                phone: newUserData.phone || '',
                                currency: 'USD',
                                country: 'US',
                                language: 'en',
                                darkMode: false,
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            });

                            sessionStorage.removeItem('newUserData');

                            // Reload to get the new user data
                            window.location.reload();
                        } else {
                            showToast('Error', 'User profile not found. Please sign up again.', 'error');
                            await firebase.auth().signOut();
                            renderAuthPage();
                        }

                        hideLoading();
                    }

                } catch (error) {
                    console.error('❌ Error loading user:', error);
                    console.error('Error code:', error.code);
                    console.error('Error message:', error.message);

                    if (error.code === 'permission-denied') {
                        showToast('Error', 'Permission denied. Please check Firestore rules.', 'error');
                    } else {
                        showToast('Error', 'Failed to load user: ' + error.message, 'error');
                    }

                    await firebase.auth().signOut();
                    renderAuthPage();
                    hideLoading();
                }
            } else {
                // User logged out
                console.log('🔓 No user, showing login');
                renderAuthPage();
            }
        });

        // Close dropdowns when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.user-menu')) {
                document.getElementById('userDropdown')?.classList.remove('show');
            }
        });
    </script>

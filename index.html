 <head>

  <style>
    body {
      box-sizing: border-box;
    }
    
    *, *::before, *::after {
      box-sizing: inherit;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #FF8C42;
      --secondary: #D35400;
      --accent: #F39C12;
      --bg: #FDFEFE;
      --text: #2C3E50;
      --card-bg: #FFFFFF;
      --border: #E8E8E8;
      --success: #27AE60;
      --error: #E74C3C;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    [data-theme="dark"] {
      --bg: #1A1A2E;
      --text: #EAEAEA;
      --card-bg: #16213E;
      --border: #0F3460;
      --shadow: rgba(0, 0, 0, 0.3);
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }

    #app {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      overflow: auto;
    }

    /* Toast Notifications */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background: var(--card-bg);
      padding: 16px 24px;
      border-radius: 8px;
      box-shadow: 0 4px 12px var(--shadow);
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 300px;
      animation: slideIn 0.3s ease;
      border-left: 4px solid var(--success);
    }

    .toast.error {
      border-left-color: var(--error);
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* Loading Spinner */
    .spinner {
      border: 3px solid var(--border);
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Auth Page */
    .auth-page {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .auth-page::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      top: -100px;
      right: -100px;
    }

    .auth-page::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      bottom: -150px;
      left: -150px;
    }

    .auth-card {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 500px;
      position: relative;
      z-index: 1;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-logo h1 {
      font-size: 32px;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .auth-logo p {
      color: var(--text);
      opacity: 0.7;
    }

    .auth-tabs {
      display: flex;
      gap: 16px;
      margin-bottom: 32px;
      border-bottom: 2px solid var(--border);
    }

    .auth-tab {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      position: relative;
      transition: color 0.3s;
    }

    .auth-tab.active {
      color: var(--primary);
    }

    .auth-tab.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--primary);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text);
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      transition: border-color 0.3s;
      font-family: inherit;
    }

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-primary:hover {
      background: var(--secondary);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Header */
    .header {
      background: var(--card-bg);
      border-bottom: 2px solid var(--primary);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 12px var(--shadow);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 1px 1px 2px var(--shadow);
    }

    .nav-links {
      display: flex;
      gap: 4px;
    }

    .nav-link {
      padding: 10px 18px;
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      transition: all 0.3s;
      position: relative;
    }

    .nav-link:hover {
      background: var(--bg);
      transform: translateY(-2px);
    }

    .nav-link.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 8px rgba(255, 140, 66, 0.3);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .theme-toggle {
      background: none;
      border: none;
      padding: 8px;
      cursor: pointer;
      font-size: 20px;
      border-radius: 6px;
      transition: background 0.3s;
    }

    .theme-toggle:hover {
      background: var(--bg);
    }

    .user-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      border: 3px solid var(--primary);
      box-shadow: 0 2px 8px rgba(255, 140, 66, 0.4);
      transition: all 0.3s;
    }

    .user-avatar:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 12px rgba(255, 140, 66, 0.6);
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Mobile Menu */
    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--text);
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }

    /* Dashboard */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 4px 16px var(--shadow);
      border-left: 5px solid var(--primary);
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 100px;
      height: 100px;
      background: var(--primary);
      opacity: 0.05;
      border-radius: 50%;
      transform: translate(30%, -30%);
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px var(--shadow);
    }

    .stat-card h3 {
      font-size: 14px;
      color: var(--text);
      opacity: 0.8;
      margin-bottom: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 36px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    /* Sections */
    .section {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px var(--shadow);
      margin-bottom: 24px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .section-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
    }

    .btn-secondary {
      padding: 10px 20px;
      background: var(--secondary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-secondary:hover {
      background: var(--primary);
    }

    /* Tables */
    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 12px;
      background: var(--bg);
      font-weight: 600;
      color: var(--text);
    }

    td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    tr:hover {
      background: var(--bg);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      padding: 20px;
    }

    .modal {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 32px;
      max-width: 600px;
      width: 100%;
      max-height: 90%;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-title {
      font-size: 24px;
      font-weight: 700;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--text);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* Groups */
    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    .group-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px var(--shadow);
      border-left: 4px solid var(--accent);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .group-card:hover {
      transform: translateY(-2px);
    }

    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .group-name {
      font-size: 20px;
      font-weight: 700;
    }

    .group-code {
      background: var(--primary);
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .group-members {
      font-size: 14px;
      color: var(--text);
      opacity: 0.7;
      margin-bottom: 16px;
    }

    .group-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .btn-small {
      padding: 8px 16px;
      font-size: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    .btn-change {
      background: var(--primary);
      color: white;
    }

    .btn-remove {
      background: var(--error);
      color: white;
    }

    .pending-requests {
      background: var(--bg);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 24px;
    }

    .request-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: var(--card-bg);
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .request-actions {
      display: flex;
      gap: 8px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header-left {
        gap: 12px;
      }

      .nav-links {
        display: none;
      }

      .mobile-menu-btn {
        display: block;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .groups-grid {
        grid-template-columns: 1fr;
      }

      .main-content {
        padding: 16px;
      }

      .section {
        padding: 16px;
      }
    }
  </style>

    function handleAuth(event) {
      event.preventDefault();
      const form = event.target;
      const formData = new FormData(form);
      const data = {};
      formData.forEach((value, key) => {
        data[key] = value;
      });
      const isSignup = !!data.firstName;
      
      if (isSignup) {
        // Check if user exists
        const existingUser = mockDB.users.find(u => u.email === data.email);
        if (existingUser) {
          showToast('Email already registered', true);
          return;
        }
        
        // Handle profile photo
        let profilePhoto = null;
        const photoInput = document.querySelector('input[name="profilePhoto"]');
        if (photoInput && photoInput.files.length > 0) {
          profilePhoto = URL.createObjectURL(photoInput.files[0]);
        }
        
        // Create new user
        const newUser = {
          id: Date.now().toString(),
          userId: generateUserId(data.firstName, data.lastName, data.email),
          firstName: data.firstName,
          lastName: data.lastName,
          email: data.email,
          password: data.password, // In production, hash this!
          contact: `${data.countryCode}${data.contact}`,
          countryCode: data.countryCode,
          profilePhoto: profilePhoto,
          createdAt: new Date().toISOString()
        };
        
        // Show OTP modal for signup
        showOTPModal(newUser, true);
        
      } else {
        // Login - check credentials first
        const user = mockDB.users.find(u => (u.email === data.email || u.userId === data.email) && u.password === data.password);
        if (!user) {
          showToast('Invalid credentials', true);
          return;
        }
        
        // Show OTP modal for login
        showOTPModal(user, false);
      }
    }

    window.savePersonalEdit = function(originalIdx, displayIdx) {
      const date = document.getElementById(`edit-personal-date-${displayIdx}`).value;
      const description = document.getElementById(`edit-personal-desc-${displayIdx}`).value;
      const category = document.getElementById(`edit-personal-category-${displayIdx}`).value;
      const mode = document.getElementById(`edit-personal-mode-${displayIdx}`).value;
      const remarks = document.getElementById(`edit-personal-remarks-${displayIdx}`).value;
      const amount = document.getElementById(`edit-personal-amount-${displayIdx}`).value;
      const filesInput = document.getElementById(`edit-personal-files-${displayIdx}`);
      
      let attachments = expenses[originalIdx]?.attachments || [];
      if (filesInput && filesInput.files.length > 0) {
        Array.from(filesInput.files).forEach(file => {
          attachments.push(URL.createObjectURL(file));
        });
      }
      
      expenses[originalIdx] = {
        ...expenses[originalIdx],
        date,
        description,
        category,
        mode,
        remarks,
        amount: parseFloat(amount),
        attachments
      };
      
      mockDB.expenses = mockDB.expenses.map(e => e.id === expenses[originalIdx].id ? expenses[originalIdx] : e);
      saveToDB();
      window.editingPersonalIdx = null;
      showToast('Expense updated! âœ…');
      renderPersonal(document.getElementById('main-content'));

    function renderCredits(content) {
      const selectedYear = window.creditsFilters?.year || 'all';
      const selectedMonth = window.creditsFilters?.month || 'all';
      const searchQuery = window.creditsFilters?.search || '';
      
      let filteredCredits = credits.slice();
      
      // Apply search
      if (searchQuery) {
        filteredCredits = filteredCredits.filter(c => {
          const searchStr = `${c.date} ${c.description || ''} ${c.source || ''} ${c.amount} ${c.mode || ''} ${c.remarks || ''}`.toLowerCase();
          return searchStr.includes(searchQuery.toLowerCase());
        });
      }
      
      // Apply year/month filters
      if (selectedYear !== 'all') {
        filteredCredits = filteredCredits.filter(c => new Date(c.date).getFullYear() === parseInt(selectedYear));
        if (selectedMonth !== 'all') {
          filteredCredits = filteredCredits.filter(c => new Date(c.date).getMonth() === parseInt(selectedMonth));
        }
      }
      
      // Sort by date descending
      filteredCredits.sort((a, b) => new Date(b.date) - new Date(a.date));
      
      // Group by year-month for all-time view
      const groupedCredits = {};
      if (selectedYear === 'all') {
        filteredCredits.forEach(c => {
          const date = new Date(c.date);
          const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
          if (!groupedCredits[key]) groupedCredits[key] = [];
          groupedCredits[key].push(c);
        });
      }
      
      const years = ['all', ...new Set(credits.map(c => new Date(c.date).getFullYear()))].sort((a, b) => {
        if (a === 'all') return -1;
        if (b === 'all') return 1;
        return b - a;
      });
      
      const months = [
        { value: 'all', label: 'All Time' },
        { value: '0', label: 'January' }, { value: '1', label: 'February' }, { value: '2', label: 'March' },
        { value: '3', label: 'April' }, { value: '4', label: 'May' }, { value: '5', label: 'June' },
        { value: '6', label: 'July' }, { value: '7', label: 'August' }, { value: '8', label: 'September' },
        { value: '9', label: 'October' }, { value: '10', label: 'November' }, { value: '11', label: 'December' }

      const totalAmount = filteredCredits.reduce((sum, c) => sum + parseFloat(c.amount), 0);

          <div style="padding: 20px; background: var(--success); color: white; border-radius: 12px; margin-bottom: 24px; text-align: center;">
            <div style="font-size: 16px; margin-bottom: 8px; opacity: 0.9;">Total Credits</div>
            <div style="font-size: 42px; font-weight: 800;">${formatCurrency(totalAmount)}</div>
          </div>
          
          <div style="display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap;">
            <input type="text" id="credits-search" placeholder="Search by date, amount, description, mode, remarks..." value="${searchQuery}" style="flex: 1; min-width: 200px; padding: 12px 16px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-weight: 500;">
            <select id="credits-year-filter" style="min-width: 140px; padding: 10px 14px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-weight: 500;">
              ${years.map(y => `<option value="${y}" ${selectedYear == y ? 'selected' : ''}>${y === 'all' ? 'All Time' : y}</option>`).join('')}
            </select>
            <select id="credits-month-filter" style="min-width: 140px; padding: 10px 14px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-weight: 500;" ${selectedYear === 'all' ? 'disabled' : ''}>
              ${months.map(m => `<option value="${m.value}" ${selectedMonth == m.value ? 'selected' : ''}>${m.label}</option>`).join('')}
            </select>
          </div>
          
          <div class="table-container">
            ${selectedYear === 'all' && Object.keys(groupedCredits).length > 0 ?
              Object.keys(groupedCredits).sort().reverse().map(yearMonth => {
                const [year, month] = yearMonth.split('-');
                const monthName = months.find(m => m.value === String(parseInt(month) - 1))?.label || month;
                const monthCredits = groupedCredits[yearMonth];
                const monthTotal = monthCredits.reduce((sum, c) => sum + parseFloat(c.amount), 0);
                
                return `

                  <table>
                    <thead>
                      <tr>
                        <th>Date</th>
                        <th>Description & Attachments</th>
                        <th>Source</th>
                        <th>Mode</th>
                        <th>Remarks</th>
                        <th>Amount</th>
                        <th>Actions</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${renderCreditRows(monthCredits)}
                    </tbody>
                  </table>
                `;
              }).join('')
            : `
              <table>
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Description & Attachments</th>
                    <th>Source</th>
                    <th>Mode</th>
                    <th>Remarks</th>

                </thead>
                <tbody>
                  ${renderCreditRows(filteredCredits)}

      document.getElementById('credits-search').addEventListener('input', applyCreditsFilters);

        if (isEditing) {
          return `
            <tr style="background: var(--bg);">
              <td><input type="date" id="edit-credit-date-${idx}" value="${c.date}" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text);"></td>

                  <option value="Cash" ${c.mode === 'Cash' ? 'selected' : ''}>Cash</option>
                  <option value="Online" ${c.mode === 'Online' ? 'selected' : ''}>Online</option>
                  <option value="GPay" ${c.mode === 'GPay' ? 'selected' : ''}>GPay</option>

              <td><input type="text" id="edit-credit-remarks-${idx}" value="${c.remarks || ''}" placeholder="Remarks" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text);"></td>
              <td><input type="number" step="0.01" id="edit-credit-amount-${idx}" value="${c.amount}" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text);"></td>
              <td>
                <button class="btn-small btn-change" onclick="saveCreditEdit(${originalIdx}, ${idx})">ðŸ’¾</button>
                <button class="btn-small btn-remove" onclick="cancelCreditEdit()">âœ•</button>

        }
        
        return `

                    <div style="position: relative; width: 60px; height: 60px; border: 2px solid var(--border); border-radius: 6px; overflow: hidden;">
                      <img src="${att}" alt="Attachment" style="width: 100%; height: 100%; object-fit: cover; cursor: pointer;" onclick="window.open('${att}', '_blank')">

                    </div>

    window.addCredit = function() {
      const modalHTML = `
        <div class="modal-overlay" onclick="if(event.target === this) closeModal()">
          <div class="modal">
            <div class="modal-header">
              <h3 class="modal-title">Add Credit</h3>

                  <option value="Cash">Cash</option>

                  <option value="GPay">GPay</option>
                  <option value="Card">Card</option>
                </select>
              </div>
              
              <div class="form-group">
                <label>Remarks (optional)</label>
                <textarea name="remarks" rows="3"></textarea>
              </div>
              
              <div class="form-group">

              </div>
              
              <button type="submit" class="btn-primary">Add Credit</button>
            </form>
          </div>
        </div>
      `;
      
      document.body.insertAdjacentHTML('beforeend', modalHTML);
      
      // File preview
      document.getElementById('credit-files').addEventListener('change', function(e) {
        const preview = document.getElementById('credit-preview');
        preview.innerHTML = '';
        Array.from(e.target.files).forEach((file, idx) => {
          const reader = new FileReader();
          reader.onload = function(event) {
            preview.innerHTML += `
              <div style="position: relative; aspect-ratio: 1; border: 2px solid var(--border); border-radius: 6px; overflow: hidden;">
                <img src="${event.target.result}" style="width: 100%; height: 100%; object-fit: cover;">
                <button type="button" onclick="removePreviewFile('credit-files', 'credit-preview', ${idx})" style="position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: none; background: rgba(0,0,0,0.7); color: white; font-size: 12px; cursor: pointer; font-weight: 700;">âœ•</button>
              </div>
            `;
          };
          reader.readAsDataURL(file);
        });
      });
      
      document.getElementById('add-credit-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const filesInput = document.getElementById('credit-files');
        
        let attachments = [];
        if (filesInput.files.length > 0) {
          Array.from(filesInput.files).forEach(file => {
            attachments.push(URL.createObjectURL(file));
          });
        }
        
        const newCredit = {
          id: Date.now().toString(),
          userId: currentUser.id,
          date: formData.get('date'),
          description: formData.get('description'),
          source: formData.get('source'),
          mode: formData.get('mode'),
          remarks: formData.get('remarks'),
          amount: parseFloat(formData.get('amount')),
          attachments: attachments,
          createdAt: new Date().toISOString()
        };
        
        credits.push(newCredit);
        mockDB.credits.push(newCredit);
        saveToDB();
        
        closeModal();
        showToast('Credit added successfully! ðŸ’°');
        renderCredits(document.getElementById('main-content'));
      });
    };

                <label>Description</label>
                <input type="text" name="description" required>
              </div>
              
              <div class="form-group">
                <label>Category</label>
                <input type="text" name="category" placeholder="e.g., Food, Transport, Bills" required>
              </div>
              
              <div class="form-group">
                <label>Payment Mode</label>
                <select name="mode" required>
                  <option value="Cash">Cash</option>
                  <option value="Online">Online</option>
                  <option value="GPay">GPay</option>
                  <option value="Card">Card</option>
                </select>
              </div>
              
              <div class="form-group">
                <label>Remarks (optional)</label>
                <textarea name="remarks" rows="3"></textarea>
              </div>
              
              <div class="form-group">
                <label>Attachments (optional)</label>
                <input type="file" id="expense-files-new" multiple accept="image" style="padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text);">
                <div id="expense-preview" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin-top: 12px;"></div>

            </form>
          </div>
        </div>
      `;
      
      document.body.insertAdjacentHTML('beforeend', modalHTML);
      
      // File preview
      document.getElementById('expense-files-new').addEventListener('change', function(e) {
        const preview = document.getElementById('expense-preview');
        preview.innerHTML = '';
        Array.from(e.target.files).forEach((file, idx) => {
          const reader = new FileReader();
          reader.onload = function(event) {
            preview.innerHTML += `
              <div style="position: relative; aspect-ratio: 1; border: 2px solid var(--border); border-radius: 6px; overflow: hidden;">
                <img src="${event.target.result}" style="width: 100%; height: 100%; object-fit: cover;">
                <button type="button" onclick="removePreviewFile('expense-files-new', 'expense-preview', ${idx})" style="position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: none; background: rgba(0,0,0,0.7); color: white; font-size: 12px; cursor: pointer; font-weight: 700;">âœ•</button>
              </div>
            `;
          };
          reader.readAsDataURL(file);
        });
      });
      
      document.getElementById('add-expense-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const filesInput = document.getElementById('expense-files-new');
        
        let attachments = [];
        if (filesInput.files.length > 0) {
          Array.from(filesInput.files).forEach(file => {
            attachments.push(URL.createObjectURL(file));
          });
        }
        
        const newExpense = {
          id: Date.now().toString(),
          userId: currentUser.id,
          date: formData.get('date'),
          description: formData.get('description'),
          category: formData.get('category'),
          mode: formData.get('mode'),
          remarks: formData.get('remarks'),
          amount: parseFloat(formData.get('amount')),
          attachments: attachments,
          createdAt: new Date().toISOString()
        };
        
        expenses.push(newExpense);
        mockDB.expenses.push(newExpense);
        saveToDB();
        
        closeModal();
        showToast('Expense added successfully! ðŸ’¸');
        renderPersonal(document.getElementById('main-content'));
      });
    };

    window.editExpense = function(id) {
      alert('Edit expense: ' + id);
    };

    window.deleteExpense = function(id) {
      if (confirm('Delete this expense?')) {
        mockDB.expenses = mockDB.expenses.filter(e => e.id !== id);
        saveToDB();
        loadUserData();
        renderPage('personal');
        showToast('Expense deleted');
      }
    };

    // Calendar Page
    function renderCalendar(content) {
      const selectedYear = window.calendarFilters?.year || 'all';
      const selectedMonth = window.calendarFilters?.month || new Date().getMonth();
      
      const years = ['all', ...new Set([
        ...expenses.map(e => new Date(e.date).getFullYear()),
        ...credits.map(c => new Date(c.date).getFullYear()),
        ...groups.flatMap(g => (g.expenses || []).map(e => new Date(e.date).getFullYear()))
      ])].sort((a, b) => {
        if (a === 'all') return -1;
        if (b === 'all') return 1;
        return b - a;
      });
      
      const months = [
        { value: 0, label: 'January' }, { value: 1, label: 'February' }, { value: 2, label: 'March' },
        { value: 3, label: 'April' }, { value: 4, label: 'May' }, { value: 5, label: 'June' },
        { value: 6, label: 'July' }, { value: 7, label: 'August' }, { value: 8, label: 'September' },
        { value: 9, label: 'October' }, { value: 10, label: 'November' }, { value: 11, label: 'December' }
      ];
      
      content.innerHTML = `
        <div class="section">
          <div class="section-header">
            <h2 class="section-title">Calendar View</h2>
          </div>
          
          <div style="display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap;">
            <select id="calendar-year-filter" style="min-width: 150px; padding: 12px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);">
              ${years.map(y => `<option value="${y}" ${selectedYear == y ? 'selected' : ''}>${y === 'all' ? 'All Time' : y}</option>`).join('')}
            </select>
            <select id="calendar-month-filter" style="min-width: 150px; padding: 12px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);" ${selectedYear === 'all' ? 'disabled' : ''}>
              ${months.map(m => `<option value="${m.value}" ${selectedMonth == m.value ? 'selected' : ''}>${m.label}</option>`).join('')}
            </select>
          </div>
          
          <div id="calendar-container"></div>
        </div>
      `;
      
      document.getElementById('calendar-year-filter').addEventListener('change', applyCalendarFilters);
      document.getElementById('calendar-month-filter').addEventListener('change', applyCalendarFilters);
      
      if (selectedYear === 'all') {
        renderAllTimeCalendar();
      } else {
        renderMonthCalendar(parseInt(selectedYear), parseInt(selectedMonth));
      }
    }

    function applyCalendarFilters() {
      const year = document.getElementById('calendar-year-filter').value;
      const month = document.getElementById('calendar-month-filter').value;
      const monthSelect = document.getElementById('calendar-month-filter');
      
      if (year === 'all') {
        monthSelect.disabled = true;
      } else {
        monthSelect.disabled = false;
      }
      
      window.calendarFilters = { year, month: parseInt(month) };
      renderCalendar(document.getElementById('main-content'));
    }

    function renderAllTimeCalendar() {
      const container = document.getElementById('calendar-container');
      
      // Group all data by year-month
      const yearMonths = new Set();
      expenses.forEach(e => {
        const date = new Date(e.date);
        yearMonths.add(`${date.getFullYear()}-${date.getMonth()}`);
      });
      credits.forEach(c => {
        const date = new Date(c.date);
        yearMonths.add(`${date.getFullYear()}-${date.getMonth()}`);
      });
      groups.forEach(g => {
        (g.expenses || []).forEach(e => {
          const date = new Date(e.date);
          yearMonths.add(`${date.getFullYear()}-${date.getMonth()}`);
        });
      });
      
      const sortedYearMonths = Array.from(yearMonths).sort().reverse();
      
      container.innerHTML = sortedYearMonths.map(ym => {
        const [year, month] = ym.split('-').map(Number);
        const monthName = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][month];
        
        return `
          <h3 style="margin: 24px 0 16px 0; padding: 12px; background: var(--bg); border-left: 4px solid var(--primary); font-size: 18px;">
            ${monthName} ${year}
          </h3>
          ${generateCalendarGrid(year, month)}
        `;
      }).join('');
    }

    function renderMonthCalendar(year, month) {
      const container = document.getElementById('calendar-container');
      container.innerHTML = generateCalendarGrid(year, month);
    }

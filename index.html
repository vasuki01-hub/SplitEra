                            `;
                            preview.appendChild(div);
                        };
                        reader.readAsDataURL(file);
                    });
                };

                window.removeEditDetailsNewAttachment = (id, index) => {
                    window.uploadedFiles.splice(index, 1);
                    renderEditDetailsNewAttachments(id);
                };

            } catch (error) {
                showToast('Error', error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        async function saveEditDetailsRow(sectionType, id) {
            showLoading();
            try {
                const collection = sectionType === 'credit' ? 'credits' : 'personal_expenses';
                const doc = await db.collection(collection).doc(id).get();
                const oldData = doc.data();

                const updateData = {
                    date: firebase.firestore.Timestamp.fromDate(new Date(document.getElementById(`edit-details-date-${id}`).value)),
                    description: document.getElementById(`edit-details-description-${id}`).value,
                    mode: document.getElementById(`edit-details-mode-${id}`).value,
                    remarks: document.getElementById(`edit-details-remarks-${id}`).value,
                    amount: parseFloat(document.getElementById(`edit-details-amount-${id}`).value),
                    attachments: oldData.attachments || []
                };

                const newFiles = window.uploadedFiles;
                for (let file of newFiles) {
                    const ref = storage.ref(`${collection}/${currentUser.uid}/${Date.now()}_${file.name}`);
                    await ref.put(file);
                    const url = await ref.getDownloadURL();
                    updateData.attachments.push(url);
                }

                await db.collection(collection).doc(id).update(updateData);
                window.uploadedFiles = []; // Clear queue
                editingRowId = null;
                await loadDetails();
                showToast('Success', 'Transaction updated successfully!');
            } catch (error) {
                showToast('Error', error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        async function cancelEditDetailsRow() {
            editingRowId = null;
            await loadDetails();
        }

        async function removeDetailsAttachment(sectionType, id, urlToRemove) {
            try {
                const collection = sectionType === 'credit' ? 'credits' : 'personal_expenses';
                const doc = await db.collection(collection).doc(id).get();
                const data = doc.data();
                const attachments = (data.attachments || []).filter(url => url !== urlToRemove);

                await db.collection(collection).doc(id).update({ attachments });

                const container = document.getElementById(`edit-details-attachments-${id}`);
                const images = container.querySelectorAll('img');
                for (let img of images) {
                    if (img.src === urlToRemove) {
                        img.closest('.attachment').remove();
                        break;
                    }
                }
            } catch (error) {
                showToast('Error', error.message, 'error');
            }
        }

        async function confirmDeleteDetailsRow(sectionType, id) {

        // Export Details PDF
        async function exportDetailsPDF() {
            // Get current language from settings for translations
            const currentLang = localStorage.getItem('language') || currentLanguage || 'en';
            const t = (key) => translations[currentLang]?.[key] || translations['en'][key] || key;

            // Show loading indicator while processing
            showLoading();
            try {
                // Initialize jsPDF library for PDF generation
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                // Retrieve filter values from UI elements
                const yearFilter = document.getElementById('detailsYear')?.value || 'all';
                const monthFilter = document.getElementById('detailsMonth')?.value || 'all';
                const typeFilter = document.getElementById('detailsType')?.value || 'all';
                const searchTerm = document.getElementById('detailsSearch')?.value || '';

                // Load core user data: credits, personal expenses, and the list of groups the user is in
                const [creditsSnapshot, personalSnapshot, groupsListSnapshot] = await Promise.all([
                    db.collection('credits').where('userId', '==', currentUser.uid).get(),
                    db.collection('personal_expenses').where('userId', '==', currentUser.uid).get(),
                    db.collection('groups').where('members', 'array-contains', currentUser.uid).get()
                ]);

                // Extract group IDs for the groups the current user is a member of
                const groupIds = groupsListSnapshot.docs.map(doc => doc.id);

                // Fetch all group expenses for the groups the user is in
                // Query per groupId to handle Firestore query limitations (max 10 in 'in' queries)
                let groupExpenses = [];
                if (groupIds.length > 0) {
                    const expenseQueries = groupIds.map(id => db.collection('group_expenses').where('groupId', '==', id).get());
                    const expenseSnapshots = await Promise.all(expenseQueries);
                    groupExpenses = expenseSnapshots.flatMap(snap => snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                }

                // Create a map of group IDs to group names for quick lookup
                const groupsMap = {};
                groupsListSnapshot.docs.forEach(doc => {
                    groupsMap[doc.id] = doc.data().name;
                });

                // Create a detailed map of group data (including members) for calculations
                const groupsDataMap = {};
                groupsListSnapshot.docs.forEach(doc => {
                    groupsDataMap[doc.id] = { id: doc.id, ...doc.data() };
                });

                // Process credits data
                const credits = creditsSnapshot.docs.map(doc => ({
                    section: 'Credit',
                    sectionType: 'credit',
                    ...doc.data()
                }));

                // Process personal expenses data
                const personal = personalSnapshot.docs.map(doc => ({
                    section: 'Personal',
                    sectionType: 'personal',
                    ...doc.data()
                }));

                // Process group expenses to calculate the current user's share
                const groups = groupExpenses.map(expense => {
                    // Skip settlement entries as they are not regular expenses
                    if (expense.category === 'Settlement' || (expense.description && expense.description.includes('Settlement')) || expense.isSettlement) {
                        return null;
                    }

                    const groupId = expense.groupId;
                    const groupName = groupsMap[groupId] || 'Unknown';

                    // Get group data from map (faster than finding each time)
                    const groupData = groupsDataMap[groupId];
                    if (!groupData) return null;

                    // Create a list of all members (including guests) for split calculations
                    const allMembers = [...(groupData.members || []), ...(groupData.guestMembers || []).map(name => `guest:${name}`)];
                    const memberMap = allMembers.reduce((acc, m) => {
                        acc[m] = m.startsWith('guest:') ? { firstName: m.split(':')[1], isGuest: true } : { firstName: m };
                        return acc;
                    }, {});

                    // Calculate the breakdown of the expense (assumes calculateExpenseBreakdown function exists elsewhere)
                    const breakdowns = calculateExpenseBreakdown([expense], allMembers, memberMap);
                    const breakdown = breakdowns[expense.id];
                    let userShare = breakdown?.contributions?.[currentUser.uid] || 0;

                    // Fallback for legacy equal splits if no specific splits are defined
                    if (userShare === 0 && (!expense.splits || Object.keys(expense.splits).length === 0) && groupData.members.includes(currentUser.uid)) {
                        userShare = parseFloat(expense.amount) / allMembers.length;
                    }

                    // Fallback for guest aliases if the user is matched as a guest
                    if (userShare === 0) {
                        const guestKey = `guest:${currentUser.firstName} ${currentUser.lastName || ''}`.trim();
                        userShare = breakdown?.contributions?.[guestKey] || 0;
                    }

                    // Include the expense if the user's share is positive or if the user added the expense (to ensure payers see their entries even if share is 0)
                    // This addresses cases where payers might have userShare = 0 but still need to see the full entry
                    // Note: Assuming 'userId' in expense is the adder/payer ID
                    if (userShare <= 0 && expense.userId !== currentUser.uid) return null;

                    // If userShare is 0 and user is the payer, use the full amount as their 'expense'
                    const displayAmount = (userShare > 0) ? userShare : parseFloat(expense.amount);

                    // Return the entry with amount as the user's share (or full if payer with 0 share)
                    return {
                        section: `Group: ${groupName}`,
                        sectionType: 'group',
                        ...expense,
                        amount: displayAmount // Override with user's share or full amount
                    };
                }).filter(e => e !== null);

                // Combine data based on type filter
                let allData = [];
                if (typeFilter === 'all' || typeFilter === 'credit') {
                    allData = allData.concat(credits);
                }
                if (typeFilter === 'all' || typeFilter === 'personal') {
                    allData = allData.concat(personal);
                }
                if (typeFilter === 'all' || typeFilter === 'group') {
                    allData = allData.concat(groups);
                }

                // Apply search filter if search term is provided
                if (searchTerm) {
                    allData = filterBySearch(allData, searchTerm, ['description', 'mode', 'remarks', 'amount', 'section']);
                }
                // Apply year and month filters
                allData = filterByYearMonth(allData, yearFilter, monthFilter);
                // Sort data by date in descending order
                allData.sort((a, b) => safeDateMillis(b.date) - safeDateMillis(a.date));

                // Add header to PDF with green background
                doc.setFillColor(16, 185, 129);
                doc.rect(0, 0, 210, 30, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(20);
                doc.text(`SplitEra - ${t('allTransactionsReport')}`, 105, 15, { align: 'center' });
                doc.setFontSize(12);
                doc.text(`${t('generated')}: ${new Date().toLocaleDateString()}`, 105, 23, { align: 'center' });

                // Reset text color to black
                doc.setTextColor(0, 0, 0);
                let yPos = 40;

                // Calculate totals for summary section
                const totalCredits = credits.reduce((sum, c) => sum + c.amount, 0);
                const totalPersonal = personal.reduce((sum, p) => sum + p.amount, 0);
                const totalGroup = groups.reduce((sum, g) => sum + g.amount, 0);

                // Add summary to PDF
                doc.setFontSize(12);
                doc.text(t('summary'), 14, yPos);
                yPos += 10;

                doc.setFontSize(10);
                doc.text(`${t('totalCredits')}: ${formatCurrency(totalCredits, true)}`, 14, yPos);
                yPos += 7;
                doc.text(`${t('personalExpenses')}: ${formatCurrency(totalPersonal, true)}`, 14, yPos);
                yPos += 7;
                doc.text(`${t('groupExpenses')}: ${formatCurrency(totalGroup, true)}`, 14, yPos);
                yPos += 15;

                // Group data by month for PDF layout
                const grouped = groupByMonth(allData);

                // Iterate over each month group in reverse chronological order
                Object.keys(grouped).sort().reverse().forEach(monthKey => {
                    const [year, month] = monthKey.split('-');
                    const monthName = getMonthName(parseInt(month) - 1);

                    // Add new page if nearing bottom of current page
                    if (yPos > 250) {
                        doc.addPage();
                        yPos = 20;
                    }

                    // Add month header
                    doc.setFontSize(12);
                    doc.setFont(undefined, 'bold');
                    doc.text(`${monthName} ${year}`, 14, yPos);
                    doc.setFont(undefined, 'normal');
                    yPos += 7;

                    let monthTotal = 0;

                    // Prepare table data for the month
                    const tableData = grouped[monthKey].map(item => {
                        const amount = item.amount;
                        // Calculate signed amount for month total (credits positive, expenses negative)
                        const signedAmount = item.sectionType === 'credit' ? amount : -amount;
                        monthTotal += signedAmount;

                        return [
                            safeDate(item.date).toLocaleDateString(),
                            item.section,
                            item.description,
                            item.mode,
                            `${item.sectionType === 'credit' ? '+' : '-'}${formatCurrency(amount, true)}`
                        ];
                    });

                    // Add total row to the table
                    tableData.push([
                        { content: t('total'), colSpan: 4, styles: { fontStyle: 'bold', halign: 'right' } },
                        { content: formatCurrency(monthTotal, true), styles: { fontStyle: 'bold', textColor: monthTotal >= 0 ? [22, 163, 74] : [220, 38, 38] } } // Green for positive, red for negative
                    ]);

                    // Generate autoTable for the month's data
                    doc.autoTable({
                        startY: yPos,
                        head: [[t('date'), t('section'), t('description'), t('mode'), t('amount')]],
                        body: tableData,
                        theme: 'grid', // Borders
                        headStyles: { fillColor: [16, 185, 129], lineWidth: 0.1, lineColor: [200, 200, 200] },
                        styles: { lineWidth: 0.1, lineColor: [200, 200, 200] }, // Cell borders
                        margin: { left: 14, right: 14 },
                        didDrawPage: (data) => {
                            // Resets yPos if page breaks
                        }
                    });

                    // Update yPos for next section
                    yPos = doc.lastAutoTable.finalY + 15;
                });

                // Save the PDF with a timestamped filename
                doc.save(`all-transactions-${Date.now()}.pdf`);
                showToast(t('success'), t('pdfExportSuccess'));
            } catch (error) {
                showToast(t('error'), `${t('failedToExportPdf')}: ${error.message}`);
            } finally {
                hideLoading();
            }
        }

        function toggleProfileEdit() {
            const viewMode = document.getElementById('profileViewMode');
            const editMode = document.getElementById('profileEditMode');
            const editBtn = document.getElementById('editProfileBtn');

            if (viewMode.style.display === 'none') {
                viewMode.style.display = 'block';
                editMode.style.display = 'none';
                editBtn.innerHTML = `<i class="fas fa-edit"></i> ${t('editProfile')}`;
            } else {
                viewMode.style.display = 'none';
                editMode.style.display = 'block';
                editBtn.innerHTML = `<i class="fas fa-times"></i> ${t('cancelEdit')}`;
            }
        }

        async function saveProfile() {
            showLoading();
            try {
                const updates = {
                    firstName: document.getElementById('editFirstName').value,
                    lastName: document.getElementById('editLastName').value,
                    email: document.getElementById('editEmail').value,
                    countryCode: document.getElementById('editCountryCode').value,
                    phone: document.getElementById('editPhone').value
                };

                // Handle photo upload
                const photoFile = document.getElementById('newProfilePhoto').files[0];
                if (photoFile) {
                    if (photoFile.size > 9 * 1024 * 1024) {
                        throw new Error('Profile photo too large (Max 9MB)');
                    }
                    const photoRef = storage.ref(`profile_photos/${currentUser.uid}`);
                    await photoRef.put(photoFile);
                    updates.photoUrl = await photoRef.getDownloadURL();
                }

                // Update Firestore
                await db.collection('users').doc(currentUser.uid).update(updates);

                // Update email if changed
                if (updates.email !== currentUser.email) {
                    await auth.currentUser.updateEmail(updates.email);
                }

                // Update password if provided
                const oldPassword = document.getElementById('editOldPassword').value;
                const newPassword = document.getElementById('editPassword').value;
                const confirmPassword = document.getElementById('editConfirmPassword').value;

                if (newPassword || confirmPassword || oldPassword) {
                    if (!oldPassword) {
                        throw new Error('Please enter your old password');
                    }
                    if (!newPassword) {
                        throw new Error('Please enter a new password');
                    }
                    if (newPassword !== confirmPassword) {
                        throw new Error('New passwords do not match');
                    }

                    // Verify old password by re-authenticating
                    const credential = firebase.auth.EmailAuthProvider.credential(
                        currentUser.email,
                        oldPassword
                    );
                    await auth.currentUser.reauthenticateWithCredential(credential);

                    // Update password
                    await auth.currentUser.updatePassword(newPassword);
                    showToast(t('success'), 'Password updated successfully!');
                }

                // Update current user
                Object.assign(currentUser, updates);

                // Update display
                document.getElementById('profilePhotoDisplay').src = currentUser.photoUrl || 'https://via.placeholder.com/120';

                toggleProfileEdit();
                showToast(t('success'), t('profileUpdated'));
            } catch (error) {
                showToast(t('error'), error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        async function removeProfilePhoto() {
            showLoading();
            try {
                await db.collection('users').doc(currentUser.uid).update({
                    photoUrl: ''
                });

                currentUser.photoUrl = '';
                document.getElementById('profilePhotoEdit').src = 'https://via.placeholder.com/120';
                document.getElementById('profilePhotoDisplay').src = 'https://via.placeholder.com/120';

                showToast('Success', 'Profile photo removed!');
            } catch (error) {
                showToast('Error', error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        async function saveSettings() {
            showLoading();
            try {
                const currency = document.getElementById('settingsCurrency').value;
                const country = document.getElementById('settingsCountry').value;
                const darkModeElement = document.getElementById('settingsDarkMode');
                const darkMode = darkModeElement ? darkModeElement.checked : false;
                const language = document.getElementById('settingsLanguage').value;

                // Save to localStorage
                localStorage.setItem('currency', currency);
                localStorage.setItem('country', country);
                localStorage.setItem('darkMode', darkMode);
                localStorage.setItem('language', language);
                localStorage.setItem('lang', language);
                localStorage.setItem('theme', darkMode ? 'dark' : 'light');

                // Update Firebase user profile if logged in
                if (currentUser && currentUser.uid) {
                    await db.collection('users').doc(currentUser.uid).update({
                        currency: currency,
                        country: country,
                        darkMode: darkMode,
                        language: language,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }

                // Apply immediately
                document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
                currentLang = language;

                showToast('Success', t('settingsSaved'));
                // Re-render settings to apply changes
                await renderSettings();

            } catch (error) {
                console.error('Error saving settings:', error);
                showToast('Error', 'Failed to save settings: ' + error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        async function exportAllDataPDF() {
            showLoading();
            try {
                // Get current language from settings
                const currentLang = localStorage.getItem('language') || currentLanguage || 'en';
                const t = (key) => translations[currentLang]?.[key] || translations['en'][key] || key;

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                // Load all data
                const [creditsSnapshot, personalSnapshot, groupsSnapshot, groupsListSnapshot] = await Promise.all([
                    db.collection('credits').where('userId', '==', currentUser.uid).get(),
                    db.collection('personal_expenses').where('userId', '==', currentUser.uid).get(),
                    db.collection('group_expenses').where('userId', '==', currentUser.uid).get(),
                    db.collection('groups').where('members', 'array-contains', currentUser.uid).get()
                ]);

                // Header
                doc.setFillColor(255, 153, 51);
                doc.rect(0, 0, 210, 40, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(24);
                doc.text('SplitEra', 105, 20, { align: 'center' });
                doc.setFontSize(16);
                doc.text(t('completeDataExport'), 105, 30, { align: 'center' });

                doc.setTextColor(0, 0, 0);
                let yPos = 50;

                // User Info
                doc.setFontSize(14);
                doc.text(t('userInformation'), 14, yPos);
                yPos += 10;
                doc.setFontSize(10);
                doc.text(`${t('name')}: ${currentUser.firstName} ${currentUser.lastName || ''}`, 14, yPos);
                yPos += 7;
                doc.text(`${t('email')}: ${currentUser.email}`, 14, yPos);
                yPos += 7;
                doc.text(`User ID: ${currentUser.userId}`, 14, yPos);
                yPos += 7;
                doc.text(`${t('exportDate')}: ${new Date().toLocaleString()}`, 14, yPos);
                yPos += 15;

                // Credits Summary
                const credits = creditsSnapshot.docs.map(doc => doc.data());
                const totalCredits = credits.reduce((sum, c) => sum + (parseFloat(c.amount) || 0), 0);
                doc.setFontSize(12);
                doc.text(`${t('creditTransactions')} (${credits.length} ${t('transactions')}) - ${t('total')}: ${formatCurrency(totalCredits, true)}`, 14, yPos);
                yPos += 10;

                if (credits.length > 0) {
                    const creditData = credits.map(c => [
                        c.date.toDate().toLocaleDateString(),
                        c.description,
                        c.mode,
                        formatCurrency(c.amount, true)
                    ]);

                    doc.autoTable({
                        startY: yPos,
                        head: [[t('date'), t('description'), t('mode'), t('amount')]],
                        body: creditData,
                        theme: 'grid',
                        headStyles: { fillColor: [16, 185, 129] },
                        margin: { left: 14, right: 14 }
                    });
                    yPos = doc.lastAutoTable.finalY + 15;
                }

                // Personal Expenses Summary
                if (yPos > 250) {
                    doc.addPage();
                    yPos = 20;
                }

                const personal = personalSnapshot.docs.map(doc => doc.data());
                const totalPersonal = personal.reduce((sum, p) => sum + (parseFloat(p.amount) || 0), 0);
                doc.setFontSize(12);
                doc.text(`${t('personalExpenses')} (${personal.length} ${t('transactions')}) - ${t('total')}: ${formatCurrency(totalPersonal, true)}`, 14, yPos);
                yPos += 10;

                if (personal.length > 0) {
                    const personalData = personal.map(p => [
                        p.date.toDate().toLocaleDateString(),
                        p.description,
                        p.mode,
                        formatCurrency(p.amount, true)
                    ]);

                    doc.autoTable({
                        startY: yPos,
                        head: [[t('date'), t('description'), t('mode'), t('amount')]],
                        body: personalData,
                        theme: 'grid',
                        headStyles: { fillColor: [239, 68, 68] },
                        margin: { left: 14, right: 14 }
                    });
                    yPos = doc.lastAutoTable.finalY + 15;
                }

                // Group Expenses Summary
                if (yPos > 250) {
                    doc.addPage();
                    yPos = 20;
                }

                const groups = groupsSnapshot.docs.map(doc => doc.data());
                const totalGroup = groups.reduce((sum, g) => sum + (parseFloat(g.amount) || 0), 0);
                doc.setFontSize(12);
                doc.text(`${t('groupExpenses')} (${groups.length} ${t('transactions')}) - ${t('total')}: ${formatCurrency(totalGroup, true)}`, 14, yPos);
                yPos += 10;

                if (groups.length > 0) {
                    const groupData = groups.map(g => [
                        g.date.toDate().toLocaleDateString(),
                        g.description,
                        g.mode,
                        formatCurrency(g.amount, true)
                    ]);

                    doc.autoTable({
                        startY: yPos,
                        head: [[t('date'), t('description'), t('mode'), t('amount')]],
                        body: groupData,
                        theme: 'grid',
                        headStyles: { fillColor: [59, 130, 246] },
                        margin: { left: 14, right: 14 }
                    });
                }

                doc.save(`splitera-complete-data-${Date.now()}.pdf`);
                showToast(t('success'), t('pdfExportSuccess'));
            } catch (error) {
                showToast(t('error'), `${t('failedToExportPdf')}: ${error.message}`, 'error');
            } finally {
                hideLoading();
            }
        }

        async function exportAllDataJSON() {
            showLoading();
            try {
                const [creditsSnapshot, personalSnapshot, groupsSnapshot, groupsListSnapshot] = await Promise.all([
                    db.collection('credits').where('userId', '==', currentUser.uid).get(),
                    db.collection('personal_expenses').where('userId', '==', currentUser.uid).get(),
                    db.collection('group_expenses').where('userId', '==', currentUser.uid).get(),
                    db.collection('groups').where('members', 'array-contains', currentUser.uid).get()
                ]);

                const exportData = {
                    exportDate: new Date().toISOString(),
                    user: {
                        userId: currentUser.userId,
                        firstName: currentUser.firstName,
                        lastName: currentUser.lastName,
                        email: currentUser.email,
                        phone: currentUser.phone,
                        countryCode: currentUser.countryCode
                    },
                    credits: creditsSnapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data(),
                        date: doc.data().date.toDate().toISOString()
                    })),
                    personalExpenses: personalSnapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data(),
                        date: doc.data().date.toDate().toISOString()
                    })),
                    groupExpenses: groupsSnapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data(),
                        date: doc.data().date.toDate().toISOString()
                    })),
                    groups: groupsListSnapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data(),
                        createdAt: doc.data().createdAt?.toDate().toISOString()
                    }))
                };

                const dataStr = JSON.stringify(exportData, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `splitera-complete-data-${Date.now()}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);

                showToast(t('success'), t('jsonExportSuccess'));
            } catch (error) {
                showToast(t('error'), `${t('failedToExportJson')}: ${error.message}`, 'error');
            } finally {
                hideLoading();
            }
        }

        async function exportAllDataExcel() {
            showLoading();
            try {
                const currentLang = localStorage.getItem('language') || currentLanguage || 'en';
                const t = (key) => translations[currentLang]?.[key] || translations['en'][key] || key;

                const [creditsSnapshot, personalSnapshot, groupsSnapshot, groupsListSnapshot] = await Promise.all([
                    db.collection('credits').where('userId', '==', currentUser.uid).get(),
                    db.collection('personal_expenses').where('userId', '==', currentUser.uid).get(),
                    db.collection('group_expenses').where('userId', '==', currentUser.uid).get(),
                    db.collection('groups').where('members', 'array-contains', currentUser.uid).get()
                ]);

                const workbook = XLSX.utils.book_new();

                // Credits Sheet
                const creditsData = creditsSnapshot.docs.map(doc => {
                    const d = doc.data();
                    return {
                        [t('date')]: d.date.toDate().toLocaleDateString(),
                        [t('description')]: d.description,
                        [t('mode')]: d.mode,
                        [t('category')]: d.category || '',
                        [t('remarks')]: d.remarks || '',
                        [t('amount')]: parseFloat(d.amount) || 0
                    };
                });
                const creditsSheet = XLSX.utils.json_to_sheet(creditsData);
                XLSX.utils.book_append_sheet(workbook, creditsSheet, 'Credits');

                // Personal Expenses Sheet
                const personalData = personalSnapshot.docs.map(doc => {
                    const d = doc.data();
                    return {
                        [t('date')]: d.date.toDate().toLocaleDateString(),
                        [t('description')]: d.description,
                        [t('mode')]: d.mode,
                        [t('category')]: d.category || '',
                        [t('remarks')]: d.remarks || '',
                        [t('amount')]: parseFloat(d.amount) || 0
                    };
                });
                const personalSheet = XLSX.utils.json_to_sheet(personalData);
                XLSX.utils.book_append_sheet(workbook, personalSheet, 'Personal');

                // Group Expenses Sheet
                const groupsMap = {};
                groupsListSnapshot.docs.forEach(doc => { groupsMap[doc.id] = doc.data().name; });

                const groupExpensesData = groupsSnapshot.docs.map(doc => {
                    const d = doc.data();
                    return {
                        [t('date')]: d.date.toDate().toLocaleDateString(),
                        [t('group')]: groupsMap[d.groupId] || 'Unknown',
                        [t('description')]: d.description,
                        [t('category')]: d.category || '',
                        [t('paidBy')]: d.paidBy || d.userId,
                        [t('amount')]: parseFloat(d.amount) || 0
                    };
                });
                const groupSheet = XLSX.utils.json_to_sheet(groupExpensesData);
                XLSX.utils.book_append_sheet(workbook, groupSheet, 'Group Expenses');

                XLSX.writeFile(workbook, `splitera-complete-data-${Date.now()}.xlsx`);
                showToast(t('success'), 'Excel exported successfully!');
            } catch (error) {
                showToast(t('error'), 'Failed to export Excel: ' + error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        function getMonthName(monthIndex) {
            const months = [

        function generateGroupCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 8; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function filterBySearch(data, searchTerm, fields) {
            if (!searchTerm) return data;

            const term = searchTerm.toLowerCase();
            return data.filter(item => {
                return fields.some(field => {
                    const value = item[field];
                    if (value === null || value === undefined) return false;

                    // Handle date fields - UPDATED
                    if (field === 'date') {
                        const dateObj = safeDate(value); // Use safeDate helper
                        const dateStr = dateObj.toLocaleDateString().toLowerCase();
                        const monthName = getMonthName(dateObj.getMonth()).toLowerCase();
                        return dateStr.includes(term) || monthName.includes(term);
                    }

                    // Handle amount fields
                    if (field === 'amount') {
                        return value.toString().includes(term);
                    }

                    // Handle string fields
                    return value.toString().toLowerCase().includes(term);
                });
            });
        }

        function filterByYearMonth(data, year, month) {
            if (year === 'all' && month === 'all') return data;

            return data.filter(item => {
                const itemDate = safeDate(item.date); // Use safeDate helper

                if (year !== 'all' && itemDate.getFullYear() !== parseInt(year)) {
                    return false;
                }

                if (month !== 'all' && itemDate.getMonth() !== parseInt(month)) {
                    return false;
                }

                return true;
            });
        }

        function groupByMonth(data) {
            const grouped = {};

            data.forEach(item => {
                const date = safeDate(item.date); // Use safeDate helper
                const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;

                if (!grouped[key]) {
                    grouped[key] = [];
                }

                grouped[key].push(item);
            });

            return grouped;
        }

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {

                timeout = setTimeout(later, wait);
            };

            return function () {

                if (!inThrottle) {

                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);

            };

            if (!user) return;

            try {
                const batch = db.batch();
                let hasUpdates = false;

                // 1. Check Guest Memberships (Phone match)
                if (user.phone) {
                    const cleanPhone = user.phone.replace(/[^\d+]/g, '');

                    const guestGroupsSnap = await db.collection('groups')
                        .where('guestMembers', 'array-contains', cleanPhone)
                        .get();

                    guestGroupsSnap.forEach(doc => {
                        const groupRef = db.collection('groups').doc(doc.id);
                        const data = doc.data();

                        if (!data.members.includes(user.uid)) {
                            batch.update(groupRef, {
                                members: firebase.firestore.FieldValue.arrayUnion(user.uid),
                                guestMembers: firebase.firestore.FieldValue.arrayRemove(cleanPhone)
                            });
                            // Also try removing the raw user.phone just in case
                            if (cleanPhone !== user.phone) {
                                batch.update(groupRef, {
                                    guestMembers: firebase.firestore.FieldValue.arrayRemove(user.phone)
                                });
                            }

                            showToast('Info', `You have been automatically added to group: ${data.name}`);
                            hasUpdates = true;
                        }
                    });
                }

                // 2. Check Guest Memberships (Email match)
                if (user.email) {
                    const guestGroupsSnapEmail = await db.collection('groups')
                        .where('guestMembers', 'array-contains', user.email)
                        .get();

                    guestGroupsSnapEmail.forEach(doc => {
                        const groupRef = db.collection('groups').doc(doc.id);
                        const data = doc.data();
                        if (!data.members.includes(user.uid)) {
                            batch.update(groupRef, {
                                members: firebase.firestore.FieldValue.arrayUnion(user.uid),
                                guestMembers: firebase.firestore.FieldValue.arrayRemove(user.email)
                            });
                            showToast('Info', `You have been automatically added to group: ${data.name}`);
                            hasUpdates = true;
                        }
                    });
                }

                if (hasUpdates) {
                    await batch.commit();
                    if (currentPage === 'groups') loadGroups();
                }

            } catch (e) {
                console.error('Error checking invites:', e);
            }
        }
    </script>
</body>

</html>

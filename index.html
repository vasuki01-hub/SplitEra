        async function createGroup() {
            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${t('creating')}`;

            try {
                const name = document.getElementById('groupName').value;
                const creationDate = document.getElementById('groupCreationDate').value;
                const description = document.getElementById('groupDescription').value;
                const invitesVal = document.getElementById('groupInvites').value;

                // Process invites and guests
                const inputList = invitesVal.split(',').map(e => e.trim()).filter(e => e);
                const emailsToInvite = [];
                const guestNames = [];
                const phonesToCheck = [];

                // 1. Initial Classification
                inputList.forEach(item => {
                    if (item.includes('@')) {
                        emailsToInvite.push(item);
                    } else if (/^[\d+\-\s()]{7,}$/.test(item)) { // Simple phone check (at least 7 digits/symbols)
                        phonesToCheck.push(item);
                    } else {
                        guestNames.push(item);
                    }
                });

                // 2. Check Phones and Emails against DB for existing users
                const userInvites = []; // Store user objects for invitation

                for (const phone of phonesToCheck) {
                    const cleanPhone = phone.replace(/[^\d+]/g, ''); // Keep + and digits

                    // Check if phone belongs to an existing user
                    const userSnap = await db.collection('users').where('phone', '==', cleanPhone).get();

                    if (!userSnap.empty) {
                        const user = { id: userSnap.docs[0].id, ...userSnap.docs[0].data() };
                        userInvites.push({
                            user: user,
                            inviteType: 'phone',
                            originalInput: phone
                        });
                    } else {
                        // Not found -> Guest with phone label
                        guestNames.push(phone);
                    }
                }

                // Check emails for existing users
                for (const email of emailsToInvite.slice()) { // Use slice to avoid modifying while iterating
                    const emailSnap = await db.collection('users').where('email', '==', email.toLowerCase()).get();

                    if (!emailSnap.empty) {
                        const user = { id: emailSnap.docs[0].id, ...emailSnap.docs[0].data() };
                        userInvites.push({
                            user: user,
                            inviteType: 'email',
                            originalInput: email
                        });
                        // Remove from emailsToInvite since we'll handle as user invite
                        const index = emailsToInvite.indexOf(email);
                        if (index > -1) emailsToInvite.splice(index, 1);
                    }
                }

                // Create Group
                const groupData = {
                    name,
                    description,
                    creationDate: firebase.firestore.Timestamp.fromDate(new Date(creationDate)),
                    code: generateGroupCode(),
                    createdBy: currentUser.uid,
                    members: [currentUser.uid],
                    guestMembers: guestNames,
                    pendingRequests: [],
                    simplify: true, // Default: show minimal transactions to settle
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                const groupRef = await db.collection('groups').add(groupData);
                const groupId = groupRef.id;

                // Send Invitations
                const batch = db.batch();

                // Process Email Invites (non-existing users)
                for (let email of emailsToInvite) {
                    const inviteRef = db.collection('group_invites').doc();
                    batch.set(inviteRef, {
                        groupId: groupId,
                        groupName: name,
                        toEmail: email,
                        invitedBy: currentUser.uid,
                        invitedByName: `${currentUser.firstName} ${currentUser.lastName || ''}`.trim(),
                        status: 'pending',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }

                // Process existing user invites
                for (const userInvite of userInvites) {
                    const inviteRef = db.collection('group_invites').doc();
                    batch.set(inviteRef, {
                        groupId: groupId,
                        groupName: name,
                        toUserId: userInvite.user.id,
                        toEmail: userInvite.user.email,
                        toPhone: userInvite.user.phone,
                        invitedBy: currentUser.uid,
                        invitedByName: `${currentUser.firstName} ${currentUser.lastName || ''}`.trim(),
                        status: 'pending',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }

                await batch.commit();

                document.querySelector('.modal-overlay').remove();
                await loadGroups();
                showToast(t('success'), t('groupCreatedSuccess'));
            } catch (error) {
                showToast(t('error'), error.message);
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-plus"></i> ${t('createGroup')}`;
            }
        }

        async function pickContact() {
            try {
                // Check if Contacts API is supported
                if (!('contacts' in navigator && 'select' in navigator.contacts)) {
                    showToast('Info', 'Contact picker not supported on this device/browser. Try using a mobile device with modern browser.', 'info');
                    return;
                }

                const props = ['name', 'tel', 'email'];
                const opts = { multiple: true }; // Allow multiple contact selection

                try {
                    // Request permission and select contacts
                    const contacts = await navigator.contacts.select(props, opts);

                    if (contacts && contacts.length > 0) {
                        // Process selected contacts
                        const processedContacts = [];

                        for (const contact of contacts) {
                            const name = contact.name?.[0] || contact.displayName || '';
                            let primaryValue = '';
                            let contactType = 'name';

                            // Prioritize email over phone for existing users
                            if (contact.email && contact.email.length > 0) {
                                primaryValue = contact.email[0];
                                contactType = 'email';
                            } else if (contact.tel && contact.tel.length > 0) {
                                primaryValue = contact.tel[0];
                                contactType = 'phone';
                            }

                            if (primaryValue || name) {
                                processedContacts.push({
                                    name: name,
                                    value: primaryValue || name,
                                    type: contactType
                                });
                            }
                        }

                        if (processedContacts.length > 0) {
                            // Add all selected contacts to the input field (comma-separated)
                            const currentValue = document.getElementById('newMemberInput').value.trim();
                            const existingContacts = currentValue ? currentValue.split(',').map(c => c.trim()) : [];
                            const newContactValues = processedContacts.map(c => c.value);

                            // Combine existing and new contacts, remove duplicates
                            const allContacts = [...new Set([...existingContacts, ...newContactValues])];
                            document.getElementById('newMemberInput').value = allContacts.join(', ');

                            // Trigger the member availability check
                            checkMemberAvailability();

                            const contactNames = processedContacts.map(c => c.name || c.value).join(', ');
                            showToast('Success', `Added ${processedContacts.length} contact${processedContacts.length > 1 ? 's' : ''}: ${contactNames}`, 'success');
                        } else {
                            showToast('Info', 'No valid contact information found', 'info');
                        }
                    } else {
                        showToast('Info', 'No contacts selected', 'info');
                    }
                } catch (permissionError) {
                    console.error('Contact permission error:', permissionError);

                    // Handle different permission errors
                    if (permissionError.name === 'NotAllowedError') {
                        showToast('Error', 'Contact access denied. Please allow contact permissions and try again.', 'error');
                    } else if (permissionError.name === 'NotSupportedError') {
                        showToast('Error', 'Contact picker not supported on this device.', 'error');
                    } else if (permissionError.name === 'SecurityError') {
                        showToast('Error', 'Contact access blocked by browser security. Try using HTTPS.', 'error');
                    } else {
                        showToast('Error', 'Failed to access contacts. Please try again.', 'error');
                    }
                }

            } catch (error) {
                console.error('Contact pick error:', error);
                showToast('Error', 'Failed to open contact picker', 'error');
            }
        }

        // Pick contacts for group creation
        async function pickContactsForGroup() {
            try {
                if (!('contacts' in navigator && 'select' in navigator.contacts)) {
                    showToast('Info', 'Contact picker not supported on this device/browser. Try using a mobile device with modern browser.', 'info');
                    return;
                }

                const props = ['name', 'tel', 'email'];
                const opts = { multiple: true };

                const contacts = await navigator.contacts.select(props, opts);

                if (contacts && contacts.length > 0) {
                    const processedContacts = [];
                    const currentInvites = document.getElementById('groupInvites').value.trim();

                    for (const contact of contacts) {
                        const name = contact.name?.[0] || contact.displayName || '';
                        let primaryValue = '';
                        let contactType = 'name';

                        if (contact.email && contact.email.length > 0) {
                            primaryValue = contact.email[0];
                            contactType = 'email';
                        } else if (contact.tel && contact.tel.length > 0) {
                            primaryValue = contact.tel[0];
                            contactType = 'phone';
                        }

                        if (primaryValue || name) {
                            processedContacts.push({
                                name: name,
                                value: primaryValue || name,
                                type: contactType
                            });
                        }
                    }

                    if (processedContacts.length > 0) {
                        // Add to existing invites
                        const existingInvites = currentInvites ? currentInvites.split(',').map(i => i.trim()) : [];
                        const newInvites = processedContacts.map(c => c.value);

                    showToast('Error', 'Contact access denied. Please allow contact permissions and try again.', 'error');
                } else {
                    showToast('Error', 'Failed to access contacts', 'error');
                }
            }
        }

        async function joinGroup() {
            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${t('requesting')}`;

            try {
                const code = document.getElementById('joinGroupCode').value.toUpperCase();

                const snapshot = await db.collection('groups')
                    .where('code', '==', code)
                    .get();

                if (snapshot.empty) {
                    throw new Error(t('invalidCode'));
                }

                const groupDoc = snapshot.docs[0];
                const groupData = groupDoc.data();

                if (groupData.members.includes(currentUser.uid)) {
                    throw new Error(t('alreadyMember'));
                }

                if (groupData.pendingRequests && groupData.pendingRequests.includes(currentUser.uid)) {
                    throw new Error(t('requestPending'));
                }

                // Send request instead of direct join
                await db.collection('groups').doc(groupDoc.id).update({
                    pendingRequests: firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
                });

                document.querySelector('.modal-overlay').remove();
                showToast(t('success'), t('joinRequestSent'));
            } catch (error) {
                showToast(t('error'), error.message);
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-sign-in-alt"></i> ${t('joinGroup')}`;
            }
        }

        let currentGroupMembers = []; // Global to hold current view members

        /**
         * Displays detailed information about a group, including members, expenses, debts, and balances.
         * Fetches data from Firestore, processes expenses, calculates debts and breakdowns, and renders a modal.
         * @param {string} groupId - The ID of the group to view.
         */
        async function viewGroupDetails(groupId) {
            // Check if modal is already open - if so, just update it instead of creating a new one
            const existingModal = document.querySelector('.modal-overlay.show');
            const isUpdating = existingModal && existingModal.querySelector('.modal-large');
            if (!isUpdating) {
                showLoading();
            } else {
                // Remove existing modal to prevent overlap
                existingModal.remove();
            }

            try {
                const groupDoc = await db.collection('groups').doc(groupId).get();
                const group = { id: groupDoc.id, ...groupDoc.data() };

                // Fetch members
                const memberDocs = await Promise.all(
                    group.members.map(uid => db.collection('users').doc(uid).get())
                );
                const members = memberDocs.map(d => ({ id: d.id, ...d.data() }));

                // Add guest members
                const guests = (group.guestMembers || []).map(name => ({
                    id: `guest:${name}`,
                    firstName: name,
                    lastName: `(${t('guest')})`,
                    photoUrl: `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=random`,
                    isGuest: true
                }));

                const allMembers = [...members, ...guests];
                currentGroupMembers = allMembers;

                const memberMap = allMembers.reduce((acc, m) => { acc[m.id] = m; return acc; }, {});

                const expensesSnapshot = await db.collection('group_expenses')
                    .where('groupId', '==', groupId)
                    .get();

                const yearFilter = document.getElementById('groupYearFilter')?.value || 'all';
                const monthFilter = document.getElementById('groupMonthFilter')?.value || 'all';

                let allExpenses = expensesSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                // Collect settlements from ALL expenses before filtering
                const allSettlements = [];
                allExpenses.forEach(expense => {
                    const settlements = expense.settlements || [];
                    settlements.forEach(settlement => {
                        allSettlements.push({
                            from: settlement.fromUser,
                            to: settlement.toUser,
                            amount: settlement.amount
                        });
                    });
                });

                // Filter out settlement expenses for display
                let expenses = allExpenses.filter(expense =>
                    expense.category !== 'Settlement' &&
                    !expense.description?.includes('Settlement')
                );

                expenses = filterByYearMonth(expenses, yearFilter, monthFilter);
                expenses.sort((a, b) => safeDateMillis(b.date) - safeDateMillis(a.date));

                // Calculate Debts
                const simplify = group.simplify !== false; // Default to true
                const debts = calculateGroupDebts(expenses, allMembers.map(m => m.id), allSettlements);

                // Calculate breakdowns
                const breakdowns = calculateExpenseBreakdown(expenses, allMembers.map(m => m.id), memberMap);

                // ────────────────────────────────────────────────
                // IMPORTANT CHANGE: Show ALL expenses to every group member
                // ────────────────────────────────────────────────
                const displayExpenses = expenses;

                // Classify active / settled per current user
                const activeExpenses = [];
                const settledExpenses = [];

                displayExpenses.forEach(expense => {
                    const breakdown = breakdowns[expense.id];
                    const payerId = expense.paidBy || expense.userId;
                    const splits = expense.splits || expense.splitDetails || {};
                    const settlements = expense.settlements || [];

                    let myShare = breakdown?.contributions?.[currentUser.uid] || 0;

                    // Guest fallback
                    if (myShare === 0) {
                        const guestKey = `guest:${currentUser.firstName} ${currentUser.lastName || ''}`.trim();
                        myShare = breakdown?.contributions?.[guestKey] || 0;
                    }

                    // Equal split fallback only when really appropriate
                    if (myShare === 0 && Object.keys(splits).length === 0) {
                        const splitType = (expense.splitType || 'equal').toLowerCase();
                        if (splitType === 'equal') {
                            myShare = parseFloat(expense.amount) / allMembers.length;
                        }
                    }

                    let displayAmount = 0;
                    let isFullySettledForUser = true;

                    if (payerId === currentUser.uid) {
                        const totalReceived = settlements.reduce((sum, s) =>
                            sum + (s.toUser === currentUser.uid ? parseFloat(s.amount) : 0), 0);
                        displayAmount = parseFloat(expense.amount) - myShare - totalReceived;
                    } else {
                        const totalPaid = settlements.reduce((sum, s) =>
                            sum + (s.fromUser === currentUser.uid ? parseFloat(s.amount) : 0), 0);
                        displayAmount = myShare - totalPaid;
                    }

                    displayAmount = Math.max(0, displayAmount);
                    isFullySettledForUser = displayAmount <= 0.01;

                    if (isFullySettledForUser) {
                        settledExpenses.push(expense);
                    } else {
                        activeExpenses.push(expense);
                    }
                });

                const renderExpenseRow = (expense, isSettledRow = false) => {
                    const payerId = expense.paidBy || expense.userId;
                    const payer = memberMap[payerId] || { firstName: 'Unknown' };
                    const expenseBreakdown = breakdowns[expense.id];
                    const settlements = expense.settlements || [];

                    let displayAmount = 0;
                    let amountColor = 'var(--danger)'; // ← always red for total amount as requested
                    let totalExpenseForUser = 0;
                    let myShare = expenseBreakdown?.contributions?.[currentUser.uid] || 0;

                    // Guest fallback for share display
                    if (myShare === 0) {
                        const guestKey = `guest:${currentUser.firstName} ${currentUser.lastName || ''}`.trim();
                        myShare = expenseBreakdown?.contributions?.[guestKey] || 0;
                    }

                    // Equal fallback only for real equal splits
                    if (myShare === 0 && Object.keys(expense.splits || expense.splitDetails || {}).length === 0) {
                        const splitType = (expense.splitType || 'equal').toLowerCase();
                        if (splitType === 'equal') {
                            myShare = parseFloat(expense.amount) / allMembers.length;
                        }
                    }

                    if (payerId === currentUser.uid) {
                        const totalReceived = settlements.reduce((sum, s) =>
                            sum + (s.toUser === currentUser.uid ? parseFloat(s.amount) : 0), 0);
                        displayAmount = parseFloat(expense.amount) - myShare - totalReceived;
                        totalExpenseForUser = displayAmount;
                        // amountColor remains red (total expense), receivable shown separately in green
                    } else if (myShare > 0) {
                        const totalPaid = settlements.reduce((sum, s) =>
                            sum + (s.fromUser === currentUser.uid ? parseFloat(s.amount) : 0), 0);
                        displayAmount = myShare - totalPaid;
                        totalExpenseForUser = myShare;
                        // amountColor remains red for what they owe
                    }

                    displayAmount = Math.max(0, displayAmount);
                    const isFullySettledForMe = displayAmount <= 0.01;
                    const isExpenseSettled = expenseBreakdown?.isSettled || false;

                    return `
                <tbody class="expense-row-group ${isSettledRow ? 'settled-expense-row-' + groupId + ' hidden' : ''}"
                       style="${isSettledRow ? 'background: rgba(0,0,0,0.02);' : ''}">
                    <tr class="${isFullySettledForMe ? 'expense-settled' : ''} ${isExpenseSettled ? 'fully-settled-row' : ''}">
                        <td>${expense.date.toDate().toLocaleDateString()}</td>
                        <td>
                            <div style="font-weight: 500;">${expense.description}</div>
                            ${expense.attachments && expense.attachments.length > 0 ? `
                                <div class="attachments-mini" style="display: flex; gap: 4px; margin-top: 4px;">
                                    ${expense.attachments.map(url => `
                                        <i class="fas fa-paperclip" style="cursor: pointer; color: var(--primary);" onclick="viewAttachment('${url}')"></i>
                                    `).join('')}
                                </div>
                            ` : ''}
                        </td>
                        <td><span class="badge badge-secondary">${payer.firstName}</span></td>
                        <td style="color: var(--danger); font-weight: 600;">
                            <div style="font-size: 0.8rem; color: var(--text-gray);">${t('totalExpense')}</div>
                            ${formatCurrency(parseFloat(expense.amount))}
                            ${(() => {
                            if (payerId === currentUser.uid && displayAmount > 0.01) {
                                return `<div style="font-size: 0.7rem; color: var(--success); margin-top: 2px;">${t('receivable')}: ${formatCurrency(displayAmount)}</div>`;
                            }
                            return '';
                        })()}
                        </td>
                        <td style="font-weight: 600; color: var(--text-dark);">
                            ${formatCurrency(myShare)}
                        </td>
                        <td>
                            <small class="text-secondary">${(() => {
                            const st = expense.splitType || 'equal';
                            const normalized = st.toLowerCase();
                            if (normalized === 'equal') return t('equal');
                            if (normalized === 'exact' || normalized === 'custom') return t('exact') || 'Exact';
                            if (normalized === 'percent') return t('percent') || 'Percent';
                            if (normalized === 'shares') return t('shares') || 'Shares';
                            return t(st) || st;
                        })()}</small>
                        </td>
                        <td>
                            ${expense.remarks || '-'}
                        </td>
                        <td>
                            ${isExpenseSettled ?
                            '<span style="color: var(--success); font-weight: 600;">✓ ' + t('settled') + '</span>' :
                            (isFullySettledForMe ? '<span style="color: var(--success);">✓ ' + t('paid') + '</span>' : '<span style="color: var(--warning);">⏳ ' + t('pending') + '</span>')}
                        </td>
                        <td>
                            <div class="actions">
                                <button class="action-btn" onclick="toggleExpenseExpansion('${expense.id}')" title="Expand Details">
                                    <i class="fas fa-chevron-down" id="expand-icon-${expense.id}"></i>
                                </button>
                                <button class="action-btn" onclick="editGroupExpense('${expense.id}', '${groupId}')">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="action-btn danger" onclick="deleteGroupExpense('${expense.id}', '${groupId}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                    <tr id="expense-details-${expense.id}" class="expense-details-row" style="display: none;">
                        <td colspan="10" style="padding: 0;">
                            <div class="expense-expansion-content" style="background: var(--bg-light); padding: 1rem; border-radius: 8px; margin: 0.5rem 0;">
                                <div class="row" style="margin: 0;">
                                    <div class="col-md-6">
                                        <h5 style="color: var(--primary); margin-bottom: 1rem;">Individual Balances</h5>
                                        ${(() => {
                            if (!expenseBreakdown) return '<p>No balance data available</p>';
                            const pId = expense.paidBy || expense.userId;
                            return Object.entries(expenseBreakdown.individualBalances || {})
                                .filter(([mId, amt]) => amt !== 0)
                                .map(([mId, _]) => {
                                    const member = memberMap[mId] || { firstName: mId.startsWith('guest:') ? mId.split(':')[1] : 'Unknown', lastName: mId.startsWith('guest:') ? '(Guest)' : '' };
                                    const isP = mId === pId;
                                    const remainingBalance = expenseBreakdown.remainingBalances[mId] || 0;
                                    let displayStatus = '';
                                    let balanceColor = 'var(--text-gray)';
                                    if (isP) {
                                        displayStatus = 'Payer';
                                        balanceColor = 'var(--primary)';
                                    } else if (Math.abs(remainingBalance) < 0.01) {
                                        displayStatus = 'Settled';
                                        balanceColor = 'var(--success)';
                                    } else {
                                        displayStatus = `Owes ${formatCurrency(Math.abs(remainingBalance))}`;
                                        balanceColor = 'var(--danger)';
                                    }
                                    return `
                                                        <div id="individual-balance-${expense.id}-${mId}" style="display: flex; justify-content: space-between; align-items: center; padding: 0.5rem; margin-bottom: 0.25rem; border-radius: 4px; background: var(--bg-card);">
                                                            <div style="display: flex; align-items: center; gap: 0.5rem;">
                                                                <span style="font-weight: 500;">${member.firstName} ${member.lastName}</span>
                                                                ${isP ? '<span class="badge badge-primary" style="font-size: 0.7rem;">Payer</span>' : ''}
                                                            </div>
                                                            <div style="text-align: right;">
                                                                <div style="font-weight: 600; color: ${balanceColor};">
                                                                    ${displayStatus}
                                                                </div>
                                                                <div style="display: flex; gap: 0.25rem; margin-top: 0.25rem;">
                                                                    <button class="btn btn-sm btn-outline-primary" style="font-size: 0.7rem; padding: 0.2rem 0.4rem;" onclick="editIndividualBalance('${expense.id}', '${mId}', ${remainingBalance}, '${groupId}')">
                                                                        <i class="fas fa-edit"></i>
                                                                    </button>
                                                                    ${!isP && Math.abs(remainingBalance) > 0.01 ? `
                                                                    <button class="btn btn-sm btn-outline-success" style="font-size: 0.7rem; padding: 0.2rem 0.4rem;" onclick="settleIndividualBalance('${expense.id}', '${mId}', ${remainingBalance}, '${groupId}')">
                                                                        <i class="fas fa-check-circle"></i>
                                                                    </button>
                                                                    ` : ''}
                                                                    <button class="btn btn-sm btn-outline-danger" style="font-size: 0.7rem; padding: 0.2rem 0.4rem;" onclick="deleteIndividualBalance('${expense.id}', '${mId}', '${groupId}')">
                                                                        <i class="fas fa-trash"></i>
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        </div>`;
                                }).join('');
                        })()}
                                    </div>
                                    <div class="col-md-6">
                                        <h5 style="color: var(--primary); margin-bottom: 1rem;">Settlement History</h5>
                                        ${(() => {
                            if (settlements.length === 0) {
                                return '<div style="padding: 0.75rem; background: var(--bg-card); border-radius: 4px; text-align: center; color: var(--text-gray);">No settlements recorded for this expense</div>';
                            }
                            return settlements.map(settlement => {
                                const sPayer = memberMap[settlement.fromUser] || { firstName: settlement.fromUser?.startsWith('guest:') ? settlement.fromUser.split(':')[1] : 'Unknown', lastName: settlement.fromUser?.startsWith('guest:') ? '(Guest)' : '' };
                                const sReceiver = memberMap[settlement.toUser] || { firstName: settlement.toUser?.startsWith('guest:') ? settlement.toUser.split(':')[1] : 'Unknown', lastName: settlement.toUser?.startsWith('guest:') ? '(Guest)' : '' };
                                return `
                                                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.5rem; margin-bottom: 0.25rem; background: var(--success-light); border-radius: 4px; border-left: 3px solid var(--success);">
                                                        <div>
                                                            <div style="font-weight: 600; color: var(--success);">${sPayer.firstName} ${sPayer.lastName} → ${sReceiver.firstName} ${sReceiver.lastName}: ${formatCurrency(settlement.amount)} Settled</div>
                                                            <div style="font-size: 0.8rem; color: var(--text-gray);">${settlement.date.toDate().toLocaleDateString()}</div>
                                                        </div>
                                                        <div style="display: flex; gap: 0.25rem;">
                                                            <button class="btn btn-sm btn-outline-primary" style="font-size: 0.7rem; padding: 0.2rem 0.4rem;" onclick="editSettlement('${expense.id}', '${settlement.id || settlement.settlementId || (settlement.fromUser + '_' + settlement.toUser + '_' + settlement.amount + '_' + (settlement.date?.toMillis?.() || settlement.date))}', '${groupId}')">
                                                                <i class="fas fa-edit"></i>
                                                            </button>
                                                            <button class="btn btn-sm btn-outline-danger" style="font-size: 0.7rem; padding: 0.2rem 0.4rem;" onclick="deleteSettlement('${expense.id}', '${settlement.id || settlement.settlementId || (settlement.fromUser + '_' + settlement.toUser + '_' + settlement.amount + '_' + (settlement.date?.toMillis?.() || settlement.date))}', '${groupId}')">
                                                                <i class="fas fa-trash"></i>
                                                            </button>
                                                        </div>
                                                    </div>`;
                            }).join('');
                        })()}
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            `;
                };

                const modal = document.createElement('div');
                modal.className = 'modal-overlay show';
                modal.innerHTML = `
            <div class="modal modal-large" style="max-width: 95vw; width: 1000px;">
                <div class="modal-header">
                    <div>
                        <h3 class="modal-title">${group.name}</h3>
                        <small class="text-secondary">${(group.members?.length || 0) + (group.guestMembers?.length || 0)} ${t('membersCount')} • ${t('groupCode')}: ${group.code}</small>
                    </div>
                    <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body" style="padding: 0;">
                    <div class="row" style="margin: 0;">
                        <div class="col-md-9" style="padding: 1.5rem;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                                <h4 style="margin:0;">${t('expenses')}</h4>
                                <div style="display: flex; gap: 10px;">
                                    <button class="btn btn-secondary btn-sm" onclick="exportGroupPDF('${groupId}')">
                                        <i class="fas fa-file-pdf"></i> ${t('pdfReport')}
                                    </button>
                                    <button class="btn btn-success btn-sm" onclick="exportGroupExcel('${groupId}')">
                                        <i class="fas fa-file-excel"></i> ${t('exportExcel')}
                                    </button>
                                    <button class="btn btn-primary btn-sm" onclick="openAddGroupExpenseModal('${groupId}', '${group.name}')">
                                        <i class="fas fa-plus"></i> ${t('addExpense')}
                                    </button>
                                </div>
                            </div>

                            ${displayExpenses.length === 0 ? `
                                <div class="empty-state">
                                    <div class="empty-icon"><i class="fas fa-receipt"></i></div>
                                    <div class="empty-title">${t('noExpensesFound')}</div>
                                    <div class="empty-message">${t('addPersonalPrompt')}</div>
                                </div>
                            ` : `
                                <div class="table-wrapper" style="max-height: 500px; overflow-y: auto;">
                                    <table class="table">
                                        <thead>
                                            <tr>
                                                <th>${t('date')}</th>
                                                <th>${t('description')}</th>
                                                <th>${t('paidBy')}</th>
                                                <th>${t('amount')}</th>
                                                <th>${t('yourShare') || 'Your Share'}</th>
                                                <th>${t('split')}</th>
                                                <th>${t('remarks') || 'Remarks'}</th>
                                                <th>${t('status')}</th>
                                                <th>${t('actions')}</th>
                                            </tr>
                                        </thead>
                                        ${activeExpenses.map(e => renderExpenseRow(e, false)).join('')}
                                        ${settledExpenses.length > 0 ? `
                                            <tbody>
                                                <tr style="background: var(--bg-light); cursor: pointer;"
                                                    onclick="document.querySelectorAll('.settled-expense-row-${groupId}').forEach(el => el.classList.toggle('hidden'))">
                                                    <td colspan="10" style="text-align: center; color: var(--text-gray); font-weight: 500; padding: 1rem;">
                                                        <i class="fas fa-history"></i> Show ${settledExpenses.length} Settled Expense${settledExpenses.length > 1 ? 's' : ''}
                                                    </td>
                                                </tr>
                                            </tbody>
                                            ${settledExpenses.map(e => renderExpenseRow(e, true)).join('')}
                                        ` : ''}
                                    </table>
                                </div>

                                <div style="margin-top: 1.5rem; padding: 1rem; background: var(--bg-hover); border-radius: 8px; border: 1px solid var(--border);">
                                    <h5 style="margin-bottom: 1rem; color: var(--text-primary);">${t('expenseSummary')}</h5>
                                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                                        <span class="text-secondary">${t('totalExpenses')}:</span>
                                        <strong style="color: var(--danger); font-size: 1.1rem;">${formatCurrency(displayExpenses.reduce((sum, exp) => {
                    if (exp.category === 'Settlement' || exp.isSettlement) return sum;
                    return sum + (parseFloat(exp.amount) || 0);
                }, 0))}</strong>
                                    </div>
                                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                                        <span class="text-secondary">${t('receivable')}:</span>
                                        <strong style="color: var(--success);">${formatCurrency(displayExpenses.reduce((sum, e) => {
                    const payerId = e.paidBy || e.userId;
                    if (payerId !== currentUser.uid) return sum;
                    const breakdown = breakdowns[e.id];
                    const settlements = e.settlements || [];
                    const totalReceived = settlements.reduce((s, settlement) => {
                        return s + (settlement.toUser === currentUser.uid ? parseFloat(settlement.amount) : 0);
                    }, 0);
                    const myShare = breakdown?.contributions?.[currentUser.uid] || 0;
                    return sum + (parseFloat(e.amount) - myShare - totalReceived);
                }, 0))}</strong>
                                    </div>
                                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                                        <span class="text-secondary">${t('yourShare') || 'Your Share'}:</span>
                                        <strong style="color: var(--danger);">${formatCurrency(displayExpenses.reduce((sum, e) => {
                    const breakdown = breakdowns[e.id];
                    let s = breakdown?.contributions?.[currentUser.uid] || 0;
                    if (s === 0) {
                        const guestKey = `guest:${currentUser.firstName} ${currentUser.lastName || ''}`.trim();
                        s = breakdown?.contributions?.[guestKey] || 0;
                    }
                    return sum + s;
                }, 0))}</strong>
                                    </div>
                                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                                        <span class="text-secondary">${t('totalExpensesCount')}:</span>
                                        <strong>${activeExpenses.length}</strong>
                                    </div>
                                </div>
                            `}
                        </div>

                        <div class="col-md-3" style="border-left: 1px solid var(--border); background: var(--bg-hover); padding: 1.5rem;">
                            <div style="margin-bottom: 2rem;">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                                    <h5 style="margin-bottom: 0; color: var(--text-primary);">${t('members')}</h5>
                                </div>
                                <div style="display: flex; flex-direction: column; gap: 8px;">
                                    ${currentGroupMembers.map(m => `
                                        <div style="display: flex; align-items: center; gap: 10px;">
                                            <img src="${m.photoUrl || 'https://ui-avatars.com/api/?name=' + m.firstName + '+' + m.lastName}" style="width: 30px; height: 30px; border-radius: 50%;">
                                            <span style="font-size: 0.9rem;">${m.firstName} ${m.lastName}</span>
                                            ${m.id === group.createdBy ? '<i class="fas fa-crown text-warning" title="Admin" style="font-size: 0.8rem;"></i>' : ''}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <h5 style="margin-bottom: 1rem; color: var(--text-primary);">${t('totalBalance')}</h5>

                            ${debts.length === 0 ? `
                                <div style="text-align: center; color: var(--success); padding: 1rem;">
                                    <i class="fas fa-check-circle" style="font-size: 2rem; margin-bottom: 0.5rem;"></i>
                                    <p>${t('allSettledUp')}</p>
                                </div>
                            ` : `
                                <div class="debts-list">
                                    ${debts.map(debt => {
                    const from = memberMap[debt.from] || { firstName: 'Unknown' };
                    const to = memberMap[debt.to] || { firstName: 'Unknown' };
                    const isDebtor = debt.from === currentUser.uid;
                    const isCreditor = debt.to === currentUser.uid;
                    let actionIcons = '';
                    let statusText = '';
                    let cardClass = 'debt-card';

                    if (isDebtor) {
                        actionIcons = `
                                                <div style="display: flex; gap: 4px; align-items: center; margin-left: auto;">
                                                    <button class="action-btn" onclick="settleDebt('${groupId}', '${debt.from}', '${debt.to}', ${debt.amount})" title="${t('markAsSettled')}" style="padding: 4px 8px; border-radius: 4px; background: var(--primary); color: white; border: none; cursor: pointer; font-size: 0.8rem;">
                                                        <i class="fas fa-check"></i>
                                                    </button>
                                                    <button class="action-btn" onclick="settleDebt('${groupId}', '${debt.from}', '${debt.to}', ${debt.amount})" title="${t('markAsPaid')}" style="padding: 4px 8px; border-radius: 4px; background: var(--success); color: white; border: none; cursor: pointer; font-size: 0.8rem;">
                                                        <i class="fas fa-check-circle"></i>
                                                    </button>
                                                </div>
                                            `;
                        statusText = `<span style="color: var(--danger); font-size: 0.8rem;">${t('youOwe')}</span>`;
                        cardClass = 'debt-card debtor';
                    } else if (isCreditor) {
                        actionIcons = `
                                                <div style="display: flex; gap: 4px; align-items: center; margin-left: auto;">
                                                    <button class="action-btn" onclick="settleDebt('${groupId}', '${debt.from}', '${debt.to}', ${debt.amount})" title="${t('markAsSettled')}" style="padding: 4px 8px; border-radius: 4px; background: var(--primary); color: white; border: none; cursor: pointer; font-size: 0.8rem;">
                                                        <i class="fas fa-check"></i>
                                                    </button>
                                                    <button class="action-btn" onclick="settleDebt('${groupId}', '${debt.from}', '${debt.to}', ${debt.amount})" title="${t('markAsReceived')}" style="padding: 4px 8px; border-radius: 4px; background: var(--success); color: white; border: none; cursor: pointer; font-size: 0.8rem;">
                                                        <i class="fas fa-hand-holding-usd"></i>
                                                    </button>
                                                </div>
                                            `;
                        statusText = `<span style="color: var(--success); font-size: 0.8rem;">${t('owesYou')}</span>`;
                        cardClass = 'debt-card creditor';
                    } else {
                        statusText = `<span class="text-secondary" style="font-size: 0.8rem;">${t('pending')}</span>`;
                    }

                    return `
                                            <div class="${cardClass}" id="debt-card-${groupId}-${debt.from}-${debt.to}" style="background: var(--bg-card); padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border); font-size: 0.9rem; ${isDebtor ? 'border-left: 4px solid var(--danger);' : isCreditor ? 'border-left: 4px solid var(--success);' : ''}">
                                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                                    <div style="flex: 1;">
                                                        <div style="display: flex; align-items: center; gap: 5px; margin-bottom: 2px;">
                                                            <strong style="color: var(--text-dark);">${from.firstName}</strong>
                                                            <span class="text-secondary" style="font-size: 0.8rem;">→</span>
                                                            <strong style="color: var(--text-dark);">${to.firstName}</strong>
                                                        </div>
                                                        ${statusText}
                                                        <div style="font-weight: 700; font-size: 1.1rem; color: var(--primary); margin-top: 4px;">${formatCurrency(Math.abs(debt.amount))}</div>
                                                    </div>

                    const updatedSettlements = currentSettlements.filter(s => {

                        // Check composite key
                        const compositeKey = s.fromUser + '_' + s.toUser + '_' + s.amount + '_' + (s.date?.toMillis?.() || s.date);

        /**
         * Settles an individual balance by recording a settlement and updating the expense.
         * @param {string} expenseId - The ID of the expense.
         * @param {string} memberId - The ID of the member.
         * @param {number} currentBalance - The current remaining balance.
         * @param {string} groupId - The ID of the group.
         */
        window.settleIndividualBalance = async function (expenseId, memberId, currentBalance, groupId) {
            showConfirmation('Settle Balance', `Mark this balance as settled?`, async () => {
                showLoading();
                try {
                    const batch = db.batch();
                    const timestamp = firebase.firestore.Timestamp.now();
                    const expenseRef = db.collection('group_expenses').doc(expenseId);
                    const expenseDoc = await expenseRef.get();
                    if (!expenseDoc.exists) {
                        throw new Error('Expense not found');
                    }
                    const expense = expenseDoc.data();
                    const payerId = expense.paidBy || expense.userId;
                    // Determine correct settlement direction (fixed condition)
                    // If currentBalance < 0, member owes (from member to payer)
                    // If currentBalance > 0, member is owed (from payer to member)
                    const fromUser = currentBalance < 0 ? memberId : payerId;
                    const toUser = currentBalance < 0 ? payerId : memberId;
                    const amount = Math.abs(currentBalance);

                    // 1. Create Settlement Record (Embedded only)
                    const uniqueId = `settlement_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                    const settlementRecord = {
                        id: uniqueId,
                        fromUser: fromUser,
                        toUser: toUser,
                        amount: amount,
                        date: timestamp,
                        recordedBy: currentUser.uid,
                        settlementId: uniqueId
                    };
                    batch.update(expenseRef, {
                        settlements: firebase.firestore.FieldValue.arrayUnion(settlementRecord),
                        updatedAt: timestamp
                    });
                    await batch.commit();
                    showToast('Success', 'Balance settled successfully!');
                    // Real-time DOM updates for individual balance
                    var individualBalanceElement = document.getElementById(`individual-balance-${expenseId}-${memberId}`);
                    if (individualBalanceElement) {
                        const statusDiv = individualBalanceElement.querySelector('div:nth-child(2) > div:nth-child(1)');
                        if (statusDiv) {
                            statusDiv.style.color = 'var(--success)';
                            statusDiv.innerHTML = 'Settled';
                        }
                        const settleButton = individualBalanceElement.querySelector('button[onclick*="settleIndividualBalance"]');
                        if (settleButton) {
                            settleButton.remove();
                        }
                    }
                    // Also remove from Total Balances if applicable (debt-card)
                    var totalBalanceDebtCard = document.getElementById(`debt-card-${groupId}-${fromUser}-${toUser}`);
                    if (totalBalanceDebtCard) {
                        totalBalanceDebtCard.remove();
                    }
                    var totalBalanceDebtCardReverse = document.getElementById(`debt-card-${groupId}-${toUser}-${fromUser}`);
                    if (totalBalanceDebtCardReverse) {
                        totalBalanceDebtCardReverse.remove();
                    }
                    // Refresh the group view after a short delay to allow DOM updates to render
                    setTimeout(() => viewGroupDetails(groupId), 300);
                } catch (error) {
                    showToast('Error', 'Failed to settle balance: ' + error.message, 'error');
                } finally {
                    hideLoading();
                }
            });
        }

        /**
         * Records a settlement for a debt, creates a settlement expense, and reconciles original expenses.
         * @param {string} groupId - The ID of the group.
         * @param {string} fromUid - The ID of the user paying (debtor).
         * @param {string} toUid - The ID of the user receiving (creditor).
         * @param {number} amount - The amount to settle.
         */
        async function settleDebt(groupId, fromUid, toUid, amount) {
            const amountVal = parseFloat(amount);
            showConfirmation(t('settleUp'), `${t('recordPaymentOf')} ${formatCurrency(amountVal)}?`, async () => {
                showLoading();
                try {
                    const batch = db.batch();
                    const timestamp = firebase.firestore.Timestamp.now();
                    const batchSettlementId = `settlement_batch_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;

                    // 2. RECONCILE: Find original expenses to mark them as settled
                    // This is what removes the row from the "Total Balances" table
                    const expensesSnapshot = await db.collection('group_expenses')
                        .where('groupId', '==', groupId)
                        .get();
                    let remainingToSettle = amountVal;
                    expensesSnapshot.docs.forEach(doc => {
                        const exp = doc.data();
                        // Skip if it's already a settlement or we've finished the amount
                        if (exp.category === 'Settlement' || remainingToSettle <= 0) return;
                        const payerId = exp.paidBy || exp.userId;
                        const splits = exp.splits || exp.splitDetails || {};
                        // If the 'fromUid' owes 'toUid' in this specific expense
                        if (payerId === toUid && splits[fromUid] > 0) {
                            const alreadySettled = (exp.settlements || [])
                                .filter(s => s.fromUser === fromUid)
                                .reduce((sum, s) => sum + parseFloat(s.amount), 0);
                            const stillOwed = splits[fromUid] - alreadySettled;
                            if (stillOwed > 0) {
                                const amountToApply = Math.min(remainingToSettle, stillOwed);
                                batch.update(doc.ref, {
                                    settlements: firebase.firestore.FieldValue.arrayUnion({
                                        id: `settlement_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
                                        fromUser: fromUid,
                                        toUser: toUid,
                                        amount: amountToApply,
                                        date: timestamp,
                                        settlementId: batchSettlementId
                                    }),
                                    updatedAt: timestamp
                                });
                                remainingToSettle -= amountToApply;
                            }
                        }
                    });
                    await batch.commit();
                    showToast('Success', 'Settlement recorded and balances updated!');
                    // Real-time DOM updates for total balance debt card
                    var totalBalanceDebtCard = document.getElementById(`debt-card-${groupId}-${fromUid}-${toUid}`);
                    if (totalBalanceDebtCard) {
                        totalBalanceDebtCard.remove();
                    }
                    var totalBalanceDebtCardReverse = document.getElementById(`debt-card-${groupId}-${toUid}-${fromUid}`);
                    if (totalBalanceDebtCardReverse) {
                        totalBalanceDebtCardReverse.remove();
                    }
                    // Refresh the group view after a short delay to allow DOM updates to render
                    setTimeout(() => viewGroupDetails(groupId), 300);
                } catch (e) {
                    console.error(e);
                    showToast('Error', e.message, 'error');
                } finally {
                    hideLoading();
                }
            });
        }

        /**
         * Calculates net balances for each member in a group based on expenses and settlements.
         * @param {object} group - The group object with members, expenses, and settlements.
         * @returns {object} - Object with member IDs as keys and net balances as values.
         */
        function calculateBalances(group) {
            const balances = {}; // { memberId: netAmount }
            // Initialize everyone at zero
            for (const m of group.members) {
                balances[m.id] = 0;
            }
            // Process all expenses
            for (const exp of group.expenses) {
                // Skip settlement expenses (we rely on embedded settlements or settlements array)
                if (exp.category === 'Settlement' || exp.isSettlement) {
                    continue;
                }
                const amount = parseFloat(exp.amount);
                const payer = exp.paidBy || exp.userId;

                // For "All paid individually", the net impact on everyone's balance is 0
                // because everyone paid their own share. But we still need to track it
                // in the breakdown for "Your Share" display.
                if (exp.allPaidIndividually) {
                    continue;
                }
                // Payer gets + full amount (he lent the money)
                if (payer && balances.hasOwnProperty(payer)) {
                    balances[payer] += amount;
                }
                // Everyone owes their share (including payer sometimes)
                // Use normalized splits format (splits or splitDetails for backward compatibility)
                const splits = exp.splits || exp.splitDetails || {};
                if (Object.keys(splits).length > 0) {
                    // Use normalized splits
                    for (const [memberId, owed] of Object.entries(splits)) {
                        if (balances.hasOwnProperty(memberId)) {
                            balances[memberId] -= parseFloat(owed) || 0;
                        }
                    }
                } else {
                    // Fallback: equal split among all members
                    const splitAmount = amount / group.members.length;
                    for (const m of group.members) {
                        balances[m.id] -= splitAmount;
                    }
                }
            }
            // Process settlements - prefer embedded settlements in expenses for newer data
            // If group has a settlements array, use that; otherwise use embedded settlements
            if (group.settlements && group.settlements.length > 0) {
                // Use settlements array (as passed by calculateGroupDebts)
                for (const s of group.settlements) {
                    const from = s.from;
                    const to = s.to;
                    const sAmount = parseFloat(s.amount);
                    if (balances.hasOwnProperty(from)) {
                        balances[from] += sAmount; // Fixed: Payer's debt decreases (balance goes up/less negative)
                    }
                    if (balances.hasOwnProperty(to)) {
                        balances[to] -= sAmount; // Fixed: Receiver's receivable decreases (balance goes down/less positive)
                    }
                }
            } else {
                // Use embedded settlements in expenses (legacy format)
                for (const exp of group.expenses) {
                    if (exp.settlements && Array.isArray(exp.settlements)) {
                        for (const settlement of exp.settlements) {
                            const from = settlement.fromUser || settlement.from;
                            const to = settlement.toUser || settlement.to;
                            const sAmount = parseFloat(settlement.amount);
                            if (balances.hasOwnProperty(from)) {
                                balances[from] += sAmount; // Fixed
                            }
                            if (balances.hasOwnProperty(to)) {
                                balances[to] -= sAmount; // Fixed
                            }
                        }
                    }
                }
            }
            return balances;
        }

        /**
         * Calculates simplified group debts using Pairwise Netting (Specific User Requirement).
         * Aggregates all debts between two people and nets them out.
         * @param {array} expenses - List of expenses.
         * @param {array} memberIds - List of member IDs.
         * @param {array} [settlements=null] - List of settlements.
         * @returns {array} - List of net debt objects {from, to, amount}.
         */
        function calculateGroupDebts(expenses, memberIds, settlements = null) {
            const debtMatrix = {}; // { from: { to: amount } }

            // Initialize matrix
            memberIds.forEach(m1 => {
                debtMatrix[m1] = {};
                memberIds.forEach(m2 => {
                    if (m1 !== m2) debtMatrix[m1][m2] = 0;
                });
            });

            // 1. Accumulate Debts from Expenses
            expenses.forEach(expense => {
                // Skip if all paid individually or settlement
                if (expense.allPaidIndividually || expense.category === 'Settlement' || expense.isSettlement) return;

                const amount = parseFloat(expense.amount);
                const payer = expense.paidBy || expense.userId;
                const splits = expense.splits || expense.splitDetails || {};

                if (Object.keys(splits).length > 0) {
                    // Use normalized splits
                    for (const [memberId, owed] of Object.entries(splits)) {
                        if (memberId !== payer && debtMatrix[memberId] && debtMatrix[memberId][payer] !== undefined) {
                            debtMatrix[memberId][payer] += parseFloat(owed) || 0;
                        }
                    }
                } else {
                    // Fallback: Equal split
                    const splitAmount = amount / memberIds.length;
                    memberIds.forEach(memberId => {
                        if (memberId !== payer && debtMatrix[memberId] && debtMatrix[memberId][payer] !== undefined) {
                            debtMatrix[memberId][payer] += splitAmount;
                        }
                    });
                }
            });

            // 2. Subtract Settlements (Reduce Debts)
            // Settlements are payments: "From" pays "To". This reduces the debt "From" owes "To".
            const allSettlements = settlements || [];
            if (!settlements) {
                expenses.forEach(expense => {
                    const expenseSettlements = expense.settlements || [];
                    expenseSettlements.forEach(settlement => {
                        allSettlements.push({
                            from: settlement.fromUser,
                            to: settlement.toUser,
                            amount: settlement.amount
                        });
                    });
                });
            }

            allSettlements.forEach(s => {
                const from = s.from;
                const to = s.to;
                const amount = parseFloat(s.amount);

                // If From owes To, reduce that debt
                if (debtMatrix[from] && debtMatrix[from][to] !== undefined) {
                    debtMatrix[from][to] -= amount;
                } else {
                    // If not tracked (e.g. users removed), ignore or handle gracefully
                }
            });

            // 3. Pairwise Netting
            const debts = [];

            // Iterate unique pairs to net them out
            // We can iterate all and if bond (A->B) > (B->A), result is A->B (diff)
            for (let i = 0; i < memberIds.length; i++) {
                for (let j = i + 1; j < memberIds.length; j++) {
                    const A = memberIds[i];
                    const B = memberIds[j];

                    const debtAB = debtMatrix[A][B] || 0; // A owes B
                    const debtBA = debtMatrix[B][A] || 0; // B owes A

                    if (debtAB > debtBA) {
                        const net = debtAB - debtBA;
                        if (net > 0.01) debts.push({ from: A, to: B, amount: net });
                    } else if (debtBA > debtAB) {
                        const net = debtBA - debtAB;
                        if (net > 0.01) debts.push({ from: B, to: A, amount: net });
                    }
                }
            }

            return debts;
        }

        /**
         * Calculates breakdowns for each expense, including contributions, balances, and settlements.
         * @param {array} expenses - List of expenses.
         * @param {array} memberIds - List of member IDs.
         * @param {object} memberMap - Map of member IDs to member objects.
         * @returns {object} - Object with expense IDs as keys and breakdown objects as values.
         */
        function calculateExpenseBreakdown(expenses, memberIds, memberMap) {
            const expenseBreakdowns = {};
            expenses.forEach(expense => {
                const expenseId = expense.id;
                const amount = parseFloat(expense.amount);
                const payer = expense.paidBy || expense.userId;
                expenseBreakdowns[expenseId] = {
                    expense: expense,
                    payer: payer,
                    totalAmount: amount,
                    contributions: {}, // What each member should pay (their share)
                    individualBalances: {}, // For display: everyone shows negative (their contribution)
                    remainingBalances: {}, // Actual debt after settlements
                    settlements: {},
                    isSettled: false
                };
                // Calculate contributions using normalized splits format
                // Use splits if available, otherwise fall back to splitDetails for backward compatibility
                const splits = expense.splits || expense.splitDetails || {};

                // For "All paid individually", we still calculate contributions for tracking
                // but mark it as settled.
                if (Object.keys(splits).length === 0) {
                    // Equal split among all members (fallback)
                    const sharePerPerson = amount / memberIds.length;
                    memberIds.forEach(memberId => {
                        // What this member should contribute
                        expenseBreakdowns[expenseId].contributions[memberId] = sharePerPerson;
                        // For display: everyone shows their share as negative
                        expenseBreakdowns[expenseId].individualBalances[memberId] = -sharePerPerson;
                        // For debt tracking: payer starts at 0 (they don't owe themselves)
                        // Others start owing their share (negative)
                        expenseBreakdowns[expenseId].remainingBalances[memberId] =
                            (expense.allPaidIndividually || memberId === payer) ? 0 : -sharePerPerson;
                    });
                } else {
                    // Use normalized splits (already in rupees)
                    memberIds.forEach(memberId => {
                        const share = parseFloat(splits[memberId] || 0);
                        // What this member should contribute
                        expenseBreakdowns[expenseId].contributions[memberId] = share;
                        // For display: everyone shows their share as negative (if they're part of split)
                        expenseBreakdowns[expenseId].individualBalances[memberId] = share > 0 ? -share : 0;
                        // For debt tracking
                        expenseBreakdowns[expenseId].remainingBalances[memberId] =
                            (expense.allPaidIndividually || memberId === payer) ? 0 : (share > 0 ? -share : 0);
                    });
                }

                if (expense.allPaidIndividually) {
                    expenseBreakdowns[expenseId].isSettled = true;
                }
            });
            // Calculate net balances after settlements stored within expenses
            expenses.forEach(expense => {
                if (expense.settlements && expense.settlements.length > 0) {
                    // Apply settlements stored within this expense
                    expense.settlements.forEach(settlement => {
                        const fromUser = settlement.fromUser;
                        const toUser = settlement.toUser;
                        const settledAmount = parseFloat(settlement.amount);
                        // Apply settlement to this expense's REMAINING balances (not individual balances)
                        // Individual balances always show the original contribution
                        if (expenseBreakdowns[expense.id]) {
                            // Reduce the debt for the person who settled
                            if (expenseBreakdowns[expense.id].remainingBalances[fromUser] !== undefined) {
                                expenseBreakdowns[expense.id].remainingBalances[fromUser] += settledAmount;
                            }
                            // Note: We don't change toUser's balance because settlements reduce debts owed TO them
                            // The debt reduction is reflected in the fromUser's balance moving toward 0
                            // Store settlement record in the breakdown for display
                            if (!expenseBreakdowns[expense.id].settlements[fromUser]) {
                                expenseBreakdowns[expense.id].settlements[fromUser] = {};
                            }
                            expenseBreakdowns[expense.id].settlements[fromUser][toUser] =
                                (expenseBreakdowns[expense.id].settlements[fromUser][toUser] || 0) + settledAmount;
                            // Check if this expense is now settled
                            const totalRemaining = Object.values(expenseBreakdowns[expense.id].remainingBalances)
                                .reduce((sum, balance) => sum + Math.abs(balance), 0);
                            if (totalRemaining < 0.01) {
                                expenseBreakdowns[expense.id].isSettled = true;
                            }
                        }
                    });
                }
            });
            return expenseBreakdowns;
        }

        /**
         * Saves a new or edited group expense to Firestore.
         */
        async function saveGroupExpense() {
            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            try {
                const groupId = document.getElementById('groupExpenseGroupId').value;
                const editId = document.getElementById('editGroupExpenseId').value;
                const amount = parseFloat(document.getElementById('groupExpenseAmount').value);
                // Validate and calculate splits based on split type
                const splitType = document.getElementById('groupExpenseSplitType').value;
                const checkedBoxes = Array.from(document.querySelectorAll('.split-member-check:checked'));
                const splits = {}; // Normalized format: { memberId: owedAmount }
                if (checkedBoxes.length === 0) {
                    throw new Error('Please select at least one member to split with.');
                }
                // Validate amount > 0
                if (amount <= 0) {
                    throw new Error('Expense amount must be greater than 0.');
                }
                if (splitType === 'equal') {
                    // Equal split: each = amount / members.length
                    const share = amount / checkedBoxes.length;
                    checkedBoxes.forEach(cb => {
                        splits[cb.value] = share;
                    });
                } else if (splitType === 'exact') {
                    // Exact amounts: directly use entered values (must sum = amount)
                    let totalExact = 0;
                    checkedBoxes.forEach(cb => {
                        const val = parseFloat(document.getElementById(`split-amount-${cb.value}`).value) || 0;
                        if (val < 0) {
                            throw new Error('Split amounts cannot be negative.');
                        }
                        splits[cb.value] = val;
                        totalExact += val;
                    });
                    // Validate sum matches amount (with tolerance ~0.01)
                    if (Math.abs(amount - totalExact) > 0.01) {
                        throw new Error(`Total split amount (${formatCurrency(totalExact)}) must match expense amount (${formatCurrency(amount)})`);
                    }
                } else if (splitType === 'percent') {
                    // Percentage: owed = amount × (percent / 100)
                    let totalPercent = 0;
                    checkedBoxes.forEach(cb => {
                        const percent = parseFloat(document.getElementById(`split-percent-${cb.value}`).value) || 0;
                        if (percent < 0 || percent > 100) {
                            throw new Error('Percentages must be between 0 and 100.');
                        }
                        totalPercent += percent;
                    });
                    // Validate total percentage = 100
                    if (Math.abs(100 - totalPercent) > 0.01) {
                        throw new Error(`Total percentage (${totalPercent.toFixed(2)}%) must equal 100%`);
                    }
                    // Calculate amounts from percentages
                    checkedBoxes.forEach(cb => {
                        const percent = parseFloat(document.getElementById(`split-percent-${cb.value}`).value) || 0;
                        splits[cb.value] = amount * (percent / 100);
                    });
                } else if (splitType === 'shares') {
                    // Shares: totalShares = sum all shares, owed = amount × (myShares / totalShares)
                    let totalShares = 0;
                    const sharesMap = {};
                    checkedBoxes.forEach(cb => {
                        const shares = parseFloat(document.getElementById(`split-shares-${cb.value}`).value) || 0;
                        if (shares < 0) {
                            throw new Error('Share values cannot be negative.');
                        }
                        sharesMap[cb.value] = shares;
                        totalShares += shares;
                    });
                    if (totalShares === 0) {
                        throw new Error('Total shares must be greater than 0.');
                    }
                    // Calculate amounts from shares
                    checkedBoxes.forEach(cb => {
                        const myShares = sharesMap[cb.value];
                        splits[cb.value] = amount * (myShares / totalShares);
                    });
                } else {
                    throw new Error(`Unknown split type: ${splitType}`);
                }
                // Final validation: splits must sum to amount (with tolerance)
                const splitsSum = Object.values(splits).reduce((sum, val) => sum + val, 0);
                if (Math.abs(amount - splitsSum) > 0.01) {
                    throw new Error(`Split calculation error: splits sum (${formatCurrency(splitsSum)}) does not match amount (${formatCurrency(amount)})`);
                }
                const paidByValue = document.getElementById('groupExpensePaidBy').value;
                // Validate paidBy is an existing member id (if not "all paid individually")
                if (paidByValue !== 'all_paid_individually') {
                    const memberIds = currentGroupMembers.map(m => m.id);
                    if (!memberIds.includes(paidByValue)) {
                        throw new Error('Paid by must be an existing member.');
                    }
                }
                const expenseData = {
                    date: firebase.firestore.Timestamp.fromDate(new Date(document.getElementById('groupExpenseDate').value)),
                    description: document.getElementById('groupExpenseDescription').value,
                    category: document.getElementById('groupExpenseCategory').value,
                    mode: document.getElementById('groupExpenseMode').value,
                    amount: amount,
                    paidBy: paidByValue === 'all_paid_individually' ? null : paidByValue,
                    allPaidIndividually: paidByValue === 'all_paid_individually',
                    splitType: splitType,
                    splits: splits, // Normalized format: { memberId: owedAmount }
                    // Keep splitDetails for backward compatibility, but use splits as primary
                    splitDetails: splits,
                    settlements: [], // Initialize settlements array
                    remarks: document.getElementById('groupExpenseRemarks').value,
                    groupId: groupId,
                    userId: currentUser.uid, // Creator/Editor
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };
                // Handle Attachments
                const files = window.uploadedFiles;
                let attachments = [];
                if (editId && window.editingExpense && window.editingExpense.attachments) {
                    attachments = [...window.editingExpense.attachments];
                }
                for (let file of files) {
                    const ref = storage.ref(`groups/${groupId}/${Date.now()}_${file.name}`);
                    await ref.put(file);
                    const url = await ref.getDownloadURL();
                    attachments.push(url);
                }
                expenseData.attachments = attachments;
                if (editId) {
                    await db.collection('group_expenses').doc(editId).update(expenseData);
                    showToast('Success', 'Expense updated!');
                } else {
                    expenseData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection('group_expenses').add(expenseData);
                    showToast('Success', 'Expense added!');
                }
                const modal = document.getElementById('groupExpenseModal');
                if (modal) modal.remove();
                document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
                await viewGroupDetails(groupId);
            } catch (error) {
                showToast('Error', error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = `${t('save')}`;
            }
        }

        /**
         * Prepares the modal for editing an existing group expense.
         * @param {string} expenseId - The ID of the expense to edit.
         * @param {string} groupId - The ID of the group.
         */
        async function editGroupExpense(expenseId, groupId) {
            showLoading();
            try {
                const doc = await db.collection('group_expenses').doc(expenseId).get();
                const expense = { id: doc.id, ...doc.data() };
                window.editingExpense = expense; // Store for attachment logic
                openAddGroupExpenseModal(groupId, 'Group');
                // Fill Fields
                const modal = document.getElementById('groupExpenseModal');
                modal.querySelector('.modal-title').innerText = 'Edit Expense';
                document.getElementById('editGroupExpenseId').value = expenseId;
                document.getElementById('groupExpenseDate').value = expense.date.toDate().toISOString().split('T')[0];
                document.getElementById('groupExpenseAmount').value = expense.amount;
                document.getElementById('groupExpenseDescription').value = expense.description;
                document.getElementById('groupExpenseCategory').value = expense.category;
                document.getElementById('groupExpenseMode').value = expense.mode;
                document.getElementById('groupExpensePaidBy').value = expense.paidBy || expense.userId;
                document.getElementById('groupExpenseRemarks').value = expense.remarks || '';
                // Split Logic - use splits if available, otherwise fall back to splitDetails
                const splits = expense.splits || expense.splitDetails || {};
                const splitType = expense.splitType || 'equal';

                // Normalize old splitType values
                let normalizedSplitType = splitType.toLowerCase();
                if (normalizedSplitType === 'equal') normalizedSplitType = 'equal';
                else if (normalizedSplitType === 'custom') normalizedSplitType = 'exact';
                document.getElementById('groupExpenseSplitType').value = normalizedSplitType;
                toggleSplitInputs(); // Update UI
                // Uncheck all first
                document.querySelectorAll('.split-member-check').forEach(cb => {
                    if (cb) cb.checked = false;
                });
                // Check involved members and populate inputs
                if (Object.keys(splits).length > 0) {
                    Object.keys(splits).forEach(uid => {
                        const cb = document.getElementById(`split-check-${uid}`);
                        if (cb) {
                            cb.checked = true;
                            const amount = parseFloat(splits[uid]) || 0;
                            if (normalizedSplitType === 'exact') {
                                const input = document.getElementById(`split-amount-${uid}`);
                                if (input) input.value = amount;
                            } else if (normalizedSplitType === 'percent') {
                                // Calculate percentage from amount
                                const totalAmount = parseFloat(expense.amount) || 1;
                                const percent = (amount / totalAmount) * 100;
                                const input = document.getElementById(`split-percent-${uid}`);
                                if (input) input.value = percent;
                            } else if (normalizedSplitType === 'shares') {
                                // For shares, we need to calculate from the ratio
                                // Since we don't store original shares, we'll use amounts as shares
                                // This is a limitation - ideally we'd store original share values
                                const input = document.getElementById(`split-shares-${uid}`);
                                if (input) input.value = amount; // Use amount as proxy for shares
                            }
                        }
                    });
                } else {
                    // Legacy or default: all members
                    document.querySelectorAll('.split-member-check').forEach(cb => {
                        if (cb) cb.checked = true;
                    });
                }
                updateSplitInputs();
                // Show existing attachments
                if (expense.attachments && expense.attachments.length > 0) {
                    const container = document.getElementById('groupExpenseExistingAttachments');
                    container.innerHTML = expense.attachments.map((url, idx) => `
        <div class="attachment" style="position: relative; display: inline-block;">
            <img src="${url}" alt="Att" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;">
            <span onclick="removeGroupEditAttachment('${expenseId}', ${idx})" style="position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; width: 15px; height: 15px; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer;">&times;</span>
        </div>
     `).join('');
                }
            } catch (e) {
                showToast('Error', e.message, 'error');
            } finally {
                hideLoading();
            }
        }

        /**
         * Removes an existing attachment from the editing expense object during edit.
         * @param {string} expenseId - The ID of the expense.
         * @param {number} index - The index of the attachment to remove.
         */
        async function removeGroupEditAttachment(expenseId, index) {
            // Helper to remove attachment from the window object (not saved yet)
            if (window.editingExpense && window.editingExpense.attachments) {
                window.editingExpense.attachments.splice(index, 1);
                // Re-render
                const container = document.getElementById('groupExpenseExistingAttachments');
                container.innerHTML = window.editingExpense.attachments.map((url, idx) => `
                <div class="attachment" style="position: relative; display: inline-block;">
                    <img src="${url}" alt="Att" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;">
                    <span onclick="removeGroupEditAttachment('${expenseId}', ${idx})" style="position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; width: 15px; height: 15px; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer;">&times;</span>
                </div>
             `).join('');
            }
        }

        /**
         * Displays detailed information about a specific expense in a modal.
         * @param {string} expenseId - The ID of the expense.
         * @param {string} groupId - The ID of the group.
         */
        async function viewExpenseDetails(expenseId, groupId) {
            try {
                const expenseDoc = await db.collection('group_expenses').doc(expenseId).get();
                if (!expenseDoc.exists) {
                    showToast('Error', 'Expense not found', 'error');
                    return;
                }
                const expense = { id: expenseDoc.id, ...expenseDoc.data() };
                const groupDoc = await db.collection('groups').doc(groupId).get();
                const group = groupDoc.data();
                // Get member details
                const allMemberIds = [...(group.members || []), ...(group.guestMembers || [])];
                const memberPromises = allMemberIds.map(uid =>
                    db.collection('users').doc(uid).get().then(doc => ({ id: uid, ...doc.data() }))
                );
                const members = await Promise.all(memberPromises);
                const memberMap = {};
                members.forEach(m => memberMap[m.id] = m);
                // Add guest members to memberMap
                if (group.guestMembers) {
                    group.guestMembers.forEach(name => {
                        const guestId = `guest:${name}`;
                        if (!memberMap[guestId]) {
                            memberMap[guestId] = {
                                id: guestId,
                                firstName: name,
                                lastName: '(Guest)',
                                isGuest: true
                            };
                        }
                    });
                }
                const payer = memberMap[expense.paidBy || expense.userId] || {
                    firstName: (expense.paidBy || expense.userId)?.startsWith('guest:') ?
                        (expense.paidBy || expense.userId).split(':')[1] : 'Unknown',
                    lastName: (expense.paidBy || expense.userId)?.startsWith('guest:') ? '(Guest)' : ''
                };
                const splitMembers = expense.splitDetails ? Object.keys(expense.splitDetails).map(uid => ({
                    member: memberMap[uid] || {
                        firstName: uid.startsWith('guest:') ? uid.split(':')[1] : 'Unknown',
                        lastName: uid.startsWith('guest:') ? '(Guest)' : ''
                    },
                    amount: expense.splitDetails[uid]
                })) : [];
                // Get settlement sub-entries for this expense
                const settlementSubEntries = (expense.settlements && Array.isArray(expense.settlements)) ? expense.settlements : [];
                // Get all group expenses to calculate settlements
                const allExpensesSnapshot = await db.collection('group_expenses')
                    .where('groupId', '==', groupId)
                    .get();
                const allExpenses = allExpensesSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                const breakdowns = calculateExpenseBreakdown(allExpenses, allMemberIds, memberMap);
                const expenseBreakdown = breakdowns[expenseId];
                // Calculate individual member balances for this expense
                const memberBalances = allMemberIds.map(memberId => {
                    const member = memberMap[memberId] || {
                        firstName: memberId.startsWith('guest:') ? memberId.split(':')[1] : 'Unknown',
                        lastName: memberId.startsWith('guest:') ? '(Guest)' : ''
                    };
                    const contribution = expenseBreakdown?.contributions[memberId] || 0;
                    const balance = expenseBreakdown?.remainingBalances[memberId] || 0;
                    const isPayer = memberId === (expense.paidBy || expense.userId);
                    return {
                        member,
                        memberId,
                        contribution,
                        balance,
                        isPayer,
                        status: balance === 0 ? 'settled' : (balance > 0 ? 'owes' : 'owed')
                    };
                });
                const modal = document.createElement('div');
                modal.className = 'modal-overlay show';
                modal.innerHTML = `
                <div class="modal" style="width: 500px;">
                    <div class="modal-header">
                        <h3 class="modal-title">${t('expenseDetails')}</h3>
                        <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label class="form-label" style="font-weight: 600;">${t('description')}</label>
                            <p>${expense.description || '-'}</p>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" style="font-weight: 600;">${t('date')}</label>
                                <p>${expense.date.toDate().toLocaleDateString()}</p>
                            </div>
                            <div class="form-group">
                                <label class="form-label" style="font-weight: 600;">${t('amount')}</label>
                                <p style="color: var(--danger); font-weight: 600;">${formatCurrency(expense.amount)}</p>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" style="font-weight: 600;">${t('paidBy')}</label>
                                <p>${payer.firstName} ${payer.lastName || ''}</p>
                            </div>
                            <div class="form-group">
                                <label class="form-label" style="font-weight: 600;">${t('category')}</label>
                                <p>${expense.category || '-'}</p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" style="font-weight: 600;">${t('split')}</label>
                            <div style="margin-top: 0.5rem;">
                                ${expense.allPaidIndividually ?
                        `<p><strong>${t('allHavePaidIndividually')}</strong></p>` :
                        splitMembers.map(sm => `
                                        <div style="display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--border);">
                                            <span>${sm.member.firstName} ${sm.member.lastName || ''}</span>
                                            <span style="font-weight: 600;">${formatCurrency(sm.amount)}</span>
                                        </div>
                                    `).join('')
                    }
                            </div>
                        </div>
                        ${!expense.allPaidIndividually && expense.category !== 'Settlement' && expense.description !== 'Settlement Payment' ? `
                        <div class="form-group">
                            <label class="form-label" style="font-weight: 600;">Individual Balances</label>
                            <div style="margin-top: 0.5rem; max-height: 200px; overflow-y: auto;">
                                ${memberBalances.map(mb => `
                                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.5rem; margin-bottom: 0.25rem; border-radius: 4px; background: var(--bg-light);">
                                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                                            <span style="font-weight: 500;">${mb.member.firstName} ${mb.member.lastName || ''}</span>
                                            ${mb.isPayer ? '<span class="badge badge-primary" style="font-size: 0.7rem;">Payer</span>' : ''}
                                        </div>
                                        <div style="text-align: right;">
                                            <div style="font-weight: 600; ${mb.balance > 0 ? 'color: var(--success);' : mb.balance < 0 ? 'color: var(--danger);' : 'color: var(--text-gray);'}">
                                                ${mb.balance > 0 ? '+' : ''}${formatCurrency(mb.balance)}
                                            </div>
                                            <div style="font-size: 0.8rem; color: var(--text-gray);">
                                                ${mb.status === 'settled' ? '✓ ' + t('settled') : mb.status === 'owes' ? t('owes') : t('owed')}
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            ${expenseBreakdown?.isSettled ? `
                                <div style="margin-top: 0.5rem; padding: 0.5rem; background: var(--success-light); border-radius: 4px; text-align: center;">
                                    <span style="color: var(--success); font-weight: 600;">✓ All settlements completed</span>
                                </div>
                            ` : ''}
                        </div>
                        ` : ''}
                        ${expense.category === 'Settlement' || expense.description === 'Settlement Payment' ? `
                        <div class="form-group">
                            <label class="form-label" style="font-weight: 600;">Settlement Details</label>
                            <div style="margin-top: 0.5rem; padding: 0.75rem; background: var(--info-light); border-radius: 4px;">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span><strong>${payer.firstName}</strong> paid <strong>${formatCurrency(expense.amount)}</strong></span>
                                    <span style="color: var(--info); font-weight: 600;">✓ Recorded</span>
                                </div>
                            </div>
                        </div>
                        ` : `
                        <div class="form-group">
                            <label class="form-label" style="font-weight: 600;">Settlement History</label>
                            <div style="margin-top: 0.5rem;">
                                ${settlementSubEntries.length === 0 ? `
                                    <div style="padding: 0.75rem; background: var(--bg-light); border-radius: 4px; text-align: center; color: var(--text-gray);">
                                        No settlements recorded for this expense
                                    </div>
                                ` : `
                                    <div style="max-height: 200px; overflow-y: auto;">
                                        ${settlementSubEntries.map(settlement => {
                        const settlementPayer = memberMap[settlement.fromUser] || {
                            firstName: settlement.fromUser?.startsWith('guest:') ? settlement.fromUser.split(':')[1] : 'Unknown',
                            lastName: settlement.fromUser?.startsWith('guest:') ? '(Guest)' : ''
                        };
                        const settlementReceiver = memberMap[settlement.toUser] || {
                            firstName: settlement.toUser?.startsWith('guest:') ? settlement.toUser.split(':')[1] : 'Unknown',
                            lastName: settlement.toUser?.startsWith('guest:') ? '(Guest)' : ''
                        };
                        return `
                                                <div style="display: flex; justify-content: space-between; align-items: center; padding: 0.5rem; margin-bottom: 0.25rem; background: var(--success-light); border-radius: 4px; border-left: 3px solid var(--success);">
                                                    <div>
                                                        <div style="font-weight: 600; color: var(--success);">${settlementPayer.firstName} ${settlementPayer.lastName} → ${settlementReceiver.firstName} ${settlementReceiver.lastName}</div>
                                                        <div style="font-size: 0.8rem; color: var(--text-gray);">${settlement.date.toDate().toLocaleDateString()}</div>
                                                    </div>
                                                    <div style="text-align: right;">
                                                        <div style="font-weight: 600;">${formatCurrency(settlement.amount)}</div>
                                                        <div style="display: flex; gap: 0.25rem;">
                                                            <button class="btn btn-sm btn-outline-primary" style="font-size: 0.7rem; padding: 0.2rem 0.4rem;" onclick="editSettlement('${expenseId}', '${settlement.id}', '${groupId}')">
                                                                <i class="fas fa-edit"></i>
                                                            </button>
                                                            <button class="btn btn-sm btn-outline-danger" style="font-size: 0.7rem; padding: 0.2rem 0.4rem;" onclick="deleteSettlement('${expenseId}', '${settlement.id}', '${groupId}')">
                                                                <i class="fas fa-trash"></i>
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            `;
                    }).join('')}
                                    </div>
                                `}
                            </div>
                        </div>
                        `}
                        ${expense.remarks ? `
                            <div class="form-group">
                                <label class="form-label" style="font-weight: 600;">${t('remarks')}</label>
                                <p>${expense.remarks}</p>
                            </div>
                        ` : ''}
                        ${expense.attachments && expense.attachments.length > 0 ? `
                            <div class="form-group">
                                <label class="form-label" style="font-weight: 600;">${t('attachments')}</label>
                                <div class="attachment-grid" style="margin-top: 0.5rem;">
                                    ${expense.attachments.map(url => `
                                        <div class="attachment" onclick="viewAttachment('${url}')">
                                            <img src="${url}" alt="Attachment">
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">
                            ${t('close')}
                        </button>
                    </div>
                </div>
            `;
                document.body.appendChild(modal);
            } catch (error) {
                showToast('Error', error.message, 'error');
            }
        }

        /**
         * Prompts confirmation and deletes a group expense if confirmed.
         * @param {string} expenseId - The ID of the expense to delete.
         * @param {string} groupId - The ID of the group.
         */
        async function deleteGroupExpense(expenseId, groupId) {
            showConfirmation('Delete Expense', 'Are you sure?', async () => {
                try {
                    await db.collection('group_expenses').doc(expenseId).delete();
                    // Close all and reload
                    document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
                    await viewGroupDetails(groupId);
                    showToast('Success', 'Expense deleted');
                } catch (e) {
                    showToast('Error', e.message, 'error');
                }
            });
        }

        /**
         * Exports group data to a PDF file.
         * @param {string} groupId - The ID of the group to export.
         */
        async function exportGroupPDF(groupId) {
            showLoading();
            try {
                // Get current language from settings
                const currentLang = localStorage.getItem('language') || currentLanguage || 'en';
                const t = (key) => translations[currentLang]?.[key] || translations['en'][key] || key;
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const groupDoc = await db.collection('groups').doc(groupId).get();
                const group = groupDoc.data();
                const membersByType = await Promise.all(
                    group.members.map(uid => db.collection('users').doc(uid).get())
                );
                const memberMap = membersByType.reduce((acc, d) => {
                    acc[d.id] = { id: d.id, ...d.data() };
                    return acc;
                }, {});
                // Include guest members in memberMap (so PDFs show guests too)
                const guests = (group.guestMembers || []).map(name => ({
                    id: `guest:${name}`,
                    firstName: name,
                    lastName: `(${t('guest')})`,
                    isGuest: true
                }));
                guests.forEach(g => { memberMap[g.id] = g; });
                const allMemberIds = [...(group.members || []), ...guests.map(g => g.id)];
                const yearFilter = document.getElementById('groupYearFilter')?.value || 'all';
                const monthFilter = document.getElementById('groupMonthFilter')?.value || 'all';
                const expensesSnapshot = await db.collection('group_expenses')
                    .where('groupId', '==', groupId)
                    .get();
                let expenses = expensesSnapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                expenses = filterByYearMonth(expenses, yearFilter, monthFilter);
                expenses.sort((a, b) => safeDateMillis(b.date) - safeDateMillis(a.date));
                // Use all members (registered + guests) for debt calculations
                const debts = calculateGroupDebts(expenses, allMemberIds);
                // Compute expense breakdowns for summary + per-expense shares
                const breakdowns = calculateExpenseBreakdown(expenses, allMemberIds, memberMap);
                const totalExpensesAmount = expenses.reduce((sum, e) => {
                    if (e.category === 'Settlement' || e.isSettlement) return sum;
                    return sum + (parseFloat(e.amount) || 0);
                }, 0);
                const totalYourShare = expenses.reduce((sum, e) => sum + (breakdowns[e.id]?.contributions?.[currentUser.uid] || 0), 0);
                const totalReceivable = expenses.reduce((sum, e) => {
                    const payerId = e.paidBy || e.userId;
                    if (payerId === currentUser.uid) {
                        const myShare = breakdowns[e.id]?.contributions?.[currentUser.uid] || 0;
                        const settlements = e.settlements || [];
                        const totalReceived = settlements.reduce((s, settlement) => {
                            return s + (settlement.toUser === currentUser.uid ? parseFloat(settlement.amount) : 0);
                        }, 0);
                        return sum + ((parseFloat(e.amount) || 0) - myShare - totalReceived);
                    }
                    return sum;
                }, 0);
                // Header (Blue)
                doc.setFillColor(41, 128, 185);
                doc.rect(0, 0, 210, 40, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(22);
                doc.text(group.name, 14, 20);
                doc.setFontSize(12);
                doc.text(`${t('groupReport')} | ${new Date().toLocaleDateString()}`, 14, 30);
                doc.text(`${t('groupCode')}: ${group.code}`, 150, 20);
                let finalY = 50;
                // 0. Group Members (registered + guests)
                doc.setTextColor(0, 0, 0);
                doc.setFontSize(16);
                doc.text(t('members'), 14, finalY);
                finalY += 8;
                const memberRows = allMemberIds.map(id => {
                    const m = memberMap[id] || { firstName: t('unknown'), lastName: '' };
                    return [
                        id.startsWith('guest:') ? t('guest') : t('member'),
                        `${m.firstName || ''} ${m.lastName || ''}`.trim()
                    ];
                });
                doc.autoTable({
                    startY: finalY,
                    head: [[t('type'), t('name')]],
                    body: memberRows,
                    theme: 'grid',
                    headStyles: { fillColor: [52, 152, 219], lineWidth: 0.1, lineColor: [200, 200, 200] },
                    styles: { lineWidth: 0.1, lineColor: [200, 200, 200] },
                    margin: { left: 14, right: 14 }
                });
                finalY = doc.lastAutoTable.finalY + 12;
                // Summary (Expense Summary)
                doc.setFontSize(16);
                doc.text(t('expenseSummary'), 14, finalY);
                finalY += 8;
                doc.setFontSize(11);
                doc.text(`${t('totalExpenses')}: ${formatCurrency(totalExpensesAmount, true)}`, 14, finalY); finalY += 6;
                doc.text(`${t('receivable')}: ${formatCurrency(totalReceivable, true)}`, 14, finalY); finalY += 6;
                doc.text(`${t('yourShare')}: ${formatCurrency(totalYourShare, true)}`, 14, finalY); finalY += 6;
                doc.text(`${t('totalExpensesCount')}: ${expenses.length}`, 14, finalY); finalY += 12;
                // 1. Debt Breakdown
                doc.setTextColor(0, 0, 0);
                doc.setFontSize(16);
                doc.text(t('settlementPlan'), 14, finalY);
                finalY += 10;
                const debtRows = debts.map(d => [
                    `${memberMap[d.from]?.firstName} ${memberMap[d.from]?.lastName || ''}`,
                    t('owes'),
                    `${memberMap[d.to]?.firstName} ${memberMap[d.to]?.lastName || ''}`,
                    formatCurrency(d.amount, true)
                ]);
                if (debtRows.length === 0) {
                    doc.setFontSize(12);
                    doc.text(t('allSettled'), 14, finalY);
                    finalY += 10;
                } else {
                    doc.autoTable({
                        startY: finalY,
                        head: [[t('debtor'), t('status'), t('creditor'), t('amount')]],
                        body: debtRows,
                        theme: 'striped',
                        headStyles: { fillColor: [52, 152, 219] },
                        margin: { top: 10 }
                    });
                    finalY = doc.lastAutoTable.finalY + 15;
                }
                // 2. Expenses Grouped
                const grouped = {};
                expenses.forEach(ex => {
                    const date = safeDate(ex.date);
                    const key = `${getMonthName(date.getMonth())} ${date.getFullYear()}`;
                    if (!grouped[key]) grouped[key] = [];
                    grouped[key].push(ex);
                });
                for (const [monthYear, monthExpenses] of Object.entries(grouped)) {
                    if (finalY > 250) {
                        doc.addPage();
                        finalY = 20;
                    }
                    doc.setFontSize(14);
                    doc.setTextColor(41, 128, 185);
                    doc.text(monthYear, 14, finalY);
                    finalY += 7; // Increased spacing
                    let monthTotal = 0;
                    const rows = monthExpenses.map(ex => {
                        const amt = parseFloat(ex.amount) || 0;
                        monthTotal += amt;
                        const myShare = breakdowns[ex.id]?.contributions?.[currentUser.uid] || 0;
                        return [
                            safeDate(ex.date).toLocaleDateString(),
                            ex.description,
                            memberMap[ex.paidBy || ex.userId]?.firstName || t('unknown'),
                            t(ex.splitType?.toLowerCase() || 'equal'),
                            formatCurrency(amt, true),
                            formatCurrency(myShare, true)
                        ];
                    });
                    // Add Total Row
                    rows.push([
                        { content: t('monthTotal'), colSpan: 4, styles: { fontStyle: 'bold', halign: 'right' } },
                        { content: formatCurrency(monthTotal, true), styles: { fontStyle: 'bold', textColor: [41, 128, 185] } },
                        { content: '', styles: {} }
                    ]);
                    doc.autoTable({
                        startY: finalY,
                        head: [[t('date'), t('description'), t('paidBy'), t('split'), t('amount'), t('yourShare')]],
                        body: rows,
                        theme: 'grid',
                        headStyles: { fillColor: [100, 100, 100] },
                        styles: { lineWidth: 0.1, lineColor: [200, 200, 200] },
                        columnStyles: {
                            4: { fontStyle: 'bold', halign: 'right' },
                            5: { fontStyle: 'bold', halign: 'right' }
                        }
                    });
                    finalY = doc.lastAutoTable.finalY + 15;
                }
                doc.save(`${group.name.replace(/[^a-z0-9]/gi, '_')}_Report.pdf`);
                showToast(t('success'), t('pdfExportSuccess'));
            } catch (error) {
                console.error(error);
                showToast(t('error'), `${t('failedToExportPdf')}: ${error.message}`, 'error');
            } finally {

        // Export Group Excel
        async function exportGroupExcel(groupId) {
            showLoading();
            try {
                const currentLang = localStorage.getItem('language') || currentLanguage || 'en';
                const t = (key) => translations[currentLang]?.[key] || translations['en'][key] || key;

                const groupDoc = await db.collection('groups').doc(groupId).get();
                const group = groupDoc.data();

                const membersByType = await Promise.all(
                    group.members.map(uid => db.collection('users').doc(uid).get())
                );
                const memberMap = membersByType.reduce((acc, d) => {
                    acc[d.id] = { id: d.id, ...d.data() };
                    return acc;
                }, {});

                // Include guest members
                const guests = (group.guestMembers || []).map(name => ({
                    id: `guest:${name}`,
                    firstName: name,
                    lastName: `(${t('guest')})`,
                    isGuest: true
                }));
                guests.forEach(g => { memberMap[g.id] = g; });
                const allMemberIds = [...(group.members || []), ...guests.map(g => g.id)];

                const yearFilter = document.getElementById('groupYearFilter')?.value || 'all';
                const monthFilter = document.getElementById('groupMonthFilter')?.value || 'all';

                const expensesSnapshot = await db.collection('group_expenses')
                    .where('groupId', '==', groupId)
                    .get();

                let expenses = expensesSnapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                expenses = filterByYearMonth(expenses, yearFilter, monthFilter);
                expenses.sort((a, b) => safeDateMillis(b.date) - safeDateMillis(a.date));

                const breakdowns = calculateExpenseBreakdown(expenses, allMemberIds, memberMap);

                const excelData = expenses.map(ex => {
                    const amt = parseFloat(ex.amount) || 0;
                    const myShare = breakdowns[ex.id]?.contributions?.[currentUser.uid] || 0;
                    const payer = memberMap[ex.paidBy || ex.userId] || { firstName: t('unknown') };

                    return {
                        [t('date')]: safeDate(ex.date).toLocaleDateString(),
                        [t('description')]: ex.description,
                        [t('category')]: ex.category || '',
                        [t('paidBy')]: `${payer.firstName} ${payer.lastName || ''}`,
                        [t('split')]: t(ex.splitType?.toLowerCase() || 'equal'),
                        [t('amount')]: amt,
                        [t('yourShare')]: myShare,
                        [t('remarks')]: ex.remarks || ''
                    };
                });

                exportToExcel(excelData, `${group.name.replace(/[^a-z0-9]/gi, '_')}_Report`, 'Expenses');
                showToast(t('success'), 'Excel exported successfully!');
            } catch (error) {
                showToast(t('error'), 'Failed to export Excel: ' + error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        /**
         * Updates the display of split amounts based on user input and split type.
         */
        function updateSplitInputs() {
            const amount = parseFloat(document.getElementById('groupExpenseAmount').value) || 0;
            const checkedBoxes = Array.from(document.querySelectorAll('.split-member-check:checked'));
            const splitType = document.getElementById('groupExpenseSplitType').value;
            const warningTotal = document.getElementById('split-total-warning');
            const warningPercent = document.getElementById('split-percent-warning');
            // Hide warnings initially
            if (warningTotal) warningTotal.style.display = 'none';
            if (warningPercent) warningPercent.style.display = 'none';
            if (splitType === 'equal') {
                // Show calculated amounts for each member
                if (checkedBoxes.length > 0 && amount > 0) {
                    const share = amount / checkedBoxes.length;
                    checkedBoxes.forEach(cb => {
                        const displaySpan = document.querySelector(`.split-display[data-member-id="${cb.value}"]`);
                        if (displaySpan) {
                            displaySpan.textContent = formatCurrency(share);
                        }
                    });
                }
            } else if (splitType === 'exact') {
                // Validate exact amounts sum to total
                let totalCustom = 0;
                checkedBoxes.forEach(cb => {
                    const input = document.getElementById(`split-amount-${cb.value}`);
                    const val = parseFloat(input.value) || 0;
                    totalCustom += val;
                    // Show individual amount
                    const displaySpan = document.querySelector(`.split-display[data-member-id="${cb.value}"]`);
                    if (displaySpan) {
                        displaySpan.textContent = formatCurrency(val);
                    }
                });
                const diff = Math.abs(amount - totalCustom);
                if (warningTotal) {
                    warningTotal.style.display = diff > 0.01 ? 'block' : 'none';
                    warningTotal.textContent = `Total split (${formatCurrency(totalCustom)}) must match expense amount (${formatCurrency(amount)})`;
                }
            } else if (splitType === 'percent') {
                // Validate percentages sum to 100 and show calculated amounts
                let totalPercent = 0;
                checkedBoxes.forEach(cb => {
                    const input = document.getElementById(`split-percent-${cb.value}`);
                    const percent = parseFloat(input.value) || 0;
                    totalPercent += percent;
                    // Calculate and show amount
                    const calculatedAmount = amount * (percent / 100);
                    const displaySpan = document.querySelector(`.split-display[data-member-id="${cb.value}"]`);
                    if (displaySpan) {
                        displaySpan.textContent = `${percent.toFixed(2)}% = ${formatCurrency(calculatedAmount)}`;
                    }
                });
                if (warningPercent) {
                    const diff = Math.abs(100 - totalPercent);
                    warningPercent.style.display = diff > 0.01 ? 'block' : 'none';
                    warningPercent.textContent = `Total percentage (${totalPercent.toFixed(2)}%) must equal 100%`;
                }
            } else if (splitType === 'shares') {
                // Calculate shares and show amounts
                let totalShares = 0;
                checkedBoxes.forEach(cb => {
                    const input = document.getElementById(`split-shares-${cb.value}`);
                    const shares = parseFloat(input.value) || 0;
                    totalShares += shares;
                });
                if (totalShares > 0 && amount > 0) {
                    checkedBoxes.forEach(cb => {
                        const input = document.getElementById(`split-shares-${cb.value}`);
                        const shares = parseFloat(input.value) || 0;
                        const calculatedAmount = amount * (shares / totalShares);
                        const displaySpan = document.querySelector(`.split-display[data-member-id="${cb.value}"]`);
                        if (displaySpan) {
                            displaySpan.textContent = `${shares} share(s) = ${formatCurrency(calculatedAmount)}`;
                        }
                    });
                } else {
                    checkedBoxes.forEach(cb => {
                        const displaySpan = document.querySelector(`.split-display[data-member-id="${cb.value}"]`);
                        if (displaySpan) {
                            displaySpan.textContent = '';
                        }
                    });
                }
            }
        }

        async function loadCalendar() {
            showLoading();
            try {
                const yearFilter = document.getElementById('calendarYear')?.value || 'all';
                const monthFilter = document.getElementById('calendarMonth')?.value || 'all';

                // Load all data
                // Load all data
                // 1. Load user's groups to get Group IDs
                const groupsSnapshot = await db.collection('groups').where('members', 'array-contains', currentUser.uid).get();
                const groupIds = groupsSnapshot.docs.map(doc => doc.id);

                // 2. Load data
                const promises = [
                    db.collection('credits').where('userId', '==', currentUser.uid).get(),
                    db.collection('personal_expenses').where('userId', '==', currentUser.uid).get()
                ];

                // Only fetch group expenses if user is in groups
                if (groupIds.length > 0) {
                    // Limit to 10 groups for 'in' query limitation
                    promises.push(
                        db.collection('group_expenses')
                            .where('groupId', 'in', groupIds.slice(0, 10))
                            .get()
                    );
                } else {
                    promises.push(Promise.resolve({ docs: [] }));
                }

                const [creditsSnapshot, personalSnapshot, groupsExpSnapshot] = await Promise.all(promises);

                let credits = creditsSnapshot.docs.map(doc => ({ id: doc.id, type: 'credit', ...doc.data() }));
                let personal = personalSnapshot.docs.map(doc => ({ id: doc.id, type: 'personal', ...doc.data() }));

                // Process Group Expenses with Share Calculation
                let groupsData = [];
                if (groupsExpSnapshot && !groupsExpSnapshot.empty) {
                    // Create Map of Group Metadata
                    const groupsMap = {};
                    groupsSnapshot.docs.forEach(doc => groupsMap[doc.id] = doc.data());

                    for (const doc of groupsExpSnapshot.docs) {
                        const expense = { id: doc.id, ...doc.data() };
                        const group = groupsMap[expense.groupId];

                        if (group) {
                            // Calculate Share
                            const allMembers = [...(group.members || []), ...(group.guestMembers || []).map(name => `guest:${name}`)];
                            const memberMap = allMembers.reduce((acc, m) => {
                                acc[m] = m.startsWith('guest:') ? { firstName: m.split(':')[1], isGuest: true } : { firstName: m };
                                return acc;
                            }, {});

                            const breakdowns = calculateExpenseBreakdown([expense], allMembers, memberMap);
                            const breakdown = breakdowns[expense.id];
                            let userShare = breakdown?.contributions?.[currentUser.uid] || 0;

                            // Fallback for missing splits/legacy data
                            if (userShare === 0 && (!expense.splits || Object.keys(expense.splits).length === 0) && group.members.includes(currentUser.uid)) {
                                userShare = parseFloat(expense.amount) / allMembers.length;
                            }

                            // DOUBLE CHECK: If userShare is still 0, check for Guest Alias!
                            if (userShare === 0) {
                                const guestKey = `guest:${currentUser.firstName} ${currentUser.lastName || ''}`.trim();
                                userShare = breakdown?.contributions?.[guestKey] || 0;
                            }

                            groupsData.push({
                                ...expense,
                                type: 'Group',
                                userShare: userShare
                            });
                        }
                    }
                }

                const allData = [...credits, ...personal, ...groupsData];
                // Add this loop right after to ensure all dates are valid:
                allData.forEach(item => {
                    if (item.date && !item.date.toDate) {
                        // Convert invalid dates to Firestore Timestamp
                        item.date = firebase.firestore.Timestamp.fromDate(safeDate(item.date));
                    }
                });
                const container = document.getElementById('calendarContainer');

                // Apply filters correctly - combine year and month
                let filteredData = allData;

                if (yearFilter !== 'all') {
                    const year = parseInt(yearFilter);
                    filteredData = filteredData.filter(item => {
                        const date = item.date.toDate();
                        return date.getFullYear() === year;
                    });
                }

                if (monthFilter !== 'all') {
                    const month = parseInt(monthFilter);
                    filteredData = filteredData.filter(item => {
                        const date = item.date.toDate();
                        return date.getMonth() === month;
                    });
                }

                // Group by year and month for display
                const groupedByYearMonth = {};
                filteredData.forEach(item => {
                    const date = item.date.toDate();
                    const year = date.getFullYear();
                    const month = date.getMonth();
                    const key = `${year}-${month}`;
                    if (!groupedByYearMonth[key]) {
                        groupedByYearMonth[key] = { year, month, data: [] };
                    }
                    groupedByYearMonth[key].data.push(item);
                });

                let html = '<div class="calendar-all-time">';
                Object.keys(groupedByYearMonth).sort().reverse().forEach(key => {
                    const { year, month, data } = groupedByYearMonth[key];
                    html += renderMonthCalendar(year, month, data);
                });
                html += '</div>';
                container.innerHTML = html;
            } catch (error) {
                showToast('Error', error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        function renderMonthCalendar(year, month, data) {
            const monthName = getMonthName(month);
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Group data by day
            const dayData = {};
            data.forEach(item => {
                const day = item.date.toDate().getDate();
                if (!dayData[day]) {
                    dayData[day] = { credits: 0, expenses: 0, groupShare: 0, count: 0, items: [] };
                }
                dayData[day].items.push(item);
                dayData[day].count++;

                if (item.type === 'credit') {
                    dayData[day].credits += parseFloat(item.amount);
                } else if (item.type === 'Group') {
                    // Use calculated userShare
                    dayData[day].groupShare += parseFloat(item.userShare || 0);
                } else {
                    // Personal Expenses
                    dayData[day].expenses += parseFloat(item.amount);
                }
            });

            let html = `
                <div class="calendar-month">
                    <h3 class="calendar-month-title">${monthName} ${year}</h3>
                    <div class="calendar-grid">
                        <div class="calendar-header">${t('sunday')}</div>
                        <div class="calendar-header">${t('monday')}</div>
                        <div class="calendar-header">${t('tuesday')}</div>
                        <div class="calendar-header">${t('wednesday')}</div>
                        <div class="calendar-header">${t('thursday')}</div>
                        <div class="calendar-header">${t('friday')}</div>
                        <div class="calendar-header">${t('saturday')}</div>
            `;

            // Empty cells before first day
            for (let i = 0; i < firstDay; i++) {
                html += '<div class="calendar-day empty"></div>';
            }

            // Days of month
            for (let day = 1; day <= daysInMonth; day++) {
                const dayInfo = dayData[day];
                // Calculate Total: Credits - Personal - GroupShare
                const total = dayInfo ? (dayInfo.credits - dayInfo.expenses - dayInfo.groupShare) : 0;
                const hasData = dayInfo && dayInfo.count > 0;

                html += `
                    <div class="calendar-day ${hasData ? 'has-data' : ''}" ${hasData ? `onclick="openDayDetails(${year}, ${month}, ${day})"` : ''}>
                        <div class="calendar-day-number">${day}</div>
                        ${hasData ? `
                            <div class="calendar-day-info">
                                <div class="calendar-day-amount" style="color: ${total >= 0 ? 'var(--success)' : 'var(--danger)'}">
                                    ${formatCurrency(Math.abs(total))}
                                </div>
                                <div class="calendar-day-count">
                                    <i class="fas fa-receipt"></i> ${dayInfo.count}
                                </div>
                                <i class="fas fa-info-circle calendar-day-icon"></i>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            html += `
                    </div>
                </div>
            `;

            return html;
        }

                        return {

        async function loadDetails() {
            showLoading();
            try {
                const searchTerm = document.getElementById('detailsSearch')?.value || '';
                const yearFilter = document.getElementById('detailsYear')?.value || 'all';
                const monthFilter = document.getElementById('detailsMonth')?.value || 'all';
                const typeFilter = document.getElementById('detailsType')?.value || 'all';

                // Load core user data: credits, personal expenses, and the list of groups the user is in
                const [creditsSnapshot, personalSnapshot, groupsListSnapshot] = await Promise.all([
                    db.collection('credits').where('userId', '==', currentUser.uid).get(),
                    db.collection('personal_expenses').where('userId', '==', currentUser.uid).get(),
                    db.collection('groups').where('members', 'array-contains', currentUser.uid).get()
                ]);

                // Extract group IDs for the groups the current user is a member of
                const groupIds = groupsListSnapshot.docs.map(doc => doc.id);

                // Fetch all group expenses for the groups the user is in (this fixes the issue where only expenses added by the current user were fetched)
                // We query per groupId to avoid Firestore 'in' query limits (which cap at 10 items)
                let groupExpenses = [];
                if (groupIds.length > 0) {
                    const expenseQueries = groupIds.map(id => db.collection('group_expenses').where('groupId', '==', id).get());
                    const expenseSnapshots = await Promise.all(expenseQueries);
                    groupExpenses = expenseSnapshots.flatMap(snap => snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                }


                // Create a map of group IDs to group names for quick lookup
                const groupsMap = {};
                groupsListSnapshot.docs.forEach(doc => {
                    groupsMap[doc.id] = doc.data().name;
                });

                // Create a detailed map of group data (including members) for calculations
                const groupsDataMap = {};
                groupsListSnapshot.docs.forEach(doc => {
                    groupsDataMap[doc.id] = { id: doc.id, ...doc.data() };
                });


                let allData = [];

                // Process credits if filter allows
                if (typeFilter === 'all' || typeFilter === 'credit') {
                    const credits = creditsSnapshot.docs.map(doc => ({
                        id: doc.id,
                        section: 'Credit',
                        sectionType: 'credit',
                        canEdit: true,
                        ...doc.data()
                    }));
                    allData = allData.concat(credits);
                }

                // Process personal expenses if filter allows
                if (typeFilter === 'all' || typeFilter === 'personal') {
                    const personal = personalSnapshot.docs.map(doc => ({
                        id: doc.id,
                        section: 'Personal',
                        sectionType: 'personal',
                        canEdit: true,
                        ...doc.data()
                    }));
                    allData = allData.concat(personal);
                }

                // Process group expenses if filter allows
                if (typeFilter === 'all' || typeFilter === 'group') {

                    // Process each group expense to calculate the current user's share
                    const groupEntries = groupExpenses.map(expense => {
                        // Skip settlement entries as they are not regular expenses
                        if (expense.category === 'Settlement' || (expense.description && expense.description.includes('Settlement')) || expense.isSettlement) {
                            return null;
                        }
                        const groupId = expense.groupId;
                        const group = groupsDataMap[groupId];

                        // Skip if group data is missing (edge case)
                        if (!group) return null;

                        // Create a list of all members (including guests) for split calculations
                        const allMembers = [...(group.members || []), ...(group.guestMembers || []).map(name => `guest:${name}`)];
                        const memberMap = allMembers.reduce((acc, m) => {
                            acc[m] = m.startsWith('guest:') ? { firstName: m.split(':')[1], isGuest: true } : { firstName: m };
                            return acc;
                        }, {});

                        // Calculate the breakdown of the expense (assumes calculateExpenseBreakdown function exists elsewhere)
                        const breakdowns = calculateExpenseBreakdown([expense], allMembers, memberMap);
                        const breakdown = breakdowns[expense.id];
                        let userShare = breakdown?.contributions?.[currentUser.uid] || 0;

                        // Fallback for legacy equal splits if no specific splits are defined
                        if (userShare === 0 && (!expense.splits || Object.keys(expense.splits).length === 0) && group.members.includes(currentUser.uid)) {
                            userShare = parseFloat(expense.amount) / allMembers.length;
                        }

                        // Fallback for guest aliases if the user is matched as a guest
                        if (userShare === 0) {
                            const guestKey = `guest:${currentUser.firstName} ${currentUser.lastName || ''}`.trim();
                            userShare = breakdown?.contributions?.[guestKey] || 0;
                        }

                        // Only include the expense if the user's share is positive (meaning they owe something for this expense)
                        // This ensures the expense is relevant to the current user
                        if (userShare <= 0) return null;

                        // Return the entry formatted for display, with amount as the user's share
                        return {
                            id: expense.id,
                            section: 'Group',
                            sectionType: 'group',
                            canEdit: false, // Group expenses are edited in the Group View
                            description: expense.description,
                            amount: userShare,
                            date: expense.date, // Firestore Timestamp
                            mode: 'Group Split',
                            remarks: expense.remarks || '-',
                            attachments: expense.attachments || [],
                            groupId: groupId,
                            groupName: group.name
                        };
                    }).filter(e => e !== null);

                    allData = allData.concat(groupEntries);
                }

                // Apply search filter across relevant fields
                allData = filterBySearch(allData, searchTerm, ['description', 'mode', 'remarks', 'amount', 'section']);
                // Apply year/month filters
                allData = filterByYearMonth(allData, yearFilter, monthFilter);
                // Sort by date descending
                allData.sort((a, b) => safeDateMillis(b.date) - safeDateMillis(a.date));

                const container = document.getElementById('detailsTableContainer');
                if (allData.length === 0) {
                    container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon"><i class="fas fa-file-alt"></i></div>
                    <div class="empty-title">No transactions found</div>
                    <div class="empty-message">Try adjusting your filters</div>
                </div>
            `;
                } else {
                    // Group data by month for display
                    const grouped = groupByMonth(allData);

                    let html = '';
                    Object.keys(grouped).sort().reverse().forEach(month => {
                        const [year, monthNum] = month.split('-');
                        const monthName = getMonthName(parseInt(monthNum) - 1);

                        // Calculate net total for the month (credits positive, expenses negative)
                        const monthTotal = grouped[month].reduce((sum, item) => {
                            return item.sectionType === 'credit' ? sum + item.amount : sum - item.amount;
                        }, 0);

                        html += `
                    <div class="month-group">
                        <div class="month-header" style="display: flex; justify-content: space-between; align-items: center;">
                            <span>${monthName} ${year}</span>
                            <span style="font-size: 0.9rem; color: ${monthTotal >= 0 ? 'var(--success)' : 'var(--danger)'};">
                                Net: ${monthTotal >= 0 ? '+' : ''}${formatCurrency(monthTotal)}
                            </span>
                        </div>
                        <div class="table-wrapper">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>${t('date')}</th>
                                        <th>${t('section')}</th>
                                        <th>${t('description')}</th>
                                        <th>${t('mode')}</th>
                                        <th>${t('remarks')}</th>
                                        <th>${t('attachments')}</th>
                                        <th>${t('amount')}</th>
                                        <th>${t('actions')}</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${grouped[month].map(item => `
                                        <tr id="details-row-${item.sectionType}-${item.id}">
                                            <td>${safeDate(item.date).toLocaleDateString()}</td>
                                            <td><span class="badge badge-${item.sectionType === 'credit' ? 'success' : item.sectionType === 'personal' ? 'warning' : 'info'}">${item.section}</span></td>
                                            <td>${item.description}</td>
                                            <td><span class="badge badge-secondary">${item.mode}</span></td>
                                            <td>${item.remarks || '-'}</td>
                                            <td>
                                                ${item.attachments && item.attachments.length > 0 ? `
                                                    <div class="attachments">
                                                        ${item.attachments.map((url, idx) => `
                                                            <div class="attachment" onclick="viewAttachment('${url}')">
                                                                <img src="${url}" alt="Attachment ${idx + 1}">
                                                            </div>
                                                        `).join('')}
                                                    </div>
                                                ` : '-'}
                                            </td>
                                            <td style="color: ${item.sectionType === 'credit' ? 'var(--success)' : 'var(--danger)'}; font-weight: 600;">
                                                ${item.sectionType === 'credit' ? '+' : '-'}${formatCurrency(item.amount)}
                                            </td>
                                            <td>
                                                <div class="actions">
                                                    ${item.canEdit ? `
                                                        <button class="action-btn" onclick="editDetailsRow('${item.sectionType}', '${item.id}')">
                                                            <i class="fas fa-edit"></i>
                                                        </button>
                                                    ` : ''}
                                                    <button class="action-btn danger" onclick="deleteDetailsRow('${item.sectionType}', '${item.id}')">
                                                        <i class="fas fa-trash"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                    });

                    container.innerHTML = html;
                }
            } catch (error) {
                showToast('Error', error.message, 'error');
            } finally {
                hideLoading();
            }
        }

                    <td>

                            `).join('') : ''}
                        </div>
                        <div id="edit-details-new-attachments-preview-${id}" class="attachments" style="margin-top: 0.5rem;"></div>
                        <input type="file" class="form-input" id="edit-details-new-attachments-${id}" multiple accept="image" style="margin-top: 0.5rem;">

                    <td><input type="number" step="0.01" class="form-input" value="${item.amount}" id="edit-details-amount-${id}"></td>
                    <td>
                        <div class="actions">
                            <button class="action-btn success" onclick="saveEditDetailsRow('${sectionType}', '${id}')">

                                <i class="fas fa-times"></i>

                window.uploadedFiles = [];

                document.getElementById(`edit-details-new-attachments-${id}`).addEventListener('change', (e) => {
                    const preview = document.getElementById(`edit-details-new-attachments-preview-${id}`);
                    const files = Array.from(e.target.files);

                    for (const file of files) {
                        if (window.uploadedFiles.length + existingCount >= 5) {
                            showToast('Warning', 'Maximum 5 attachments allowed', 'error');
                            break;
                        }
                        if (file.size > 9 * 1024 * 1024) {
                            showToast('Warning', `File ${file.name} exceeds 9MB limit`, 'error');

                        }
                        window.uploadedFiles.push(file);
                    }

                    renderEditDetailsNewAttachments(id);
                    e.target.value = '';
                });

                window.renderEditDetailsNewAttachments = (id) => {
                    const preview = document.getElementById(`edit-details-new-attachments-preview-${id}`);
                    if (!preview) return;
                    preview.innerHTML = '';
                    window.uploadedFiles.forEach((file, idx) => {
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            const div = document.createElement('div');

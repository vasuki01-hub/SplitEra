        async function settleDebt(groupId, fromUid, toUid, amount) {
            showConfirmation(t('settleUp'), `${t('recordPaymentOf')} ${formatCurrency(amount)}?`, async () => {
                showLoading();
                try {
                    // Create a settlement expense
                    // A settlement is a payment from A to B.
                    // In terms of expenses, it can be modeled as:
                    // Payer: A (Paid By)
                    // Split: Only B is involved (100% split to B?)
                    // OR, if A pays B, it means A is "covering" B's share? No.
                    // Standard logic: A pays B directly.
                    // We record an expense where PaidBy = FromUid, and it is split EXCLUSIVELY to ToUid.
                    // BUT, "expense" logic usually means "PaidBy" CLAIMS back from Split users.
                    // If A pays for B, A is claiming from B.
                    // Here, A OWES B. So A is paying B back.
                    // So we need to reverse it?
                    // If existing debt is A -> B (A negative, B positive).
                    // New expense: PaidBy A. Split to: Everyone? No.
                    // This is a reimbursement.
                    // It is simplest to treat it as:
                    // PaidBy: A
                    // Amount: Amount
                    // Split: 100% assigned to B.
                    // Effect: A paid (Credit +A). B consumed (Debit -B).
                    // Net: A gets +A, B gets -B.
                    // If Debt was A: -100, B: +100.
                    // Adding this expense:
                    // A: -100 + 100 = 0.
                    // B: +100 - 100 = 0.
                    // Correct.

                    // However, we want to label it as "Settlement" or "Payment".

                    const expenseData = {
                        groupId: groupId,
                        description: 'Settlement Payment',
                        category: 'Settlement',
                        amount: parseFloat(amount),
                        date: firebase.firestore.Timestamp.now(),
                        paidBy: fromUid,
                        userId: currentUser.uid, // Who recorded it
                        splitType: 'Custom',
                        splitDetails: {
                            [toUid]: parseFloat(amount) // 100% to the creditor
                        },
                        mode: 'Cash', // Default or prompt
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    };

                    await db.collection('group_expenses').add(expenseData);

                    document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
                    await viewGroupDetails(groupId);
                    showToast('Success', 'Payment recorded!');

                } catch (e) {
                    showToast('Error', e.message, 'error');
                } finally {
                    hideLoading();
                }
            });
        }

        function calculateGroupDebts(expenses, memberIds) {
            const balances = {};
            memberIds.forEach(id => balances[id] = 0);

            expenses.forEach(expense => {
                const amount = parseFloat(expense.amount);
                const payer = expense.paidBy || expense.userId;

                balances[payer] = (balances[payer] || 0) + amount;

                if (!expense.splitDetails) {
                    const splitAmount = amount / memberIds.length;
                    memberIds.forEach(m => {
                        balances[m] -= splitAmount;
                    });
                } else {
                    // splitDetails is stored as an Object in Firestore: { uid: amount }
                    Object.entries(expense.splitDetails).forEach(([uid, splitAmt]) => {
                        balances[uid] = (balances[uid] || 0) - splitAmt;
                    });
                }
            });

            let debtors = [];
            let creditors = [];

            Object.entries(balances).forEach(([uid, amount]) => {
                const val = Math.round(amount * 100) / 100;
                if (val < -0.01) debtors.push({ uid, amount: val });
                else if (val > 0.01) creditors.push({ uid, amount: val });
            });

            debtors.sort((a, b) => a.amount - b.amount);
            creditors.sort((a, b) => b.amount - a.amount);

            const debts = [];
            let i = 0;
            let j = 0;

            while (i < debtors.length && j < creditors.length) {
                const debtor = debtors[i];
                const creditor = creditors[j];
                const amount = Math.min(-debtor.amount, creditor.amount);

                if (amount > 0) {
                    debts.push({ from: debtor.uid, to: creditor.uid, amount: amount });
                }

                debtor.amount += amount;
                creditor.amount -= amount;

                if (Math.abs(debtor.amount) < 0.01) i++;
                if (Math.abs(creditor.amount) < 0.01) j++;
            }

            return debts;
        }

        async function saveGroupExpense() {
            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

            try {
                const groupId = document.getElementById('groupExpenseGroupId').value;
                const editId = document.getElementById('editGroupExpenseId').value;
                const amount = parseFloat(document.getElementById('groupExpenseAmount').value);

                // Validate Custom Split
                const splitType = document.getElementById('groupExpenseSplitType').value;
                const checkedBoxes = Array.from(document.querySelectorAll('.split-member-check:checked'));
                const splitDetails = {}; // Map of uid -> amount

                if (checkedBoxes.length === 0) {
                    throw new Error('Please select at least one member to split with.');
                }

                if (splitType === 'Equal') {
                    const share = amount / checkedBoxes.length;
                    checkedBoxes.forEach(cb => {
                        splitDetails[cb.value] = share;
                    });
                } else {
                    let totalCustom = 0;
                    checkedBoxes.forEach(cb => {
                        const val = parseFloat(document.getElementById(`split-amount-${cb.value}`).value) || 0;
                        splitDetails[cb.value] = val;
                        totalCustom += val;
                    });

                    if (Math.abs(amount - totalCustom) > 0.1) {
                        throw new Error(`Total split amount ($${totalCustom.toFixed(2)}) must match expense amount ($${amount.toFixed(2)})`);
                    }
                }

                const expenseData = {
                    date: firebase.firestore.Timestamp.fromDate(new Date(document.getElementById('groupExpenseDate').value)),
                    description: document.getElementById('groupExpenseDescription').value,
                    category: document.getElementById('groupExpenseCategory').value,
                    mode: document.getElementById('groupExpenseMode').value,
                    amount: amount,
                    paidBy: document.getElementById('groupExpensePaidBy').value,
                    splitType: splitType,
                    splitDetails: splitDetails,
                    remarks: document.getElementById('groupExpenseRemarks').value,
                    groupId: groupId,
                    userId: currentUser.uid, // Creator/Editor
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                // Handle Attachments
                const files = document.getElementById('groupExpenseAttachments').files;
                let attachments = [];

                // If editing, preserve old attachments (handled manually via UI or simple append for now)
                // In a robust app, we'd have a list of existing URLs to keep.
                // For simplicity here: if editing, we might overwrite or add. 
                // Let's Fetch old data if editing to keep old attachments?
                // Better: The UI should have shown existing attachments with 'remove' option.
                // I'll assume we just ADD for now, or if I implement detailed edit, I'd read `window.editingExpense.attachments`.

                if (editId && window.editingExpense && window.editingExpense.attachments) {
                    attachments = [...window.editingExpense.attachments];
                }

                for (let file of files) {
                    const ref = storage.ref(`groups/${groupId}/${Date.now()}_${file.name}`);
                    await ref.put(file);
                    const url = await ref.getDownloadURL();
                    attachments.push(url);
                }
                expenseData.attachments = attachments;

                if (editId) {
                    await db.collection('group_expenses').doc(editId).update(expenseData);
                    showToast('Success', 'Expense updated!');
                } else {
                    expenseData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection('group_expenses').add(expenseData);
                    showToast('Success', 'Expense added!');
                }

                const modal = document.getElementById('groupExpenseModal');
                if (modal) modal.remove();

                // Refresh details
                // Close current details modal and reopen? Or just refresh data?
                // Simplest: Close all and reopen viewGroupDetails
                // Wait, viewGroupDetails creates a modal. 
                // If we close this modal (Add), the Details modal is BEHIND it? 
                // My implementation of `viewGroupDetails` creates a modal. 
                // `openAdd...` creates ANOTHER top modal.
                // So removing `groupExpenseModal` reveals `viewGroupDetails`.
                // BUT `viewGroupDetails` needs refresh.
                // I'll close Detail modal too and reopen it.

                // Hacky refresh:
                document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
                await viewGroupDetails(groupId);

            } catch (error) {
                showToast('Error', error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-save"></i> ${t('save')}`;
            }
        }

                const yearFilter = document.getElementById('groupYearFilter')?.value || 'all';
                const monthFilter = document.getElementById('groupMonthFilter')?.value || 'all';

                const expensesSnapshot = await db.collection('group_expenses')
                    .where('groupId', '==', groupId)

                let expenses = expensesSnapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                expenses = filterByYearMonth(expenses, yearFilter, monthFilter);
                expenses.sort((a, b) => safeDateMillis(b.date) - safeDateMillis(a.date));

                const debts = calculateGroupDebts(expenses, group.members);

                const debtRows = debts.map(d => [

                        { content: formatCurrency(monthTotal), styles: { fontStyle: 'bold', textColor: [41, 128, 185] } }

                        headStyles: { fillColor: [100, 100, 100] },
                        styles: { lineWidth: 0.1, lineColor: [200, 200, 200] },
                        columnStyles: {
                            4: { fontStyle: 'bold', halign: 'right' }
                        }
                    });

        async function loadCalendar() {
            showLoading();
            try {
                const yearFilter = document.getElementById('calendarYear')?.value || 'all';
                const monthFilter = document.getElementById('calendarMonth')?.value || 'all';

                // Load all data
                const [creditsSnapshot, personalSnapshot, groupsSnapshot] = await Promise.all([
                    db.collection('credits').where('userId', '==', currentUser.uid).get(),
                    db.collection('personal_expenses').where('userId', '==', currentUser.uid).get(),
                    db.collection('group_expenses').where('userId', '==', currentUser.uid).get()
                ]);

                let credits = creditsSnapshot.docs.map(doc => ({ id: doc.id, type: 'credit', ...doc.data() }));
                let personal = personalSnapshot.docs.map(doc => ({ id: doc.id, type: 'personal', ...doc.data() }));
                let groups = groupsSnapshot.docs.map(doc => ({ id: doc.id, type: 'group', ...doc.data() }));

                const allData = [...credits, ...personal, ...groups];
                // Add this loop right after to ensure all dates are valid:
                allData.forEach(item => {
                    if (item.date && !item.date.toDate) {
                        // Convert invalid dates to Firestore Timestamp
                        item.date = firebase.firestore.Timestamp.fromDate(safeDate(item.date));
                    }
                });
                const container = document.getElementById('calendarContainer');

                if (yearFilter === 'all' || monthFilter === 'all') {
                    // Show all time view - grouped by year and month
                    const groupedByYearMonth = {};
                    allData.forEach(item => {
                        const date = item.date.toDate();
                        const year = date.getFullYear();
                        const month = date.getMonth();
                        const key = `${year}-${month}`;
                        if (!groupedByYearMonth[key]) {
                            groupedByYearMonth[key] = { year, month, data: [] };
                        }
                        groupedByYearMonth[key].data.push(item);
                    });

                    let html = '<div class="calendar-all-time">';
                    Object.keys(groupedByYearMonth).sort().reverse().forEach(key => {
                        const { year, month, data } = groupedByYearMonth[key];
                        html += renderMonthCalendar(year, month, data);
                    });
                    html += '</div>';
                    container.innerHTML = html;
                } else {
                    // Show specific month
                    const year = parseInt(yearFilter);
                    const month = parseInt(monthFilter);
                    const filteredData = allData.filter(item => {
                        const date = item.date.toDate();
                        return date.getFullYear() === year && date.getMonth() === month;
                    });
                    container.innerHTML = renderMonthCalendar(year, month, filteredData);
                }
            } catch (error) {
                showToast('Error', error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        function renderMonthCalendar(year, month, data) {
            const monthName = getMonthName(month);
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Group data by day
            const dayData = {};
            data.forEach(item => {
                const day = item.date.toDate().getDate();
                if (!dayData[day]) {
                    dayData[day] = { credits: 0, expenses: 0, count: 0, items: [] };
                }
                dayData[day].items.push(item);
                dayData[day].count++;
                if (item.type === 'credit') {
                    dayData[day].credits += item.amount;
                } else {
                    dayData[day].expenses += item.amount;
                }
            });

            let html = `
                <div class="calendar-month">
                    <h3 class="calendar-month-title">${monthName} ${year}</h3>
                    <div class="calendar-grid">
                        <div class="calendar-header">Sun</div>
                        <div class="calendar-header">Mon</div>
                        <div class="calendar-header">Tue</div>
                        <div class="calendar-header">Wed</div>
                        <div class="calendar-header">Thu</div>
                        <div class="calendar-header">Fri</div>
                        <div class="calendar-header">Sat</div>
            `;

            // Empty cells before first day
            for (let i = 0; i < firstDay; i++) {
                html += '<div class="calendar-day empty"></div>';
            }

            // Days of month
            for (let day = 1; day <= daysInMonth; day++) {
                const dayInfo = dayData[day];
                const total = dayInfo ? dayInfo.credits - dayInfo.expenses : 0;
                const hasData = dayInfo && dayInfo.count > 0;

                html += `
                    <div class="calendar-day ${hasData ? 'has-data' : ''}" ${hasData ? `onclick="openDayDetails(${year}, ${month}, ${day})"` : ''}>
                        <div class="calendar-day-number">${day}</div>
                        ${hasData ? `
                            <div class="calendar-day-info">
                                <div class="calendar-day-amount" style="color: ${total >= 0 ? 'var(--success)' : 'var(--danger)'}">
                                    ${formatCurrency(Math.abs(total))}
                                </div>
                                <div class="calendar-day-count">
                                    <i class="fas fa-receipt"></i> ${dayInfo.count}
                                </div>
                                <i class="fas fa-info-circle calendar-day-icon"></i>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            html += `
                    </div>
                </div>
            `;

            return html;
        }

        async function openDayDetails(year, month, day) {
            showLoading();
            try {
                const date = new Date(year, month, day);
                const nextDate = new Date(year, month, day + 1);

                const [creditsSnapshot, personalSnapshot, groupsSnapshot] = await Promise.all([
                    db.collection('credits').where('userId', '==', currentUser.uid).get(),
                    db.collection('personal_expenses').where('userId', '==', currentUser.uid).get(),
                    db.collection('group_expenses').where('userId', '==', currentUser.uid).get()
                ]);


                const credits = creditsSnapshot.docs
                    .map(doc => ({ id: doc.id, type: 'Credit', ...doc.data() }))
                    .filter(item => {
                        const itemDate = safeDate(item.date); // Use safeDate helper
                        return itemDate >= date && itemDate < nextDate;
                    });

                const personal = personalSnapshot.docs
                    .map(doc => ({ id: doc.id, type: 'Personal', ...doc.data() }))
                    .filter(item => {
                        const itemDate = safeDate(item.date); // Use safeDate helper
                        return itemDate >= date && itemDate < nextDate;
                    });

                const groups = groupsSnapshot.docs
                    .map(doc => ({ id: doc.id, type: 'Group', ...doc.data() }))

                        const itemDate = safeDate(item.date); // Use safeDate helper
                        return itemDate >= date && itemDate < nextDate;
                    });

                const allItems = [...credits, ...personal, ...groups];

                const totalCredits = credits.reduce((sum, c) => sum + c.amount, 0);
                const totalPersonal = personal.reduce((sum, p) => sum + p.amount, 0);

                const modal = document.createElement('div');

                modal.innerHTML = `

                                        ${dailyTotal >= 0 ? '+' : ''}${formatCurrency(Math.abs(dailyTotal))}

                                </div>
                            </div>

                            ${allItems.length === 0 ? `
                                <div class="empty-state">
                                    <div class="empty-icon"><i class="fas fa-calendar-day"></i></div>
                                    <div class="empty-title">No transactions</div>
                                </div>
                            ` : `

                                        <thead>
                                            <tr>
                                                <th>Type</th>
                                                <th>${t('description')}</th>
                                                <th>${t('amount')}</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${allItems.map(item => `
                                                <tr>
                                                    <td><span class="badge badge-${item.type === 'Credit' ? 'success' : 'danger'}">${item.type}</span></td>
                                                    <td>${item.description}</td>

                        </div>

        async function loadDetails() {
            showLoading();
            try {

                const yearFilter = document.getElementById('detailsYear')?.value || 'all';
                const monthFilter = document.getElementById('detailsMonth')?.value || 'all';
                const typeFilter = document.getElementById('detailsType')?.value || 'all';

                // Load all data
                const [creditsSnapshot, personalSnapshot, groupsSnapshot, groupsListSnapshot] = await Promise.all([
                    db.collection('credits').where('userId', '==', currentUser.uid).get(),
                    db.collection('personal_expenses').where('userId', '==', currentUser.uid).get(),
                    db.collection('group_expenses').where('userId', '==', currentUser.uid).get(),
                    db.collection('groups').where('members', 'array-contains', currentUser.uid).get()
                ]);

                const groupsMap = {};
                groupsListSnapshot.docs.forEach(doc => {
                    groupsMap[doc.id] = doc.data().name;
                });

                let allData = [];

                if (typeFilter === 'all' || typeFilter === 'credit') {
                    const credits = creditsSnapshot.docs.map(doc => ({
                        id: doc.id,
                        section: 'Credit',
                        sectionType: 'credit',
                        canEdit: true,
                        ...doc.data()
                    }));
                    allData = allData.concat(credits);
                }

                if (typeFilter === 'all' || typeFilter === 'personal') {
                    const personal = personalSnapshot.docs.map(doc => ({
                        id: doc.id,
                        section: 'Personal',
                        sectionType: 'personal',
                        canEdit: true,
                        ...doc.data()
                    }));
                    allData = allData.concat(personal);
                }

                if (typeFilter === 'all' || typeFilter === 'group') {

                        const data = doc.data();
                        return {
                            id: doc.id,
                            section: `Group: ${groupsMap[data.groupId] || 'Unknown'}`,
                            sectionType: 'group',
                            canEdit: false,
                            ...data
                        };
                    });
                    allData = allData.concat(groups);

                // Apply filters
                allData = filterBySearch(allData, searchTerm, ['description', 'mode', 'remarks', 'amount', 'section']);

                                                                        <img src="${url}" alt="Attachment ${idx + 1}">
                                                                    </div>
                                                                `).join('')}
                                                            </div>

                                                    </td>
                                                    <td style="color: ${item.sectionType === 'credit' ? 'var(--success)' : 'var(--danger)'}; font-weight: 600;">

        async function saveEditDetailsRow(sectionType, id) {
            showLoading();
            try {
                const collection = sectionType === 'credit' ? 'credits' : 'personal_expenses';
                const doc = await db.collection(collection).doc(id).get();
                const oldData = doc.data();

                const updateData = {
                    date: firebase.firestore.Timestamp.fromDate(new Date(document.getElementById(`edit-details-date-${id}`).value)),
                    description: document.getElementById(`edit-details-description-${id}`).value,
                    mode: document.getElementById(`edit-details-mode-${id}`).value,
                    remarks: document.getElementById(`edit-details-remarks-${id}`).value,
                    amount: parseFloat(document.getElementById(`edit-details-amount-${id}`).value),
                    attachments: oldData.attachments || []
                };

                const newFiles = document.getElementById(`edit-details-new-attachments-${id}`).files;
                for (let file of newFiles) {
                    const ref = storage.ref(`${collection}/${currentUser.uid}/${Date.now()}_${file.name}`);
                    await ref.put(file);
                    const url = await ref.getDownloadURL();
                    updateData.attachments.push(url);
                }

                await db.collection(collection).doc(id).update(updateData);
                editingRowId = null;
                await loadDetails();
                showToast('Success', 'Transaction updated successfully!');
            } catch (error) {
                showToast('Error', error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        async function cancelEditDetailsRow() {
            editingRowId = null;
            await loadDetails();
        }

        async function removeDetailsAttachment(sectionType, id, urlToRemove) {
            try {
                const collection = sectionType === 'credit' ? 'credits' : 'personal_expenses';
                const doc = await db.collection(collection).doc(id).get();
                const data = doc.data();
                const attachments = (data.attachments || []).filter(url => url !== urlToRemove);

                await db.collection(collection).doc(id).update({ attachments });

                const container = document.getElementById(`edit-details-attachments-${id}`);
                const images = container.querySelectorAll('img');
                for (let img of images) {
                    if (img.src === urlToRemove) {
                        img.closest('.attachment').remove();
                        break;
                    }
                }
            } catch (error) {
                showToast('Error', error.message, 'error');
            }
        }

            const modal = document.createElement('div');
            modal.className = 'modal-overlay show';
            modal.innerHTML = `

                    <div class="modal-header">

        async function confirmDeleteDetailsRow(sectionType, id) {
            showLoading();
            try {
                const collection = sectionType === 'credit' ? 'credits' :
                    sectionType === 'personal' ? 'personal_expenses' :
                        'group_expenses';

                await db.collection(collection).doc(id).delete();
                document.querySelector('.modal-overlay')?.remove();
                await loadDetails();
                showToast('Success', 'Transaction deleted successfully!');
            } catch (error) {
                showToast('Error', error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        // Export Details PDF
        async function exportDetailsPDF() {
            showLoading();
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                const yearFilter = document.getElementById('detailsYear')?.value || 'all';
                const monthFilter = document.getElementById('detailsMonth')?.value || 'all';
                const typeFilter = document.getElementById('detailsType')?.value || 'all';
                const searchTerm = document.getElementById('detailsSearch')?.value || '';

                const [creditsSnapshot, personalSnapshot, groupsSnapshot, groupsListSnapshot] = await Promise.all([
                    db.collection('credits').where('userId', '==', currentUser.uid).get(),
                    db.collection('personal_expenses').where('userId', '==', currentUser.uid).get(),
                    db.collection('group_expenses').where('userId', '==', currentUser.uid).get(),
                    db.collection('groups').where('members', 'array-contains', currentUser.uid).get()
                ]);

                const groupsMap = {};
                groupsListSnapshot.docs.forEach(doc => {
                    groupsMap[doc.id] = doc.data().name;
                });

                const credits = creditsSnapshot.docs.map(doc => ({
                    section: 'Credit',
                    sectionType: 'credit',
                    ...doc.data()
                }));

                const personal = personalSnapshot.docs.map(doc => ({
                    section: 'Personal',
                    sectionType: 'personal',
                    ...doc.data()
                }));

                const groups = groupsSnapshot.docs.map(doc => {
                    const data = doc.data();
                    return {
                        section: `Group: ${groupsMap[data.groupId] || 'Unknown'}`,
                        sectionType: 'group',
                        ...data
                    };
                });

                let allData = [];
                if (typeFilter === 'all' || typeFilter === 'credit') {
                    allData = allData.concat(credits);
                }
                if (typeFilter === 'all' || typeFilter === 'personal') {
                    allData = allData.concat(personal);
                }
                if (typeFilter === 'all' || typeFilter === 'group') {
                    allData = allData.concat(groups);
                }

                // Apply filters
                if (searchTerm) {
                    allData = filterBySearch(allData, searchTerm, ['description', 'mode', 'remarks', 'amount', 'section']);
                }
                allData = filterByYearMonth(allData, yearFilter, monthFilter);
                allData.sort((a, b) => safeDateMillis(b.date) - safeDateMillis(a.date));

                // Header with green color
                doc.setFillColor(16, 185, 129);
                doc.rect(0, 0, 210, 30, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(20);
                doc.text(`SplitEra - ${t('allTransactionsReport')}`, 105, 15, { align: 'center' });
                doc.setFontSize(12);
                doc.text(`${t('generated')}: ${new Date().toLocaleDateString()}`, 105, 23, { align: 'center' });

                doc.setTextColor(0, 0, 0);
                let yPos = 40;

                const totalCredits = credits.reduce((sum, c) => sum + c.amount, 0);
                const totalPersonal = personal.reduce((sum, p) => sum + p.amount, 0);
                const totalGroup = groups.reduce((sum, g) => sum + g.amount, 0);

                doc.setFontSize(12);
                doc.text(t('summary'), 14, yPos);
                yPos += 10;

                doc.setFontSize(10);
                doc.text(`${t('totalCredits')}: ${formatCurrency(totalCredits)}`, 14, yPos);
                yPos += 7;
                doc.text(`${t('personalExpenses')}: ${formatCurrency(totalPersonal)}`, 14, yPos);
                yPos += 7;
                doc.text(`${t('groupExpenses')}: ${formatCurrency(totalGroup)}`, 14, yPos);
                yPos += 15;

                const grouped = groupByMonth(allData);

                Object.keys(grouped).sort().reverse().forEach(monthKey => {
                    const [year, month] = monthKey.split('-');
                    const monthName = getMonthName(parseInt(month) - 1);

                    if (yPos > 250) {
                        doc.addPage();
                        yPos = 20;
                    }

                    doc.setFontSize(12);
                    doc.setFont(undefined, 'bold');
                    doc.text(`${monthName} ${year}`, 14, yPos);
                    doc.setFont(undefined, 'normal');
                    yPos += 7;

                    let monthTotal = 0;

                    const tableData = grouped[monthKey].map(item => {
                        const amount = item.amount;
                        // For details, credits are + and debts/expenses are -
                        // But for the column val, we show signed string.
                        // For the total, we should sum signed values?
                        // Or just sum absolute?
                        // "Month-wise Totals" usually implies Net or Sum of Expenses?
                        // If it's "All Transactions", it's Net Flow.
                        // Credit is +, Expense is -.
                        const signedAmount = item.sectionType === 'credit' ? amount : -amount;
                        monthTotal += signedAmount;

                        return [
                            safeDate(item.date).toLocaleDateString(),
                            item.section,
                            item.description,
                            item.mode,
                            `${item.sectionType === 'credit' ? '+' : '-'}${formatCurrency(amount)}`
                        ];
                    });

                    // Add Total Row
                    tableData.push([
                        { content: t('total'), colSpan: 4, styles: { fontStyle: 'bold', halign: 'right' } },
                        { content: formatCurrency(monthTotal), styles: { fontStyle: 'bold', textColor: monthTotal >= 0 ? [22, 163, 74] : [220, 38, 38] } } // Green/Red
                    ]);

                    doc.autoTable({
                        startY: yPos,
                        head: [[t('date'), t('section'), t('description'), t('mode'), t('amount')]],
                        body: tableData,
                        theme: 'grid', // Borders
                        headStyles: { fillColor: [16, 185, 129], lineWidth: 0.1, lineColor: [200, 200, 200] },
                        styles: { lineWidth: 0.1, lineColor: [200, 200, 200] }, // Cell borders
                        margin: { left: 14, right: 14 },
                        didDrawPage: (data) => {
                            // Resets yPos if page breaks
                        }
                    });

                    yPos = doc.lastAutoTable.finalY + 15;
                });

                doc.save(`all-transactions-${Date.now()}.pdf`);
                showToast(t('success'), t('pdfExportSuccess'));
            } catch (error) {
                showToast(t('error'), `${t('failedToExportPdf')}: ${error.message}`);
            } finally {
                hideLoading();
            }
        }

        function toggleProfileEdit() {
            const viewMode = document.getElementById('profileViewMode');
            const editMode = document.getElementById('profileEditMode');
            const editBtn = document.getElementById('editProfileBtn');

            if (viewMode.style.display === 'none') {
                viewMode.style.display = 'block';
                editMode.style.display = 'none';
                editBtn.innerHTML = `<i class="fas fa-edit"></i> ${t('editProfile')}`;
            } else {
                viewMode.style.display = 'none';
                editMode.style.display = 'block';
                editBtn.innerHTML = `<i class="fas fa-times"></i> ${t('cancelEdit')}`;
            }
        }

        async function saveProfile() {
            showLoading();
            try {
                const updates = {
                    firstName: document.getElementById('editFirstName').value,
                    lastName: document.getElementById('editLastName').value,
                    email: document.getElementById('editEmail').value,
                    countryCode: document.getElementById('editCountryCode').value,
                    phone: document.getElementById('editPhone').value
                };

                // Handle photo upload
                const photoFile = document.getElementById('newProfilePhoto').files[0];
                if (photoFile) {
                    const photoRef = storage.ref(`profile_photos/${currentUser.uid}`);
                    await photoRef.put(photoFile);
                    updates.photoUrl = await photoRef.getDownloadURL();
                }

                // Update Firestore
                await db.collection('users').doc(currentUser.uid).update(updates);

                // Update email if changed
                if (updates.email !== currentUser.email) {
                    await auth.currentUser.updateEmail(updates.email);
                }

                // Update password if provided
                const newPassword = document.getElementById('editPassword').value;
                if (newPassword) {
                    await auth.currentUser.updatePassword(newPassword);
                }

                // Update current user
                Object.assign(currentUser, updates);

                // Update display
                document.getElementById('profilePhotoDisplay').src = currentUser.photoUrl || 'https://via.placeholder.com/120';

                toggleProfileEdit();
                showToast(t('success'), t('profileUpdated'));
            } catch (error) {
                showToast(t('error'), error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        async function removeProfilePhoto() {
            showLoading();
            try {
                await db.collection('users').doc(currentUser.uid).update({
                    photoUrl: ''
                });

                currentUser.photoUrl = '';
                document.getElementById('profilePhotoEdit').src = 'https://via.placeholder.com/120';
                document.getElementById('profilePhotoDisplay').src = 'https://via.placeholder.com/120';

                showToast('Success', 'Profile photo removed!');
            } catch (error) {
                showToast('Error', error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        async function saveSettings() {
            showLoading();
            try {
                const currency = document.getElementById('settingsCurrency').value;
                const country = document.getElementById('settingsCountry').value;
                const darkMode = document.getElementById('settingsDarkMode').checked;
                const language = document.getElementById('settingsLanguage').value;

                // Save to localStorage
                localStorage.setItem('currency', currency);
                localStorage.setItem('country', country);
                localStorage.setItem('darkMode', darkMode);
                localStorage.setItem('language', language);
                localStorage.setItem('lang', language);
                localStorage.setItem('theme', darkMode ? 'dark' : 'light');

                // Update Firebase user profile if logged in
                if (currentUser && currentUser.uid) {
                    await db.collection('users').doc(currentUser.uid).update({
                        currency: currency,
                        country: country,
                        darkMode: darkMode,
                        language: language,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }

                // Apply immediately
                document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
                currentLang = language;

                showToast('Success', 'Settings saved successfully! Reloading...');

                setTimeout(() => {
                    window.location.reload();
                }, 1000);

            } catch (error) {
                console.error('Error saving settings:', error);
                showToast('Error', 'Failed to save settings: ' + error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        async function exportAllDataPDF() {
            showLoading();
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                // Load all data
                const [creditsSnapshot, personalSnapshot, groupsSnapshot, groupsListSnapshot] = await Promise.all([
                    db.collection('credits').where('userId', '==', currentUser.uid).get(),
                    db.collection('personal_expenses').where('userId', '==', currentUser.uid).get(),
                    db.collection('group_expenses').where('userId', '==', currentUser.uid).get(),
                    db.collection('groups').where('members', 'array-contains', currentUser.uid).get()
                ]);

                // Header
                doc.setFillColor(255, 153, 51);
                doc.rect(0, 0, 210, 40, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(24);
                doc.text('SplitEra', 105, 20, { align: 'center' });
                doc.setFontSize(16);
                doc.text(t('completeDataExport'), 105, 30, { align: 'center' });

                doc.setTextColor(0, 0, 0);
                let yPos = 50;

                // User Info
                doc.setFontSize(14);
                doc.text(t('userInformation'), 14, yPos);
                yPos += 10;
                doc.setFontSize(10);
                doc.text(`${t('name')}: ${currentUser.firstName} ${currentUser.lastName || ''}`, 14, yPos);
                yPos += 7;
                doc.text(`${t('email')}: ${currentUser.email}`, 14, yPos);
                yPos += 7;
                doc.text(`User ID: ${currentUser.userId}`, 14, yPos);
                yPos += 7;
                doc.text(`${t('exportDate')}: ${new Date().toLocaleString()}`, 14, yPos);
                yPos += 15;

                // Credits Summary
                const credits = creditsSnapshot.docs.map(doc => doc.data());
                const totalCredits = credits.reduce((sum, c) => sum + c.amount, 0);
                doc.setFontSize(12);
                doc.text(`${t('creditTransactions')} (${credits.length} ${t('transactions')}) - ${t('total')}: ${formatCurrency(totalCredits)}`, 14, yPos);
                yPos += 10;

                if (credits.length > 0) {
                    const creditData = credits.map(c => [
                        c.date.toDate().toLocaleDateString(),
                        c.description,
                        c.mode,
                        formatCurrency(c.amount)
                    ]);

                    doc.autoTable({
                        startY: yPos,
                        head: [[t('date'), t('description'), t('mode'), t('amount')]],
                        body: creditData,
                        theme: 'grid',
                        headStyles: { fillColor: [16, 185, 129] },
                        margin: { left: 14, right: 14 }
                    });
                    yPos = doc.lastAutoTable.finalY + 15;
                }

                // Personal Expenses Summary
                if (yPos > 250) {
                    doc.addPage();
                    yPos = 20;
                }

                const personal = personalSnapshot.docs.map(doc => doc.data());
                const totalPersonal = personal.reduce((sum, p) => sum + p.amount, 0);
                doc.setFontSize(12);
                doc.text(`${t('personalExpenses')} (${personal.length} ${t('transactions')}) - ${t('total')}: ${formatCurrency(totalPersonal)}`, 14, yPos);
                yPos += 10;

                if (personal.length > 0) {
                    const personalData = personal.map(p => [
                        p.date.toDate().toLocaleDateString(),
                        p.description,
                        p.mode,
                        formatCurrency(p.amount)
                    ]);

                    doc.autoTable({
                        startY: yPos,
                        head: [['Date', 'Description', 'Mode', 'Amount']],
                        body: personalData,
                        theme: 'grid',
                        headStyles: { fillColor: [239, 68, 68] },
                        margin: { left: 14, right: 14 }
                    });
                    yPos = doc.lastAutoTable.finalY + 15;
                }

                // Group Expenses Summary
                if (yPos > 250) {
                    doc.addPage();
                    yPos = 20;
                }

                const groups = groupsSnapshot.docs.map(doc => doc.data());
                const totalGroup = groups.reduce((sum, g) => sum + g.amount, 0);
                doc.setFontSize(12);
                doc.text(`${t('groupExpenses')} (${groups.length} ${t('transactions')}) - ${t('total')}: ${formatCurrency(totalGroup)}`, 14, yPos);
                yPos += 10;

                if (groups.length > 0) {
                    const groupData = groups.map(g => [
                        g.date.toDate().toLocaleDateString(),
                        g.description,
                        g.mode,
                        formatCurrency(g.amount)
                    ]);

                    doc.autoTable({
                        startY: yPos,
                        head: [['Date', 'Description', 'Mode', 'Amount']],
                        body: groupData,
                        theme: 'grid',
                        headStyles: { fillColor: [59, 130, 246] },
                        margin: { left: 14, right: 14 }
                    });
                }

                doc.save(`splitera-complete-data-${Date.now()}.pdf`);
                showToast(t('success'), t('pdfExportSuccess'));
            } catch (error) {
                showToast(t('error'), `${t('failedToExportPdf')}: ${error.message}`, 'error');
            } finally {
                hideLoading();
            }
        }

        async function exportAllDataJSON() {
            showLoading();
            try {
                const [creditsSnapshot, personalSnapshot, groupsSnapshot, groupsListSnapshot] = await Promise.all([
                    db.collection('credits').where('userId', '==', currentUser.uid).get(),
                    db.collection('personal_expenses').where('userId', '==', currentUser.uid).get(),
                    db.collection('group_expenses').where('userId', '==', currentUser.uid).get(),
                    db.collection('groups').where('members', 'array-contains', currentUser.uid).get()
                ]);

                const exportData = {
                    exportDate: new Date().toISOString(),
                    user: {
                        userId: currentUser.userId,
                        firstName: currentUser.firstName,
                        lastName: currentUser.lastName,
                        email: currentUser.email,
                        phone: currentUser.phone,
                        countryCode: currentUser.countryCode
                    },
                    credits: creditsSnapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data(),
                        date: doc.data().date.toDate().toISOString()
                    })),
                    personalExpenses: personalSnapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data(),
                        date: doc.data().date.toDate().toISOString()
                    })),
                    groupExpenses: groupsSnapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data(),
                        date: doc.data().date.toDate().toISOString()
                    })),
                    groups: groupsListSnapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data(),
                        createdAt: doc.data().createdAt?.toDate().toISOString()
                    }))
                };

                const dataStr = JSON.stringify(exportData, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `splitera-complete-data-${Date.now()}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);

                showToast(t('success'), t('jsonExportSuccess'));
            } catch (error) {
                showToast(t('error'), `${t('failedToExportJson')}: ${error.message}`, 'error');
            } finally {
                hideLoading();
            }
        }

                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
                transform: translateY(-2px);
            }

                margin-bottom: 0.5rem;
            }

                flex-direction: column;
                gap: 0.25rem;

                font-weight: 600;
            }

            .calendar-day-count {
                color: var(--text-gray);
                font-size: 0.8rem;
            }

            .calendar-day-icon {
                position: absolute;
                top: 0.5rem;
                right: 0.5rem;
                color: var(--primary);
                font-size: 0.9rem;
            }

            .day-summary {
                background: var(--bg-gray);
                padding: 1rem;
                border-radius: 8px;
                margin-bottom: 1.5rem;
            }

            .day-summary-item {
                display: flex;
                justify-content: space-between;
                padding: 0.5rem 0;

            .month-group {
                margin-bottom: 2rem;
            }

            .month-header {
                background: var(--primary);
                color: white;
                padding: 0.75rem 1rem;
                border-radius: 8px;
                font-size: 1.1rem;
                font-weight: 600;
                margin-bottom: 1rem;

            /* Profile Styles */
            .profile-display {
                display: flex;
                gap: 2rem;
                align-items: flex-start;
            }

            .profile-photo-display {
                flex-shrink: 0;
            }

            .profile-photo-display img {
                width: 120px;
                height: 120px;
                border-radius: 50%;
                object-fit: cover;
                border: 3px solid var(--primary);
            }

            .profile-info {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }

            .profile-field {
                display: flex;
                gap: 1rem;
            }

            .profile-field label {
                font-weight: 600;
                min-width: 120px;
                color: var(--text-gray);
            }

            .profile-field span {
                color: var(--text);
            }

            .profile-photo-edit {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1rem;
            }

            .profile-photo-edit img {
                width: 120px;
                height: 120px;
                border-radius: 50%;
                object-fit: cover;
                border: 3px solid var(--primary);
            }

            .profile-photo-actions {
                display: flex;
                gap: 0.5rem;
            }

            .settings-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 1.5rem;
            }

            /* Toggle Switch Styles */
            .toggle-switch {
                position: relative;
                display: inline-block;
                width: 60px;
                height: 34px;
            }

            .toggle-switch input {
                opacity: 0;
                width: 0;
                height: 0;
            }

            .toggle-slider {
                position: absolute;
                cursor: pointer;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background-color: var(--border);
                transition: 0.4s;
                border-radius: 34px;
            }

            .toggle-slider:before {
                position: absolute;
                content: "";
                height: 26px;
                width: 26px;
                left: 4px;
                bottom: 4px;
                background-color: white;
                transition: 0.4s;
                border-radius: 50%;
            }

            .toggle-switch input:checked + .toggle-slider {
                background-color: var(--primary);
            }

            .toggle-switch input:checked + .toggle-slider:before {
                transform: translateX(26px);
            }

            /* Groups Grid */
            .groups-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 1.5rem;
            }

            .group-card {
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 1.5rem;
                background: var(--card-bg);
                transition: all 0.3s ease;
            }

            .group-card:hover {

            .group-header {

                padding-bottom: 1rem;

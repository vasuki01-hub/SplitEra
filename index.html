 <head>

  <style>
    body {
      box-sizing: border-box;
    }
    
    *, *::before, *::after {
      box-sizing: inherit;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #FF8C42;
      --secondary: #D35400;
      --accent: #F39C12;
      --bg: #FDFEFE;
      --text: #2C3E50;
      --card-bg: #FFFFFF;
      --border: #E8E8E8;
      --success: #27AE60;
      --error: #E74C3C;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    [data-theme="dark"] {
      --bg: #1A1A2E;
      --text: #EAEAEA;
      --card-bg: #16213E;
      --border: #0F3460;
      --shadow: rgba(0, 0, 0, 0.3);
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }

    #app {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      overflow: auto;
    }

    /* Toast Notifications */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background: var(--card-bg);
      padding: 16px 24px;
      border-radius: 8px;
      box-shadow: 0 4px 12px var(--shadow);
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 300px;
      animation: slideIn 0.3s ease;
      border-left: 4px solid var(--success);
    }

    .toast.error {
      border-left-color: var(--error);
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* Loading Spinner */
    .spinner {
      border: 3px solid var(--border);
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Auth Page */
    .auth-page {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .auth-page::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      top: -100px;
      right: -100px;
    }

    .auth-page::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      bottom: -150px;
      left: -150px;
    }

    .auth-card {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 500px;
      position: relative;
      z-index: 1;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-logo h1 {
      font-size: 32px;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .auth-logo p {
      color: var(--text);
      opacity: 0.7;
    }

    .auth-tabs {
      display: flex;
      gap: 16px;
      margin-bottom: 32px;
      border-bottom: 2px solid var(--border);
    }

    .auth-tab {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      position: relative;
      transition: color 0.3s;
    }

    .auth-tab.active {
      color: var(--primary);
    }

    .auth-tab.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--primary);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text);
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      transition: border-color 0.3s;
      font-family: inherit;
    }

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-primary:hover {
      background: var(--secondary);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Header */
    .header {
      background: var(--card-bg);
      border-bottom: 2px solid var(--primary);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 12px var(--shadow);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 1px 1px 2px var(--shadow);
    }

    .nav-links {
      display: flex;
      gap: 4px;
    }

    .nav-link {
      padding: 10px 18px;
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      transition: all 0.3s;
      position: relative;
    }

    .nav-link:hover {
      background: var(--bg);
      transform: translateY(-2px);
    }

    .nav-link.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 8px rgba(255, 140, 66, 0.3);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .theme-toggle {
      background: none;
      border: none;
      padding: 8px;
      cursor: pointer;
      font-size: 20px;
      border-radius: 6px;
      transition: background 0.3s;
    }

    .theme-toggle:hover {
      background: var(--bg);
    }

    .user-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      border: 3px solid var(--primary);
      box-shadow: 0 2px 8px rgba(255, 140, 66, 0.4);
      transition: all 0.3s;
    }

    .user-avatar:hover {
      transform: scale(1.1);
      box-shadow: 0 4px 12px rgba(255, 140, 66, 0.6);
    }

    .user-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Mobile Menu */
    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--text);
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }

    /* Dashboard */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 4px 16px var(--shadow);
      border-left: 5px solid var(--primary);
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 100px;
      height: 100px;
      background: var(--primary);
      opacity: 0.05;
      border-radius: 50%;
      transform: translate(30%, -30%);
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px var(--shadow);
    }

    .stat-card h3 {
      font-size: 14px;
      color: var(--text);
      opacity: 0.8;
      margin-bottom: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 36px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }

    /* Sections */
    .section {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px var(--shadow);
      margin-bottom: 24px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .section-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
    }

    .btn-secondary {
      padding: 10px 20px;
      background: var(--secondary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-secondary:hover {
      background: var(--primary);
    }

    /* Tables */
    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 12px;
      background: var(--bg);
      font-weight: 600;
      color: var(--text);
    }

    td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    tr:hover {
      background: var(--bg);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      padding: 20px;
    }

    .modal {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 32px;
      max-width: 600px;
      width: 100%;
      max-height: 90%;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-title {
      font-size: 24px;
      font-weight: 700;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--text);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* Groups */
    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }

    .group-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px var(--shadow);
      border-left: 4px solid var(--accent);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .group-card:hover {
      transform: translateY(-2px);
    }

    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .group-name {
      font-size: 20px;
      font-weight: 700;
    }

    .group-code {
      background: var(--primary);
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .group-members {
      font-size: 14px;
      color: var(--text);
      opacity: 0.7;
      margin-bottom: 16px;
    }

    .group-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .btn-small {
      padding: 8px 16px;
      font-size: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    .btn-change {
      background: var(--primary);
      color: white;
    }

    .btn-remove {
      background: var(--error);
      color: white;
    }

    .pending-requests {
      background: var(--bg);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 24px;
    }

    .request-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: var(--card-bg);
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .request-actions {
      display: flex;
      gap: 8px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header-left {
        gap: 12px;
      }

      .nav-links {
        display: none;
      }

      .mobile-menu-btn {
        display: block;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .groups-grid {
        grid-template-columns: 1fr;
      }

      .main-content {
        padding: 16px;
      }

      .section {
        padding: 16px;
      }
    }
  </style>

      const lang = userSettings.language || 'en';
      let text = translations[lang]?.[key] || translations.en[key] || key;
      
      // Replace placeholders like {userId}, {count}, etc.
      Object.keys(replacements).forEach(k => {
        text = text.replace(`{${k}}`, replacements[k]);
      });
      
      return text;
    }

      toast.innerHTML = `
        <span>${isError ? '❌' : '✅'}</span>

      container.appendChild(toast);
      
      setTimeout(() => {

    function generateUserId(firstName, lastName, email) {
      const namePart = `${firstName}${lastName}`.toLowerCase().replace(/[^a-z0-9]/g, '');
      const emailPart = email.split('@')[0].toLowerCase().replace(/[^a-z0-9]/g, '');
      const randomPart = Math.random().toString(36).substring(2, 6);
      return `${namePart}_${emailPart}_${randomPart}`;
    }

    function handleAuth(event) {
      event.preventDefault();
      const form = event.target;
      const formData = new FormData(form);
      const data = {};
      formData.forEach((value, key) => {
        data[key] = value;
      });
      const isSignup = !!data.firstName;
      
      if (isSignup) {
        // Check if user exists
        const existingUser = mockDB.users.find(u => u.email === data.email);
        if (existingUser) {
          showToast('Email already registered', true);
          return;
        }
        
        // Handle profile photo
        let profilePhoto = null;
        const photoInput = document.querySelector('input[name="profilePhoto"]');
        if (photoInput && photoInput.files.length > 0) {
          profilePhoto = URL.createObjectURL(photoInput.files[0]);
        }
        
        // Create new user
        const newUser = {
          id: Date.now().toString(),
          userId: generateUserId(data.firstName, data.lastName, data.email),
          firstName: data.firstName,
          lastName: data.lastName,
          email: data.email,
          password: data.password, // In production, hash this!
          contact: `${data.countryCode}${data.contact}`,
          countryCode: data.countryCode,
          profilePhoto: profilePhoto,
          createdAt: new Date().toISOString()
        };
        
        // Show OTP modal for signup
        showOTPModal(newUser, true);
        
      } else {
        // Login - check credentials first
        const user = mockDB.users.find(u => (u.email === data.email || u.userId === data.email) && u.password === data.password);
        if (!user) {
          showToast('Invalid credentials', true);
          return;
        }
        
        // Show OTP modal for login
        showOTPModal(user, false);
      }
    }

          break;
        case 'credits':
          renderCredits(content);
          break;
        case 'personal':
          renderPersonal(content);
          break;
        case 'groups':
          renderGroups(content);
          break;
        case 'calendar':
          renderCalendar(content);
          break;
        case 'details':
          renderDetails(content);
          break;
        case 'settings':
          renderSettings(content);
          break;
        case 'profile':
          renderProfileEdit(content);
          break;
      }
    }

    function renderDashboard(content) {
      const selectedYear = window.dashboardFilters?.year || 'all';
      const selectedMonth = window.dashboardFilters?.month || 'all';
      
      let filteredExpenses = expenses.slice();
      let filteredCredits = credits.slice();
      let filteredGroupExpenses = [];
      
      groups.forEach(g => {
        if (g.expenses) {
          filteredGroupExpenses.push(...g.expenses);
        }
      });
      
      // Apply filters
      if (selectedYear !== 'all') {
        const year = parseInt(selectedYear);
        filteredExpenses = filteredExpenses.filter(e => new Date(e.date).getFullYear() === year);
        filteredCredits = filteredCredits.filter(c => new Date(c.date).getFullYear() === year);
        filteredGroupExpenses = filteredGroupExpenses.filter(e => new Date(e.date).getFullYear() === year);
        
        if (selectedMonth !== 'all') {
          const month = parseInt(selectedMonth);
          filteredExpenses = filteredExpenses.filter(e => new Date(e.date).getMonth() === month);
          filteredCredits = filteredCredits.filter(c => new Date(c.date).getMonth() === month);
          filteredGroupExpenses = filteredGroupExpenses.filter(e => new Date(e.date).getMonth() === month);
        }
      }
      
      const totalExpenses = filteredExpenses.reduce((sum, e) => sum + parseFloat(e.amount), 0);
      const totalCredits = filteredCredits.reduce((sum, c) => sum + parseFloat(c.amount), 0);
      const totalGroupExpenses = filteredGroupExpenses.reduce((sum, e) => sum + parseFloat(e.amount), 0);
      const netBalance = totalCredits - totalExpenses - totalGroupExpenses;
      
      const years = ['all', ...new Set([
        ...expenses.map(e => new Date(e.date).getFullYear()),
        ...credits.map(c => new Date(c.date).getFullYear()),
        ...filteredGroupExpenses.map(e => new Date(e.date).getFullYear())
      ])].sort((a, b) => {
        if (a === 'all') return -1;
        if (b === 'all') return 1;
        return b - a;
      });
      
      const months = [
        { value: 'all', label: 'All Time' },
        { value: '0', label: 'January' }, { value: '1', label: 'February' }, { value: '2', label: 'March' },
        { value: '3', label: 'April' }, { value: '4', label: 'May' }, { value: '5', label: 'June' },
        { value: '6', label: 'July' }, { value: '7', label: 'August' }, { value: '8', label: 'September' },
        { value: '9', label: 'October' }, { value: '10', label: 'November' }, { value: '11', label: 'December' }
      ];
      
      content.innerHTML = `
        <div class="section">
          <div class="section-header">
            <h2 class="section-title">📊 Dashboard Overview</h2>
            <button class="btn-secondary" onclick="exportDashboardPDF()">📄 Export PDF</button>
          </div>
          
          <div class="dashboard-grid">
            <div class="stat-card" style="border-left-color: ${netBalance >= 0 ? 'var(--success)' : 'var(--error)'};">
              <h3>Net Balance</h3>
              <div class="stat-value" style="color: ${netBalance >= 0 ? 'var(--success)' : 'var(--error)'};">
                ${formatCurrency(netBalance)}
              </div>
              <p style="font-size: 13px; opacity: 0.7;">Credits - Personal - Groups</p>
            </div>
            <div class="stat-card" style="border-left-color: var(--success);">
              <h3>Total Credits</h3>
              <div class="stat-value" style="color: var(--success);">${formatCurrency(totalCredits)}</div>
              <p style="font-size: 13px; opacity: 0.7;">${filteredCredits.length} transaction(s)</p>
            </div>
            <div class="stat-card" style="border-left-color: var(--primary);">
              <h3>Personal Expenses</h3>
              <div class="stat-value">${formatCurrency(totalExpenses)}</div>
              <p style="font-size: 13px; opacity: 0.7;">${filteredExpenses.length} transaction(s)</p>
            </div>
            <div class="stat-card" style="border-left-color: var(--accent);">
              <h3>Group Expenses</h3>
              <div class="stat-value">${formatCurrency(totalGroupExpenses)}</div>
              <p style="font-size: 13px; opacity: 0.7;">${groups.length} group(s)</p>
            </div>
          </div>
          
          <div style="background: var(--card-bg); padding: 24px; border-radius: 16px; box-shadow: 0 4px 16px var(--shadow);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
              <h3 style="font-size: 20px; font-weight: 700;">Breakdown Overview</h3>
              <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <select id="dashboard-year-filter" style="min-width: 140px; padding: 10px 14px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-weight: 500;">
                  ${years.map(y => `<option value="${y}" ${selectedYear == y ? 'selected' : ''}>${y === 'all' ? 'All Time' : y}</option>`).join('')}
                </select>
                <select id="dashboard-month-filter" style="min-width: 140px; padding: 10px 14px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-weight: 500;" ${selectedYear === 'all' ? 'disabled' : ''}>
                  ${months.map(m => `<option value="${m.value}" ${selectedMonth == m.value ? 'selected' : ''}>${m.label}</option>`).join('')}
                </select>
              </div>
            </div>
            
            <div style="text-align: center; padding: 40px;">
              <canvas id="dashboard-chart" style="max-width: 400px; max-height: 400px; margin: 0 auto;"></canvas>
            </div>
          </div>
        </div>
      `;
      
      document.getElementById('dashboard-year-filter').addEventListener('change', applyDashboardFilters);
      document.getElementById('dashboard-month-filter').addEventListener('change', applyDashboardFilters);
      
      // Create chart
      const ctx = document.getElementById('dashboard-chart');
      if (ctx && window.Chart) {
        new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: ['Credits', 'Personal Expenses', 'Group Expenses'],
            datasets: [{
              data: [totalCredits, totalExpenses, totalGroupExpenses],
              backgroundColor: ['#27AE60', '#FF8C42', '#F39C12'],
              borderWidth: 2,
              borderColor: '#fff'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
              legend: {
                position: 'bottom',
                labels: {
                  padding: 20,
                  font: { size: 14, weight: '600' }
                }
              }
            }
          }
        });
      }
    }

    function applyDashboardFilters() {
      const year = document.getElementById('dashboard-year-filter').value;
      const month = document.getElementById('dashboard-month-filter').value;
      const monthSelect = document.getElementById('dashboard-month-filter');
      
      if (year === 'all') {
        monthSelect.disabled = true;
        monthSelect.value = 'all';
      } else {
        monthSelect.disabled = false;
      }
      
      window.dashboardFilters = { year, month };
      renderDashboard(document.getElementById('main-content'));
    }

    window.exportDashboardPDF = function() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      
      // Saffron header
      doc.setFillColor(255, 153, 51);
      doc.rect(0, 0, 210, 25, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(20);
      doc.setFont(undefined, 'bold');
      doc.text('SplitEra - Dashboard Overview', 105, 15, { align: 'center' });
      
      doc.setTextColor(0, 0, 0);
      doc.setFontSize(10);
      doc.text(`Generated: ${new Date().toLocaleDateString()}`, 14, 32);
      
      // Stats summary
      const totalCredits = credits.reduce((sum, c) => sum + parseFloat(c.amount), 0);
      const totalExpenses = expenses.reduce((sum, e) => sum + parseFloat(e.amount), 0);
      const totalGroupExpenses = groups.flatMap(g => g.expenses || []).reduce((sum, e) => sum + parseFloat(e.amount), 0);
      const netBalance = totalCredits - totalExpenses - totalGroupExpenses;
      
      doc.setFontSize(12);
      doc.setFont(undefined, 'bold');
      doc.text('Summary', 14, 42);
      doc.setFont(undefined, 'normal');
      doc.setFontSize(10);
      doc.text(`Net Balance: ${formatCurrency(netBalance)}`, 14, 50);
      doc.text(`Total Credits: ${formatCurrency(totalCredits)}`, 14, 56);
      doc.text(`Personal Expenses: ${formatCurrency(totalExpenses)}`, 14, 62);
      doc.text(`Group Expenses: ${formatCurrency(totalGroupExpenses)}`, 14, 68);
      
      doc.save('splitera-dashboard.pdf');
      showToast('Dashboard PDF exported! 📄');

    function renderPersonal(content) {
      const selectedYear = window.personalFilters?.year || 'all';
      const selectedMonth = window.personalFilters?.month || 'all';
      const searchQuery = window.personalFilters?.search || '';
      
      let filteredExpenses = expenses.slice();
      
      // Apply search
      if (searchQuery) {
        filteredExpenses = filteredExpenses.filter(e => {
          const searchStr = `${e.date} ${e.description || ''} ${e.category || ''} ${e.amount} ${e.mode || ''} ${e.remarks || ''}`.toLowerCase();
          return searchStr.includes(searchQuery.toLowerCase());
        });
      }
      
      // Apply year/month filters
      if (selectedYear !== 'all') {
        filteredExpenses = filteredExpenses.filter(e => new Date(e.date).getFullYear() === parseInt(selectedYear));
        if (selectedMonth !== 'all') {
          filteredExpenses = filteredExpenses.filter(e => new Date(e.date).getMonth() === parseInt(selectedMonth));
        }
      }
      
      // Sort by date descending
      filteredExpenses.sort((a, b) => new Date(b.date) - new Date(a.date));
      
      // Group by year-month for all-time view

        filteredExpenses.forEach(e => {
          const date = new Date(e.date);
          const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
          if (!groupedExpenses[key]) groupedExpenses[key] = [];
          groupedExpenses[key].push(e);
        });
      }
      
      const years = ['all', ...new Set(expenses.map(e => new Date(e.date).getFullYear()))].sort((a, b) => {
        if (a === 'all') return -1;
        if (b === 'all') return 1;
        return b - a;
      });
      
      const months = [
        { value: 'all', label: 'All Time' },
        { value: '0', label: 'January' }, { value: '1', label: 'February' }, { value: '2', label: 'March' },
        { value: '3', label: 'April' }, { value: '4', label: 'May' }, { value: '5', label: 'June' },
        { value: '6', label: 'July' }, { value: '7', label: 'August' }, { value: '8', label: 'September' },
        { value: '9', label: 'October' }, { value: '10', label: 'November' }, { value: '11', label: 'December' }
      ];
      
      const totalAmount = filteredExpenses.reduce((sum, e) => sum + parseFloat(e.amount), 0);
      
      content.innerHTML = `
        <div class="section">
          <div class="section-header">
            <h2 class="section-title">💳 Personal Expenses</h2>
            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
              <button class="btn-secondary" onclick="addExpense()">➕ Add Expense</button>
              <button class="btn-secondary" onclick="exportPersonalPDF()">📄 Export PDF</button>
            </div>
          </div>
          
          <div style="padding: 20px; background: var(--error); color: white; border-radius: 12px; margin-bottom: 24px; text-align: center;">
            <div style="font-size: 16px; margin-bottom: 8px; opacity: 0.9;">Total Expenses</div>
            <div style="font-size: 42px; font-weight: 800;">-${formatCurrency(totalAmount)}</div>
          </div>
          
          <div style="display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap;">
            <input type="text" id="personal-search" placeholder="Search by date, amount, description, mode, remarks..." value="${searchQuery}" style="flex: 1; min-width: 200px; padding: 12px 16px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-weight: 500;">
            <select id="personal-year-filter" style="min-width: 140px; padding: 10px 14px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-weight: 500;">
              ${years.map(y => `<option value="${y}" ${selectedYear == y ? 'selected' : ''}>${y === 'all' ? 'All Time' : y}</option>`).join('')}
            </select>
            <select id="personal-month-filter" style="min-width: 140px; padding: 10px 14px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-weight: 500;" ${selectedYear === 'all' ? 'disabled' : ''}>
              ${months.map(m => `<option value="${m.value}" ${selectedMonth == m.value ? 'selected' : ''}>${m.label}</option>`).join('')}
            </select>
          </div>
          
          <div class="table-container">
            ${selectedYear === 'all' && Object.keys(groupedExpenses).length > 0 ?
              Object.keys(groupedExpenses).sort().reverse().map(yearMonth => {
                const [year, month] = yearMonth.split('-');
                const monthName = months.find(m => m.value === String(parseInt(month) - 1))?.label || month;
                const monthExpenses = groupedExpenses[yearMonth];
                const monthTotal = monthExpenses.reduce((sum, e) => sum + parseFloat(e.amount), 0);
                
                return `
                  <h3 style="margin: 24px 0 16px 0; padding: 12px; background: var(--error); color: white; border-radius: 8px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center;">
                    <span>${monthName} ${year}</span>
                    <span>-${formatCurrency(monthTotal)}</span>
                  </h3>
                  <table>
                    <thead>
                      <tr>
                        <th>Date</th>
                        <th>Description & Attachments</th>
                        <th>Category</th>
                        <th>Mode</th>
                        <th>Remarks</th>
                        <th>Amount</th>
                        <th>Actions</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${renderPersonalRows(monthExpenses)}
                    </tbody>
                  </table>
                `;
              }).join('')
            : `
              <table>
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Description & Attachments</th>
                    <th>Category</th>
                    <th>Mode</th>
                    <th>Remarks</th>
                    <th>Amount</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  ${renderPersonalRows(filteredExpenses)}
                </tbody>
              </table>

          </div>
        </div>
      `;
      
      document.getElementById('personal-search').addEventListener('input', applyPersonalFilters);
      document.getElementById('personal-year-filter').addEventListener('change', applyPersonalFilters);
      document.getElementById('personal-month-filter').addEventListener('change', applyPersonalFilters);
    }

    function renderPersonalRows(expensesList) {
      if (expensesList.length === 0) {
        return `<tr><td colspan="7" style="text-align: center; padding: 40px; opacity: 0.6;">No expenses found</td></tr>`;
      }
      
      return expensesList.map((e, idx) => {
        const isEditing = window.editingPersonalIdx === idx;
        const originalIdx = expenses.findIndex(exp => exp.id === e.id);
        
        if (isEditing) {
          return `
            <tr style="background: var(--bg);">
              <td><input type="date" id="edit-personal-date-${idx}" value="${e.date}" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text);"></td>
              <td>
                <input type="text" id="edit-personal-desc-${idx}" value="${e.description || ''}" placeholder="Description" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text); margin-bottom: 8px;">
                <div>
                  <input type="file" id="edit-personal-files-${idx}" multiple accept="image" style="display: none;">
                  <button type="button" class="btn-small btn-change" onclick="document.getElementById('edit-personal-files-${idx}').click()">📎 Add Files</button>
                </div>
              </td>
              <td><input type="text" id="edit-personal-category-${idx}" value="${e.category || ''}" placeholder="Category" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text);"></td>
              <td>
                <select id="edit-personal-mode-${idx}" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text);">
                  <option value="Cash" ${e.mode === 'Cash' ? 'selected' : ''}>Cash</option>
                  <option value="Online" ${e.mode === 'Online' ? 'selected' : ''}>Online</option>
                  <option value="GPay" ${e.mode === 'GPay' ? 'selected' : ''}>GPay</option>
                  <option value="Card" ${e.mode === 'Card' ? 'selected' : ''}>Card</option>
                </select>
              </td>
              <td><input type="text" id="edit-personal-remarks-${idx}" value="${e.remarks || ''}" placeholder="Remarks" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text);"></td>
              <td><input type="number" step="0.01" id="edit-personal-amount-${idx}" value="${e.amount}" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text);"></td>
              <td>
                <button class="btn-small btn-change" onclick="savePersonalEdit(${originalIdx}, ${idx})">💾</button>
                <button class="btn-small btn-remove" onclick="cancelPersonalEdit()">✕</button>
              </td>
            </tr>
          `;
        }
        
        return `
          <tr>
            <td>${new Date(e.date).toLocaleDateString()}</td>
            <td>
              <div style="margin-bottom: 8px; font-weight: 500;">${e.description || 'N/A'}</div>
              ${e.attachments && e.attachments.length > 0 ? `
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                  ${e.attachments.map((att, attIdx) => `
                    <div style="position: relative; width: 60px; height: 60px; border: 2px solid var(--border); border-radius: 6px; overflow: hidden;">
                      <img src="${att}" alt="Attachment" style="width: 100%; height: 100%; object-fit: cover; cursor: pointer;" onclick="window.open('${att}', '_blank')">
                      <button onclick="removePersonalAttachment(${originalIdx}, ${attIdx})" style="position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border-radius: 50%; border: none; background: rgba(0,0,0,0.7); color: white; font-size: 11px; cursor: pointer; font-weight: 700;">✕</button>
                    </div>
                  `).join('')}
                </div>
              ` : '<small style="opacity: 0.5;">No attachments</small>'}
            </td>
            <td><span style="padding: 4px 10px; background: var(--bg); border-radius: 6px; font-size: 13px; font-weight: 600;">${e.category || 'N/A'}</span></td>
            <td><span style="padding: 4px 10px; background: var(--bg); border-radius: 6px; font-size: 13px; font-weight: 600;">${e.mode || 'N/A'}</span></td>
            <td>${e.remarks || 'N/A'}</td>
            <td style="font-weight: 700; color: var(--error); font-size: 16px;">-${formatCurrency(e.amount)}</td>
            <td>
              <button class="btn-small btn-change" onclick="editPersonalInline(${idx})">✏️</button>
              <button class="btn-small btn-remove" onclick="deleteExpense('${e.id}')">🗑️</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function applyPersonalFilters() {
      const search = document.getElementById('personal-search').value;
      const year = document.getElementById('personal-year-filter').value;
      const month = document.getElementById('personal-month-filter').value;
      const monthSelect = document.getElementById('personal-month-filter');
      
      if (year === 'all') {
        monthSelect.disabled = true;
        monthSelect.value = 'all';
      } else {
        monthSelect.disabled = false;
      }
      
      window.personalFilters = { search, year, month };
      renderPersonal(document.getElementById('main-content'));
    }

    window.editPersonalInline = function(idx) {
      window.editingPersonalIdx = idx;
      renderPersonal(document.getElementById('main-content'));
    };

    window.cancelPersonalEdit = function() {
      window.editingPersonalIdx = null;
      renderPersonal(document.getElementById('main-content'));
    };

    window.savePersonalEdit = function(originalIdx, displayIdx) {
      const date = document.getElementById(`edit-personal-date-${displayIdx}`).value;
      const description = document.getElementById(`edit-personal-desc-${displayIdx}`).value;
      const category = document.getElementById(`edit-personal-category-${displayIdx}`).value;
      const mode = document.getElementById(`edit-personal-mode-${displayIdx}`).value;
      const remarks = document.getElementById(`edit-personal-remarks-${displayIdx}`).value;
      const amount = document.getElementById(`edit-personal-amount-${displayIdx}`).value;
      const filesInput = document.getElementById(`edit-personal-files-${displayIdx}`);
      
      let attachments = expenses[originalIdx]?.attachments || [];
      if (filesInput && filesInput.files.length > 0) {
        Array.from(filesInput.files).forEach(file => {
          attachments.push(URL.createObjectURL(file));
        });
      }
      
      expenses[originalIdx] = {
        ...expenses[originalIdx],
        date,
        description,
        category,
        mode,
        remarks,
        amount: parseFloat(amount),
        attachments
      };
      
      mockDB.expenses = mockDB.expenses.map(e => e.id === expenses[originalIdx].id ? expenses[originalIdx] : e);
      saveToDB();
      window.editingPersonalIdx = null;
      showToast('Expense updated! ✅');
      renderPersonal(document.getElementById('main-content'));
    };

    window.removePersonalAttachment = function(expenseIdx, attIdx) {
      const modalHTML = `
        <div class="modal-overlay">
          <div class="modal" style="max-width: 400px;">
            <div class="modal-header">
              <h3 class="modal-title">Remove Attachment?</h3>
              <button type="button" class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <p style="margin-bottom: 24px;">Are you sure you want to remove this attachment?</p>
            <div style="display: flex; gap: 12px;">
              <button class="btn-primary" onclick="confirmRemovePersonalAttachment(${expenseIdx}, ${attIdx})" style="flex: 1; background: var(--error);">Yes, Remove</button>
              <button class="btn-secondary" onclick="closeModal()" style="flex: 1;">Cancel</button>
            </div>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHTML);
    };

    window.confirmRemovePersonalAttachment = function(expenseIdx, attIdx) {
      if (expenses[expenseIdx] && expenses[expenseIdx].attachments) {
        expenses[expenseIdx].attachments.splice(attIdx, 1);
        mockDB.expenses = mockDB.expenses.map(e => e.id === expenses[expenseIdx].id ? expenses[expenseIdx] : e);
        saveToDB();
        closeModal();
        showToast('Attachment removed');
        renderPersonal(document.getElementById('main-content'));
      }
    };

      Object.keys(groupedExpenses).sort().reverse().forEach(yearMonth => {
        const [year, month] = yearMonth.split('-');
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const monthName = monthNames[parseInt(month) - 1];
        const monthExpenses = groupedExpenses[yearMonth];
        const monthTotal = monthExpenses.reduce((sum, e) => sum + parseFloat(e.amount), 0);
        
        // Month header
        doc.setFillColor(231, 76, 60);
        doc.rect(14, yPos, 182, 8, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(12);
        doc.setFont(undefined, 'bold');
        doc.text(`${monthName} ${year} - Total: -${formatCurrency(monthTotal)}`, 16, yPos + 5);
        
        yPos += 12;
        
        // Table
        doc.autoTable({
          startY: yPos,
          head: [['Date', 'Description', 'Category', 'Mode', 'Amount']],
          body: monthExpenses.map(e => [
            new Date(e.date).toLocaleDateString(),
            e.description || 'N/A',
            e.category || 'N/A',
            e.mode || 'N/A',
            `-${formatCurrency(e.amount)}`
          ]),
          theme: 'grid',
          headStyles: { fillColor: [255, 140, 66] },
          margin: { left: 14, right: 14 }
        });
        
        yPos = doc.lastAutoTable.finalY + 10;
        
        // Check if need new page
        if (yPos > 270) {
          doc.addPage();
          yPos = 20;
        }
      });
      
      doc.save('splitera-personal-expenses.pdf');
      showToast('Personal Expenses PDF exported! 📄');
    };

    function renderCredits(content) {
      const selectedYear = window.creditsFilters?.year || 'all';
      const selectedMonth = window.creditsFilters?.month || 'all';
      const searchQuery = window.creditsFilters?.search || '';
      
      let filteredCredits = credits.slice();
      
      // Apply search
      if (searchQuery) {
        filteredCredits = filteredCredits.filter(c => {
          const searchStr = `${c.date} ${c.description || ''} ${c.source || ''} ${c.amount} ${c.mode || ''} ${c.remarks || ''}`.toLowerCase();
          return searchStr.includes(searchQuery.toLowerCase());
        });
      }
      
      // Apply year/month filters
      if (selectedYear !== 'all') {
        filteredCredits = filteredCredits.filter(c => new Date(c.date).getFullYear() === parseInt(selectedYear));
        if (selectedMonth !== 'all') {
          filteredCredits = filteredCredits.filter(c => new Date(c.date).getMonth() === parseInt(selectedMonth));
        }
      }
      
      // Sort by date descending
      filteredCredits.sort((a, b) => new Date(b.date) - new Date(a.date));
      
      // Group by year-month for all-time view
      const groupedCredits = {};
      if (selectedYear === 'all') {
        filteredCredits.forEach(c => {
          const date = new Date(c.date);
          const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
          if (!groupedCredits[key]) groupedCredits[key] = [];
          groupedCredits[key].push(c);
        });
      }
      
      const years = ['all', ...new Set(credits.map(c => new Date(c.date).getFullYear()))].sort((a, b) => {
        if (a === 'all') return -1;
        if (b === 'all') return 1;
        return b - a;
      });
      
      const months = [
        { value: 'all', label: 'All Time' },
        { value: '0', label: 'January' }, { value: '1', label: 'February' }, { value: '2', label: 'March' },
        { value: '3', label: 'April' }, { value: '4', label: 'May' }, { value: '5', label: 'June' },
        { value: '6', label: 'July' }, { value: '7', label: 'August' }, { value: '8', label: 'September' },
        { value: '9', label: 'October' }, { value: '10', label: 'November' }, { value: '11', label: 'December' }
      ];
      
      const totalAmount = filteredCredits.reduce((sum, c) => sum + parseFloat(c.amount), 0);
      
      content.innerHTML = `
        <div class="section">
          <div class="section-header">
            <h2 class="section-title">💰 Credit Balance</h2>
            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
              <button class="btn-secondary" onclick="addCredit()">➕ Add Credit</button>
              <button class="btn-secondary" onclick="exportCreditsPDF()">📄 Export PDF</button>
            </div>
          </div>
          
          <div style="padding: 20px; background: var(--success); color: white; border-radius: 12px; margin-bottom: 24px; text-align: center;">
            <div style="font-size: 16px; margin-bottom: 8px; opacity: 0.9;">Total Credits</div>
            <div style="font-size: 42px; font-weight: 800;">${formatCurrency(totalAmount)}</div>
          </div>
          
          <div style="display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap;">
            <input type="text" id="credits-search" placeholder="Search by date, amount, description, mode, remarks..." value="${searchQuery}" style="flex: 1; min-width: 200px; padding: 12px 16px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-weight: 500;">
            <select id="credits-year-filter" style="min-width: 140px; padding: 10px 14px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-weight: 500;">
              ${years.map(y => `<option value="${y}" ${selectedYear == y ? 'selected' : ''}>${y === 'all' ? 'All Time' : y}</option>`).join('')}
            </select>
            <select id="credits-month-filter" style="min-width: 140px; padding: 10px 14px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-weight: 500;" ${selectedYear === 'all' ? 'disabled' : ''}>
              ${months.map(m => `<option value="${m.value}" ${selectedMonth == m.value ? 'selected' : ''}>${m.label}</option>`).join('')}
            </select>
          </div>
          
          <div class="table-container">
            ${selectedYear === 'all' && Object.keys(groupedCredits).length > 0 ?
              Object.keys(groupedCredits).sort().reverse().map(yearMonth => {
                const [year, month] = yearMonth.split('-');
                const monthName = months.find(m => m.value === String(parseInt(month) - 1))?.label || month;
                const monthCredits = groupedCredits[yearMonth];
                const monthTotal = monthCredits.reduce((sum, c) => sum + parseFloat(c.amount), 0);
                
                return `
                  <h3 style="margin: 24px 0 16px 0; padding: 16px; background: var(--success); color: white; border-radius: 12px; font-size: 18px; display: flex; justify-content: space-between; align-items: center;">
                    <span>${monthName} ${year}</span>
                    <span>${formatCurrency(monthTotal)}</span>
                  </h3>
                  <table>
                    <thead>
                      <tr>
                        <th>Date</th>
                        <th>Description & Attachments</th>
                        <th>Source</th>
                        <th>Mode</th>
                        <th>Remarks</th>
                        <th>Amount</th>
                        <th>Actions</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${renderCreditRows(monthCredits)}
                    </tbody>
                  </table>
                `;
              }).join('')
            : `
              <table>
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Description & Attachments</th>
                    <th>Source</th>
                    <th>Mode</th>
                    <th>Remarks</th>
                    <th>Amount</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  ${renderCreditRows(filteredCredits)}
                </tbody>
              </table>
            `}
          </div>
        </div>
      `;
      
      document.getElementById('credits-search').addEventListener('input', applyCreditsFilters);
      document.getElementById('credits-year-filter').addEventListener('change', applyCreditsFilters);
      document.getElementById('credits-month-filter').addEventListener('change', applyCreditsFilters);
    }

    function renderCreditRows(creditsList) {
      if (creditsList.length === 0) {
        return `<tr><td colspan="7" style="text-align: center; padding: 40px; opacity: 0.6;">No credits found</td></tr>`;
      }
      
      return creditsList.map((c, idx) => {
        const isEditing = window.editingCreditIdx === idx;
        const originalIdx = credits.findIndex(cr => cr.id === c.id);
        
        if (isEditing) {
          return `
            <tr style="background: var(--bg);">
              <td><input type="date" id="edit-credit-date-${idx}" value="${c.date}" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text);"></td>
              <td>
                <input type="text" id="edit-credit-desc-${idx}" value="${c.description || c.source || ''}" placeholder="Description" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text); margin-bottom: 8px;">
                <div>
                  <input type="file" id="edit-credit-files-${idx}" multiple accept="image" style="display: none;">
                  <button type="button" class="btn-small btn-change" onclick="document.getElementById('edit-credit-files-${idx}').click()">📎 Add Files</button>
                </div>
              </td>
              <td><input type="text" id="edit-credit-source-${idx}" value="${c.source || ''}" placeholder="Source" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text);"></td>
              <td>
                <select id="edit-credit-mode-${idx}" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text);">
                  <option value="Cash" ${c.mode === 'Cash' ? 'selected' : ''}>Cash</option>
                  <option value="Online" ${c.mode === 'Online' ? 'selected' : ''}>Online</option>
                  <option value="GPay" ${c.mode === 'GPay' ? 'selected' : ''}>GPay</option>
                  <option value="Card" ${c.mode === 'Card' ? 'selected' : ''}>Card</option>
                </select>
              </td>
              <td><input type="text" id="edit-credit-remarks-${idx}" value="${c.remarks || ''}" placeholder="Remarks" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text);"></td>
              <td><input type="number" step="0.01" id="edit-credit-amount-${idx}" value="${c.amount}" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text);"></td>
              <td>
                <button class="btn-small btn-change" onclick="saveCreditEdit(${originalIdx}, ${idx})">💾</button>
                <button class="btn-small btn-remove" onclick="cancelCreditEdit()">✕</button>
              </td>
            </tr>
          `;
        }
        
        return `
          <tr>
            <td>${new Date(c.date).toLocaleDateString()}</td>
            <td>
              <div style="margin-bottom: 8px; font-weight: 500;">${c.description || c.source || 'N/A'}</div>
              ${c.attachments && c.attachments.length > 0 ? `
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                  ${c.attachments.map((att, attIdx) => `
                    <div style="position: relative; width: 60px; height: 60px; border: 2px solid var(--border); border-radius: 6px; overflow: hidden;">
                      <img src="${att}" alt="Attachment" style="width: 100%; height: 100%; object-fit: cover; cursor: pointer;" onclick="window.open('${att}', '_blank')">
                      <button onclick="removeCreditAttachment(${originalIdx}, ${attIdx})" style="position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border-radius: 50%; border: none; background: rgba(0,0,0,0.7); color: white; font-size: 11px; cursor: pointer; font-weight: 700;">✕</button>
                    </div>
                  `).join('')}
                </div>
              ` : '<small style="opacity: 0.5;">No attachments</small>'}
            </td>
            <td>${c.source || 'N/A'}</td>
            <td><span style="padding: 4px 10px; background: var(--bg); border-radius: 6px; font-size: 13px; font-weight: 600;">${c.mode || 'N/A'}</span></td>
            <td>${c.remarks || 'N/A'}</td>
            <td style="font-weight: 700; color: var(--success); font-size: 16px;">+${formatCurrency(c.amount)}</td>
            <td>
              <button class="btn-small btn-change" onclick="editCreditInline(${idx})">✏️</button>
              <button class="btn-small btn-remove" onclick="deleteCredit(${originalIdx})">🗑️</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function applyCreditsFilters() {
      const search = document.getElementById('credits-search').value;
      const year = document.getElementById('credits-year-filter').value;
      const month = document.getElementById('credits-month-filter').value;
      const monthSelect = document.getElementById('credits-month-filter');
      
      if (year === 'all') {
        monthSelect.disabled = true;
        monthSelect.value = 'all';
      } else {
        monthSelect.disabled = false;
      }
      
      window.creditsFilters = { search, year, month };
      renderCredits(document.getElementById('main-content'));
    }

    window.addCredit = function() {
      const modalHTML = `
        <div class="modal-overlay" onclick="if(event.target === this) closeModal()">
          <div class="modal">
            <div class="modal-header">
              <h3 class="modal-title">Add Credit</h3>
              <button type="button" class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <form id="add-credit-form">
              <div class="form-row">
                <div class="form-group">
                  <label>Date</label>
                  <input type="date" name="date" value="${new Date().toISOString().split('T')[0]}" required>
                </div>
                <div class="form-group">
                  <label>Amount</label>
                  <input type="number" step="0.01" name="amount" required>
                </div>
              </div>
              
              <div class="form-group">
                <label>Description</label>
                <input type="text" name="description" required>
              </div>
              
              <div class="form-group">
                <label>Source (optional)</label>
                <input type="text" name="source" placeholder="e.g., Salary, Freelance">
              </div>
              
              <div class="form-group">
                <label>Payment Mode</label>
                <select name="mode" required>
                  <option value="Cash">Cash</option>
                  <option value="Online">Online</option>
                  <option value="GPay">GPay</option>
                  <option value="Card">Card</option>
                </select>
              </div>
              
              <div class="form-group">
                <label>Remarks (optional)</label>
                <textarea name="remarks" rows="3"></textarea>
              </div>
              
              <div class="form-group">
                <label>Attachments (optional)</label>
                <input type="file" id="credit-files" multiple accept="image" style="padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text);">
                <div id="credit-preview" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin-top: 12px;"></div>
              </div>
              
              <button type="submit" class="btn-primary">Add Credit</button>
            </form>
          </div>
        </div>
      `;
      
      document.body.insertAdjacentHTML('beforeend', modalHTML);
      
      // File preview
      document.getElementById('credit-files').addEventListener('change', function(e) {
        const preview = document.getElementById('credit-preview');
        preview.innerHTML = '';
        Array.from(e.target.files).forEach((file, idx) => {
          const reader = new FileReader();
          reader.onload = function(event) {
            preview.innerHTML += `
              <div style="position: relative; aspect-ratio: 1; border: 2px solid var(--border); border-radius: 6px; overflow: hidden;">
                <img src="${event.target.result}" style="width: 100%; height: 100%; object-fit: cover;">
                <button type="button" onclick="removePreviewFile('credit-files', 'credit-preview', ${idx})" style="position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: none; background: rgba(0,0,0,0.7); color: white; font-size: 12px; cursor: pointer; font-weight: 700;">✕</button>
              </div>
            `;
          };
          reader.readAsDataURL(file);
        });
      });
      
      document.getElementById('add-credit-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const filesInput = document.getElementById('credit-files');
        
        let attachments = [];
        if (filesInput.files.length > 0) {
          Array.from(filesInput.files).forEach(file => {
            attachments.push(URL.createObjectURL(file));
          });
        }
        
        const newCredit = {
          id: Date.now().toString(),
          userId: currentUser.id,
          date: formData.get('date'),
          description: formData.get('description'),
          source: formData.get('source'),
          mode: formData.get('mode'),
          remarks: formData.get('remarks'),
          amount: parseFloat(formData.get('amount')),
          attachments: attachments,
          createdAt: new Date().toISOString()
        };
        
        credits.push(newCredit);
        mockDB.credits.push(newCredit);
        saveToDB();
        
        closeModal();
        showToast('Credit added successfully! 💰');
        renderCredits(document.getElementById('main-content'));
      });
    };

    window.editCreditInline = function(idx) {
      window.editingCreditIdx = idx;
      renderCredits(document.getElementById('main-content'));
    };

    window.cancelCreditEdit = function() {
      window.editingCreditIdx = null;
      renderCredits(document.getElementById('main-content'));
    };

    window.saveCreditEdit = function(originalIdx, displayIdx) {
      const date = document.getElementById(`edit-credit-date-${displayIdx}`).value;
      const description = document.getElementById(`edit-credit-desc-${displayIdx}`).value;
      const source = document.getElementById(`edit-credit-source-${displayIdx}`).value;
      const mode = document.getElementById(`edit-credit-mode-${displayIdx}`).value;
      const remarks = document.getElementById(`edit-credit-remarks-${displayIdx}`).value;
      const amount = document.getElementById(`edit-credit-amount-${displayIdx}`).value;
      const filesInput = document.getElementById(`edit-credit-files-${displayIdx}`);
      
      let attachments = credits[originalIdx]?.attachments || [];
      if (filesInput && filesInput.files.length > 0) {
        Array.from(filesInput.files).forEach(file => {
          attachments.push(URL.createObjectURL(file));
        });
      }
      
      credits[originalIdx] = {
        ...credits[originalIdx],
        date,
        description,
        source,
        mode,
        remarks,
        amount: parseFloat(amount),
        attachments
      };
      
      mockDB.credits = credits;
      saveToDB();
      window.editingCreditIdx = null;
      showToast('Credit updated! ✅');
      renderCredits(document.getElementById('main-content'));
    };

    window.removeCreditAttachment = function(creditIdx, attIdx) {
      const modalHTML = `
        <div class="modal-overlay">
          <div class="modal" style="max-width: 400px;">
            <div class="modal-header">
              <h3 class="modal-title">Remove Attachment?</h3>
              <button type="button" class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <p style="margin-bottom: 24px;">Are you sure you want to remove this attachment?</p>
            <div style="display: flex; gap: 12px;">
              <button class="btn-primary" onclick="confirmRemoveCreditAttachment(${creditIdx}, ${attIdx})" style="flex: 1; background: var(--error);">Yes, Remove</button>
              <button class="btn-secondary" onclick="closeModal()" style="flex: 1;">Cancel</button>
            </div>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHTML);
    };

    window.confirmRemoveCreditAttachment = function(creditIdx, attIdx) {
      if (credits[creditIdx] && credits[creditIdx].attachments) {
        credits[creditIdx].attachments.splice(attIdx, 1);
        mockDB.credits = credits;
        saveToDB();
        closeModal();
        showToast('Attachment removed');
        renderCredits(document.getElementById('main-content'));
      }
    };

    window.deleteCredit = function(idx) {
      const modalHTML = `
        <div class="modal-overlay">
          <div class="modal" style="max-width: 400px;">
            <div class="modal-header">
              <h3 class="modal-title">Delete Credit?</h3>
              <button type="button" class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <p style="margin-bottom: 24px;">Are you sure you want to delete this credit record?</p>
            <div style="display: flex; gap: 12px;">
              <button class="btn-primary" onclick="confirmDeleteCredit(${idx})" style="flex: 1; background: var(--error);">Yes, Delete</button>
              <button class="btn-secondary" onclick="closeModal()" style="flex: 1;">Cancel</button>
            </div>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHTML);
    };

    window.confirmDeleteCredit = function(idx) {

      mockDB.credits = credits;
      saveToDB();
      closeModal();
      showToast('Credit deleted');
      renderCredits(document.getElementById('main-content'));

      doc.setFontSize(10);
      doc.text(`Generated: ${new Date().toLocaleDateString()}`, 14, 32);

      const groupedCredits = {};
      credits.forEach(c => {
        const date = new Date(c.date);

        // Month header

        doc.setTextColor(255, 255, 255);
        doc.setFontSize(12);
        doc.setFont(undefined, 'bold');
        doc.text(`${monthName} ${year} - Total: ${formatCurrency(monthTotal)}`, 16, yPos + 5);
        
        yPos += 12;
        
        // Table
        doc.autoTable({
          startY: yPos,
          head: [['Date', 'Description', 'Mode', 'Amount']],
          body: monthCredits.map(c => [
            new Date(c.date).toLocaleDateString(),
            c.description || c.source || 'N/A',
            c.mode || 'N/A',

          ]),
          theme: 'grid',
          headStyles: { fillColor: [255, 140, 66] },

      });
      
      doc.save('splitera-credits.pdf');

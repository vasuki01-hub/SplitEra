        async function loadDashboardData() {
            // Check if data is still loading
            if (!dataState.isLoaded.credits || !dataState.isLoaded.personalExpenses || !dataState.isLoaded.groups) {
                showLoading();
                return;
            }
            hideLoading();

            try {
                const yearFilter = document.getElementById('dashboardYear')?.value || 'all';
                const monthFilter = document.getElementById('dashboardMonth')?.value || 'all';

                // Use data from global state
                let credits = [...dataState.credits];
                let personal = [...dataState.personalExpenses];
                const groups = dataState.groups;
                const groupExpenses = dataState.groupExpenses;

                // Apply filters
                credits = filterByYearMonth(credits, yearFilter, monthFilter);
                personal = filterByYearMonth(personal, yearFilter, monthFilter);

                const totalCredits = credits.reduce((sum, doc) => sum + doc.amount, 0);
                const totalPersonal = personal.reduce((sum, doc) => sum + doc.amount, 0);

                // Card specific calculations
                const totalCreditCardCredits = credits.filter(c => c.mode === 'Credit Card').reduce((sum, c) => sum + c.amount, 0);
                const totalCreditCardExpenses = personal.filter(e => e.mode === 'Credit Card').reduce((sum, e) => sum + e.amount, 0);
                const netCreditCardBalance = totalCreditCardCredits - totalCreditCardExpenses;

                // Calculate user's share of group expenses
                let totalGroupShare = 0;
                if (groups.length > 0) {
                    let filteredGroupExpenses = filterByYearMonth(groupExpenses, yearFilter, monthFilter);

                    // Calculate user's share for each group expense
                    for (const expense of filteredGroupExpenses) {
                        // Get group members
                        const group = groups.find(g => g.id === expense.groupId);
                        if (group) {
                            const allMembers = [...(group.members || []), ...(group.guestMembers || []).map(name => `guest:${name}`)];
                            const memberMap = allMembers.reduce((acc, m) => {
                                acc[m] = m.startsWith('guest:') ? { firstName: m.split(':')[1], isGuest: true } : { firstName: m };
                                return acc;
                            }, {});

                            const breakdowns = calculateExpenseBreakdown([expense], allMembers, memberMap);
                            const breakdown = breakdowns[expense.id];
                            if (breakdown?.contributions?.[currentUser.uid]) {
                                totalGroupShare += breakdown.contributions[currentUser.uid];
                            }
                        }
                    }
                }
                const netBalance = totalCredits - totalPersonal - totalGroupShare;

                // Render stats
                const statsGrid = document.getElementById('statsGrid');
                statsGrid.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-icon ${netBalance >= 0 ? 'green' : 'red'}">
                            <i class="fas fa-${netBalance >= 0 ? 'arrow-up' : 'arrow-down'}"></i>
                        </div>
                        <div class="stat-content">
                            <div class="stat-label">${t('netBalance')}</div>
                            <div class="stat-value" style="color: ${netBalance >= 0 ? 'var(--success)' : 'var(--danger)'}">
                                ${formatCurrency(netBalance)}
                            </div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green">
                            <i class="fas fa-plus-circle"></i>
                        </div>
                        <div class="stat-content">
                            <div class="stat-label">${t('totalCredits')}</div>
                            <div class="stat-value">${formatCurrency(totalCredits)}</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon red">
                            <i class="fas fa-minus-circle"></i>
                        </div>
                        <div class="stat-content">
                            <div class="stat-label">${t('personalExpenses')}</div>
                            <div class="stat-value">${formatCurrency(totalPersonal)}</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon blue">
                            <i class="fas fa-users"></i>
                        </div>
                        <div class="stat-content">
                            <div class="stat-label">${t('groupExpenses')}</div>
                            <div class="stat-value">${formatCurrency(totalGroupShare)}
                                </div>
                        </div>
                    </div>
                    <!-- New Card Banners -->
                    <div class="stat-card">
                        <div class="stat-icon ${netCreditCardBalance >= 0 ? 'green' : 'red'}">
                            <i class="fas fa-credit-card"></i>
                        </div>
                        <div class="stat-content">
                            <div class="stat-label">${t('netCreditCardBalance')}</div>
                            <div class="stat-value" style="color: ${netCreditCardBalance >= 0 ? 'var(--success)' : 'var(--danger)'}">
                                ${formatCurrency(netCreditCardBalance)}
                            </div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon green">
                            <i class="fas fa-hand-holding-usd"></i>
                        </div>
                        <div class="stat-content">
                            <div class="stat-label">${t('totalCreditCardCredits')}</div>
                            <div class="stat-value">${formatCurrency(totalCreditCardCredits)}</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon red">
                            <i class="fas fa-shopping-cart"></i>
                        </div>
                        <div class="stat-content">
                            <div class="stat-label">${t('totalCreditCardExpenses')}</div>
                            <div class="stat-value">${formatCurrency(totalCreditCardExpenses)}</div>
                        </div>
                    </div>
                `;



                // Render chart
                const ctx = document.getElementById('dashboardChart');
                if (ctx) {
                    // Destroy existing chart if it exists
                    const existingChart = Chart.getChart(ctx);
                    if (existingChart) {
                        existingChart.destroy();
                    }

                    // Create gradients for 3D look
                    const ctxCanvas = ctx.getContext('2d');
                    const gradient1 = ctxCanvas.createLinearGradient(0, 0, 0, 400);
                    gradient1.addColorStop(0, '#10B981');
                    gradient1.addColorStop(1, '#064E3B');

                    const gradient2 = ctxCanvas.createLinearGradient(0, 0, 0, 400);
                    gradient2.addColorStop(0, '#EF4444');
                    gradient2.addColorStop(1, '#7F1D1D');

                    const gradient3 = ctxCanvas.createLinearGradient(0, 0, 0, 400);
                    gradient3.addColorStop(0, '#3B82F6');
                    gradient3.addColorStop(1, '#1E3A8A');

                    new Chart(ctx.getContext('2d'), {
                        type: 'doughnut',
                        data: {
                            labels: [t('totalCredits'), t('personalExpenses'), t('groupExpenses')],
                            datasets: [{
                                data: [totalCredits, totalPersonal, totalGroupShare],
                                backgroundColor: [gradient1, gradient2, gradient3],
                                hoverBackgroundColor: ['#10B981', '#EF4444', '#3B82F6'],
                                borderWidth: 0,
                                hoverOffset: 30,
                                borderRadius: 15,
                                spacing: 10
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            cutout: '70%',
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: {
                                        padding: 25,
                                        usePointStyle: true,
                                        pointStyle: 'circle',
                                        font: {
                                            size: 14,
                                            weight: '600',
                                            family: "'Inter', 'Segoe UI', sans-serif"
                                        },
                                        color: 'var(--text-dark)'
                                    }
                                },
                                tooltip: {
                                    enabled: true,
                                    backgroundColor: 'rgba(31, 41, 55, 0.95)',
                                    titleFont: { size: 16, weight: '700' },
                                    bodyFont: { size: 14 },
                                    padding: 15,
                                    cornerRadius: 12,
                                    displayColors: true,
                                    boxPadding: 8,
                                    callbacks: {
                                        label: function (context) {
                                            const label = context.label || '';
                                            const value = context.raw || 0;
                                            const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                            const percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                                            return ` ${label}: ${formatCurrency(value)} (${percentage}%)`;
                                        }
                                    }
                                }
                            },
                            animation: {
                                animateScale: true,
                                animateRotate: true,
                                duration: 1800,
                                easing: 'easeOutQuart'
                            },
                            layout: {
                                padding: 20
                            }
                        }
                    });
                }
            } catch (error) {
                showToast('Error', error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        // Export Dashboard PDF
        async function exportDashboardPDF() {
            showLoading();
            try {
                // Get current language from settings
                const currentLang = localStorage.getItem('language') || currentLanguage || 'en';
                const t = (key) => translations[currentLang]?.[key] || translations['en'][key] || key;

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                const yearFilter = document.getElementById('dashboardYear')?.value || 'all';
                const monthFilter = document.getElementById('dashboardMonth')?.value || 'all';

                // Load data
                const [creditsSnapshot, personalSnapshot, groupsSnapshot] = await Promise.all([
                    db.collection('credits').where('userId', '==', currentUser.uid).get(),
                    db.collection('personal_expenses').where('userId', '==', currentUser.uid).get(),
                    db.collection('groups').where('members', 'array-contains', currentUser.uid).get()
                ]);

                let credits = creditsSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                let personal = personalSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                credits = filterByYearMonth(credits, yearFilter, monthFilter);
                personal = filterByYearMonth(personal, yearFilter, monthFilter);

                // Header with saffron color
                doc.setFillColor(255, 153, 51);
                doc.rect(0, 0, 210, 30, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(20);
                doc.text(`${t('dashboardReport')}`, 105, 15, { align: 'center' });
                doc.setFontSize(12);
                doc.text(`${t('generated')}: ${new Date().toLocaleDateString()}`, 105, 23, { align: 'center' });
                doc.setTextColor(0, 0, 0);
                let yPos = 40;

                // Summary
                const totalCredits = credits.reduce((sum, c) => sum + (parseFloat(c.amount) || 0), 0);
                const totalPersonal = personal.reduce((sum, p) => sum + (parseFloat(p.amount) || 0), 0);

                // Credit Card specific calculations
                const totalCreditCardCredits = credits.filter(c => c.mode === 'Credit Card').reduce((sum, c) => sum + (parseFloat(c.amount) || 0), 0);
                const totalCreditCardExpenses = personal.filter(e => e.mode === 'Credit Card').reduce((sum, e) => sum + (parseFloat(e.amount) || 0), 0);
                const netCreditCardBalance = totalCreditCardCredits - totalCreditCardExpenses;

                // Calculate user's share of group expenses
                let totalGroupShare = 0;
                let groupsData = [];
                if (groupsSnapshot.docs.length > 0) {
                    const groupIds = groupsSnapshot.docs.map(doc => doc.id);
                    const groupExpensesSnapshot = await db.collection('group_expenses')
                        .where('groupId', 'in', groupIds.slice(0, 10)) // Firestore 'in' limit is 10
                        .get();

                    groupsData = groupExpensesSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    groupsData = filterByYearMonth(groupsData, yearFilter, monthFilter);

                    // Calculate user's share for each group expense
                    for (const expense of groupsData) {
                        // Get group members
                        const groupDoc = groupsSnapshot.docs.find(g => g.id === expense.groupId);
                        if (groupDoc) {
                            const group = groupDoc.data();
                            const allMembers = [...(group.members || []), ...(group.guestMembers || []).map(name => `guest:${name}`)];
                            const memberMap = allMembers.reduce((acc, m) => {
                                acc[m] = m.startsWith('guest:') ? { firstName: m.split(':')[1], isGuest: true } : { firstName: m };
                                return acc;
                            }, {});

                            const breakdowns = calculateExpenseBreakdown([expense], allMembers, memberMap);
                            const breakdown = breakdowns[expense.id];
                            const userShare = breakdown?.contributions?.[currentUser.uid] || 0;
                            expense.userShareAmount = userShare; // store for PDF table rows
                            totalGroupShare += userShare;
                        }
                    }
                }
                const netBalance = totalCredits - totalPersonal - totalGroupShare;

                doc.setFontSize(14);
                doc.text(t('summary'), 14, yPos);
                yPos += 10;

                doc.setFontSize(10);
                doc.text(`${t('totalCredits')}: ${formatCurrency(totalCredits, true)}`, 14, yPos);
                yPos += 7;
                doc.text(`${t('personalExpenses')}: ${formatCurrency(totalPersonal, true)}`, 14, yPos);
                yPos += 7;
                doc.text(`${t('groupExpenses')}: ${formatCurrency(totalGroupShare, true)}`, 14, yPos);
                yPos += 7;
                doc.text(`${t('netBalance')}: ${formatCurrency(netBalance, true)}`, 14, yPos);
                yPos += 10;

                // Credit Card Summary
                doc.text(`${t('netCreditCardBalance')}: ${formatCurrency(netCreditCardBalance, true)}`, 14, yPos);
                yPos += 7;
                doc.text(`${t('totalCreditCardCredits')}: ${formatCurrency(totalCreditCardCredits, true)}`, 14, yPos);
                yPos += 7;
                doc.text(`${t('totalCreditCardExpenses')}: ${formatCurrency(totalCreditCardExpenses, true)}`, 14, yPos);
                yPos += 15;

                // Group by month
                const allData = [
                    ...credits.map(c => ({ ...c, type: t('creditBalance'), originalType: 'Credit' })),
                    ...personal.map(p => ({ ...p, type: t('personal'), originalType: 'Personal' })),
                    // For group expenses in the dashboard PDF, show ONLY the current user's share (to match dashboard UI)
                    ...groupsData.map(g => ({ ...g, amount: parseFloat(g.userShareAmount || 0), type: t('groups'), originalType: 'Group' }))
                ].sort((a, b) => safeDateMillis(b.date) - safeDateMillis(a.date));

                const grouped = groupByMonth(allData);

                Object.keys(grouped).sort().reverse().forEach(monthKey => {
                    const [year, month] = monthKey.split('-');
                    const monthName = getMonthName(parseInt(month) - 1);

                    if (yPos > 250) {
                        doc.addPage();
                        yPos = 20;
                    }

                    doc.setFontSize(12);
                    doc.setFont(undefined, 'bold');
                    doc.text(`${monthName} ${year}`, 14, yPos);
                    doc.setFont(undefined, 'normal');
                    yPos += 7;

                    let monthTotal = 0;
                    const tableData = grouped[monthKey].map(item => {
                        const amt = parseFloat(item.amount) || 0;
                        // Determine if it's a credit or expense for balance calculation
                        // Note: item.type was set to localized strings above, so we should check against translated values or better, use original type
                        // Let's use item.originalType if we can, or just re-match.
                        // Actually, I should have kept originalType.
                        const isCredit = item.originalType === 'Credit';
                        if (isCredit) monthTotal += amt;
                        else monthTotal -= amt;

                        return [
                            safeDate(item.date).toLocaleDateString(),
                            item.description,
                            item.type,
                            `${isCredit ? '+' : '-'}${formatCurrency(amt, true)}`
                        ];
                    });

                    // Add Total Row
                    tableData.push([
                        { content: t('monthTotal'), colSpan: 3, styles: { fontStyle: 'bold', halign: 'right' } },
                        { content: `${monthTotal >= 0 ? '+' : ''}${formatCurrency(monthTotal, true)}`, styles: { fontStyle: 'bold', textColor: monthTotal >= 0 ? [16, 185, 129] : [239, 68, 68] } }
                    ]);

                    doc.autoTable({
                        startY: yPos,
                        head: [[t('date'), t('description'), t('type'), t('amount')]],
                        body: tableData,
                        theme: 'grid',
                        headStyles: { fillColor: [255, 153, 51], lineWidth: 0.1, lineColor: [200, 200, 200] },
                        styles: { lineWidth: 0.1, lineColor: [200, 200, 200] },
                        columnStyles: {
                            3: { fontStyle: 'bold', halign: 'right' }
                        },
                        margin: { left: 14, right: 14 }
                    });

                    yPos = doc.lastAutoTable.finalY + 15;
                });

                doc.save(`dashboard-report-${Date.now()}.pdf`);
                showToast('Success', 'PDF exported successfully!');
            } catch (error) {
                showToast('Error', 'Failed to export PDF: ' + error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        // Enhanced Excel export helper with month grouping, colored headers, and monthly totals
        function exportToExcelEnhanced(data, fileName, sheetName = 'Sheet1', options = {}) {
            const {
                includeMonthGrouping = true,
                includeMonthlySummary = true,
                currencySymbol = getCurrencySymbol()
            } = options;

            if (!data || data.length === 0) {
                const emptyWorksheet = XLSX.utils.aoa_to_sheet([['No data available']]);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, emptyWorksheet, sheetName);
                XLSX.writeFile(workbook, `${fileName}.xlsx`);
                return;
            }

            // Get column headers from first data object
            const headers = Object.keys(data[0]);

            // Create workbook and prepare data rows
            const workbook = XLSX.utils.book_new();
            const worksheetData = [];

            if (includeMonthGrouping) {
                // Group data by month/year
                const groupedData = {};
                data.forEach(item => {
                    const dateStr = item[headers.find(h => h.toLowerCase().includes('date') || h === 'Date')] || '';
                    const date = new Date(dateStr);
                    if (!isNaN(date.getTime())) {
                        const monthKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                        if (!groupedData[monthKey]) {
                            groupedData[monthKey] = [];
                        }
                        groupedData[monthKey].push(item);
                    } else {
                        // If no valid date, put in "Others" group
                        if (!groupedData['Others']) {
                            groupedData['Others'] = [];
                        }
                        groupedData['Others'].push(item);
                    }
                });

                // Sort months in descending order
                const sortedMonths = Object.keys(groupedData).filter(k => k !== 'Others').sort().reverse();
                if (groupedData['Others']) sortedMonths.push('Others');

                // Process each month group
                sortedMonths.forEach((monthKey, groupIndex) => {
                    const monthData = groupedData[monthKey];

                    // Add month header
                    if (monthKey !== 'Others') {
                        const [year, month] = monthKey.split('-');
                        const monthName = getMonthName(parseInt(month) - 1);
                        worksheetData.push([`${monthName} ${year}`]);
                    } else {
                        worksheetData.push(['Other Transactions']);
                    }

                    // Add column headers
                    worksheetData.push(headers);

                    // Add data rows with formatted currency
                    let monthTotal = 0;
                    const amountCols = options.amountColumns || [];

                    monthData.forEach(row => {
                        const rowData = headers.map(header => {
                            const value = row[header];
                            // Check if this is an amount column
                            const isAmountCol = amountCols.includes(header) ||
                                header.toLowerCase().includes('amount') ||
                                header.toLowerCase().includes('balance');

                            if (isAmountCol) {
                                const numValue = parseFloat(value) || 0;
                                monthTotal += numValue;
                                // Format with currency symbol
                                return `${currencySymbol}${Math.abs(numValue).toFixed(2)}${numValue < 0 ? ' (-)' : ''}`;
                            }
                            return value;
                        });
                        worksheetData.push(rowData);
                    });

                    // Add monthly total row if enabled
                    if (includeMonthlySummary && monthData.length > 0) {
                        const totalRow = headers.map((header, idx) => {
                            const isAmountCol = amountCols.includes(header) ||
                                header.toLowerCase().includes('amount') ||
                                header.toLowerCase().includes('balance');

                            if (isAmountCol) {
                                return `Total: ${currencySymbol}${Math.abs(monthTotal).toFixed(2)}${monthTotal < 0 ? ' (-)' : ''}`;
                            }
                            return idx === 0 ? 'Month Total' : '';
                        });
                        worksheetData.push(totalRow);
                    }

                    // Add blank row between months
                    worksheetData.push([]);
                });
            } else {
                // Simple export without grouping
                const amountCols = options.amountColumns || [];
                worksheetData.push(headers);
                data.forEach(row => {
                    const rowData = headers.map(header => {
                        const value = row[header];
                        const isAmountCol = amountCols.includes(header) ||
                            header.toLowerCase().includes('amount') ||
                            header.toLowerCase().includes('balance');

                        if (isAmountCol) {
                            const numValue = parseFloat(value) || 0;
                            return `${currencySymbol}${Math.abs(numValue).toFixed(2)}${numValue < 0 ? ' (-)' : ''}`;
                        }
                        return value;
                    });
                    worksheetData.push(rowData);
                });
            }

            // Create worksheet from array of arrays
            const worksheet = XLSX.utils.aoa_to_sheet(worksheetData);

            // Apply styling (note: basic XLSX library has limited styling, but we can set column widths)
            const colWidths = headers.map(h => ({ wch: Math.max(h.length + 2, 15) }));
            worksheet['!cols'] = colWidths;

            // Add worksheet to workbook
            XLSX.utils.book_append_sheet(workbook, worksheet, sheetName);

            // Save file
            XLSX.writeFile(workbook, `${fileName}.xlsx`);
        }

        // Helper function to get currency symbol
        function getCurrencySymbol() {
            const currencyMap = {
                'USD': '$',
                'EUR': '€',
                'GBP': '£',
                'INR': '₹',
                'JPY': '¥',
                'CNY': '¥',
                'AUD': 'A$',
                'CAD': 'C$'
            };

            // Get currency from user settings or default to INR
            const userCurrency = localStorage.getItem('currency') || 'INR';
            return currencyMap[userCurrency] || '₹';
        }

        // Legacy function for backward compatibility
        function exportToExcel(data, fileName, sheetName = 'Sheet1') {
            exportToExcelEnhanced(data, fileName, sheetName, { includeMonthGrouping: false, includeMonthlySummary: false });
        }

        /**
 * Renders the calendar page structure in the main content area.

        async function renderCalendar() {
            const content = document.getElementById('mainContent');

            content.innerHTML = `
        <div class="page-header">
            <div>
                <h1 class="page-title">${t('calendar')}</h1>
                <p class="page-subtitle">${t('viewFinancialActivitiesByDate')}</p>
            </div>
        </div>
        
        <div id="calendarContainer" class="calendar-all-time">
            <!-- Calendar months will be rendered here -->
        </div>
    `;

            await loadCalendarData();
        }

        /**
         * Loads and processes financial data for the calendar, including credits, personal expenses, and group expenses.
         * Groups data by date, calculates user shares for group expenses, and renders the calendar months.
         */
        async function loadCalendarData() {
            if (!dataState.isLoaded.credits || !dataState.isLoaded.personalExpenses || !dataState.isLoaded.groups) {
                showLoading();
                return;
            }
            hideLoading();

            try {
                const credits = [...dataState.credits];
                const personal = [...dataState.personalExpenses];
                const groupExpenses = [...dataState.groupExpenses];
                const groups = dataState.groups;

                // Group by date
                const dateMap = {};

                credits.forEach(item => {
                    const dateKey = item.date.toDate().toDateString();
                    if (!dateMap[dateKey]) dateMap[dateKey] = { credits: 0, personal: 0, groupShare: 0, items: [] };
                    dateMap[dateKey].credits += parseFloat(item.amount) || 0;
                    dateMap[dateKey].items.push({ ...item, type: 'credit' });
                });

                personal.forEach(item => {
                    const dateKey = item.date.toDate().toDateString();
                    if (!dateMap[dateKey]) dateMap[dateKey] = { credits: 0, personal: 0, groupShare: 0, items: [] };
                    dateMap[dateKey].personal += parseFloat(item.amount) || 0;
                    dateMap[dateKey].items.push({ ...item, type: 'personal' });
                });

                // Calculate user's share for each group expense
                for (const expense of groupExpenses) {
                    const group = groups.find(g => g.id === expense.groupId);
                    if (group) {
                        const allMembers = [...(group.members || []), ...(group.guestMembers || []).map(name => `guest:${name}`)];
                        const memberMap = allMembers.reduce((acc, m) => {
                            acc[m] = m.startsWith('guest:') ? { firstName: m.split(':')[1], isGuest: true } : { firstName: m };
                            return acc;
                        }, {});

                        const breakdowns = calculateExpenseBreakdown([expense], allMembers, memberMap);
                        const breakdown = breakdowns[expense.id];
                        const payerId = expense.paidBy || expense.userId;
                        let userShare = breakdown?.contributions?.[currentUser.uid] || 0;

                        // Fallback: If share is 0 but user is a member, try simple division for old/migrated data
                        if (userShare === 0 && (!expense.splits || Object.keys(expense.splits).length === 0) && group.members.includes(currentUser.uid)) {
                            userShare = parseFloat(expense.amount) / allMembers.length;
                        }

                        // Expense Visibility Rules for Non-Payer Members
                        const isPayer = payerId === currentUser.uid;
                        let isSettledForCurrentUser = true; // Assume settled if not a non-payer or no share

                        if (!isPayer && userShare > 0) {
                            // For non-payer, check if their share is settled
                            const remainingBalanceForUser = breakdown?.remainingBalances?.[currentUser.uid] || -userShare; // Fix: Use -userShare if no breakdown (assume unsettled for old data)
                            isSettledForCurrentUser = Math.abs(remainingBalanceForUser) < 0.01;
                        }

                        // Only add to calendar if current user is payer, or is non-payer AND settled
                        if (isPayer || (userShare > 0 && isSettledForCurrentUser)) {
                            const dateKey = expense.date.toDate().toDateString();
                            if (!dateMap[dateKey]) dateMap[dateKey] = { credits: 0, personal: 0, groupShare: 0, items: [] };
                            // Removed duplicate addition and temporary fix (assuming data issue resolved; remove if unnecessary)
                            dateMap[dateKey].groupShare += userShare;
                            dateMap[dateKey].items.push({ ...expense, type: 'group', userShare });
                        }
                    }
                }

                // Render calendar months
                const container = document.getElementById('calendarContainer');
                const months = {};

                Object.keys(dateMap).forEach(dateKey => {
                    const date = new Date(dateKey);
                    const monthKey = `${date.getFullYear()}-${date.getMonth()}`;
                    if (!months[monthKey]) months[monthKey] = [];
                    months[monthKey].push({ date, ...dateMap[dateKey] });
                });

                // Render each month
                let html = '';
                Object.keys(months).sort().reverse().forEach(monthKey => {
                    const [year, month] = monthKey.split('-');
                    const monthName = getMonthName(parseInt(month));
                    const firstDay = new Date(year, month, 1);
                    const lastDay = new Date(year, parseInt(month) + 1, 0);
                    const startDay = firstDay.getDay();

                    html += `
                <div class="calendar-month">
                    <h3 class="calendar-month-title">${monthName} ${year}</h3>
                    <div class="calendar-grid">
                        <div class="calendar-header">${t('sunday')}</div>
                        <div class="calendar-header">${t('monday')}</div>
                        <div class="calendar-header">${t('tuesday')}</div>
                        <div class="calendar-header">${t('wednesday')}</div>
                        <div class="calendar-header">${t('thursday')}</div>
                        <div class="calendar-header">${t('friday')}</div>
                        <div class="calendar-header">${t('saturday')}</div>
            `;

                    // Empty cells before first day
                    for (let i = 0; i < startDay; i++) {
                        html += '<div class="calendar-day empty"></div>';
                    }

                    // Render each day
                    for (let day = 1; day <= lastDay.getDate(); day++) {
                        const currentDate = new Date(year, month, day);
                        const dateKey = currentDate.toDateString();
                        const dayData = dateMap[dateKey];

                        if (dayData) {
                            // Calculate daily total: Credits - Personal - Group Share (YOUR SHARE)
                            const dailyTotal = dayData.credits - dayData.personal - dayData.groupShare;
                            const itemCount = dayData.items.length;

                            html += `
                        <div class="calendar-day has-data" onclick="showDayDetails('${dateKey}')">
                            <div class="calendar-day-number">${day}</div>
                            <div class="calendar-day-info">
                                <div class="calendar-day-amount" style="color: ${dailyTotal >= 0 ? 'var(--success)' : 'var(--danger)'}">
                                    ${formatCurrency(dailyTotal)}

        async function loadDetailsData() {
            if (!dataState.isLoaded.credits || !dataState.isLoaded.personalExpenses || !dataState.isLoaded.groups) {
                showLoading();
                return;
            }
            hideLoading();

            try {
                const searchTerm = document.getElementById('detailsSearch')?.value || '';
                const sectionFilter = document.getElementById('detailsSection')?.value || 'all';

                const allTransactions = [];

                // Add credits
                if (sectionFilter === 'all' || sectionFilter === 'credits') {
                    dataState.credits.forEach(credit => {
                        allTransactions.push({
                            id: credit.id,
                            date: credit.date,
                            description: credit.description,
                            amount: credit.amount,
                            section: t('creditBalance'),
                            type: 'credit',
                            color: 'var(--success)'
                        });
                    });
                }

                // Add personal expenses
                if (sectionFilter === 'all' || sectionFilter === 'personal') {
                    dataState.personalExpenses.forEach(expense => {
                        allTransactions.push({
                            id: expense.id,
                            date: expense.date,
                            description: expense.description,
                            amount: expense.amount,
                            section: t('personal'),
                            type: 'personal',
                            color: 'var(--danger)'
                        });
                    });
                }

                // Add group expenses (with user's share)
                if (sectionFilter === 'all' || sectionFilter === 'groups') {
                    const groups = dataState.groups;
                    if (groups.length > 0) {
                        const groupExpenses = dataState.groupExpenses;

                        for (const expense of groupExpenses) {
                            const group = groups.find(g => g.id === expense.groupId);

                            if (group) {
                                const allMembers = [...(group.members || []), ...(group.guestMembers || []).map(name => `guest:${name}`)];
                                const memberMap = allMembers.reduce((acc, m) => {
                                    acc[m] = m.startsWith('guest:') ? { firstName: m.split(':')[1], isGuest: true } : { firstName: m };
                                    return acc;
                                }, {});

                                const breakdowns = calculateExpenseBreakdown([expense], allMembers, memberMap);
                                const breakdown = breakdowns[expense.id];
                                const payerId = expense.paidBy || expense.userId; // Get payer for this expense
                                let userShare = breakdown?.contributions?.[currentUser.uid] || 0;

                                // Fallback for 0 share
                                if (userShare === 0 && (!expense.splits || Object.keys(expense.splits).length === 0) && group.members.includes(currentUser.uid)) {
                                    userShare = parseFloat(expense.amount) / allMembers.length;
                                }

                                // Expense Visibility Rules for Non-Payer Members (same logic as calendar)
                                const isPayer = payerId === currentUser.uid;
                                let isSettledForCurrentUser = true; // Assume settled if not a non-payer or no share

                                if (!isPayer && userShare > 0) {
                                    const remainingBalanceForUser = breakdown?.remainingBalances?.[currentUser.uid] || userShare;
                                    isSettledForCurrentUser = Math.abs(remainingBalanceForUser) < 0.01;
                                }

                                // Only add to transactions if current user is payer, or is non-payer AND settled
                                if (isPayer || (userShare > 0 && isSettledForCurrentUser)) {
                                    allTransactions.push({
                                        id: expense.id,
                                        date: expense.date,
                                        description: expense.description,
                                        amount: userShare, // Show user's share, not total amount
                                        fullAmount: expense.amount,
                                        section: `${t('groups')} - ${group.name}`,
                                        type: 'group',
                                        color: 'var(--danger)'
                                    });
                                }
                            }
                        }
                    }
                }

                // Apply search filter
                let filtered = allTransactions;
                if (searchTerm) {
                    filtered = allTransactions.filter(t =>
                        t.description.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        t.section.toLowerCase().includes(searchTerm.toLowerCase())
                    );
                }

                // Sort by date descending
                filtered.sort((a, b) => safeDateMillis(b.date) - safeDateMillis(a.date));

                // Render table
                const container = document.getElementById('detailsTableContainer');
                if (filtered.length === 0) {
                    container.innerHTML = '<p style="text-align: center; padding: 2rem;">No transactions found</p>';
                } else {
                    container.innerHTML = `
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>${t('date')}</th>
                                    <th>${t('description')}</th>
                                    <th>${t('section')}</th>
                                    <th style="text-align: right">${t('amount')}</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${filtered.map(item => `
                                    <tr>
                                        <td>${item.date.toDate().toLocaleDateString()}</td>
                                        <td>${item.description}</td>
                                        <td>${item.section}</td>
                                        <td style="text-align: right; color: ${item.color}; font-weight: 600">
                                            ${item.type === 'credit' ? '+' : '-'}${formatCurrency(item.amount)}
                                            ${item.type === 'group' ? `<br><small style="color: var(--text-gray); font-weight: normal">${t('yourShare')}</small>` : ''}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                }

            } catch (error) {
                showToast('Error', error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        async function loadCredits() {
            if (!dataState.isLoaded.credits) {
                showLoading();
                return;
            }
            hideLoading();

            try {
                let credits = [...dataState.credits];

                // Apply filters
                const searchTerm = document.getElementById('creditsSearch')?.value || '';
                if (searchTerm) {
                    credits = filterBySearch(credits, searchTerm, ['description', 'source', 'mode', 'remarks', 'amount']);
                }

                const filterYear = document.getElementById('creditsYear')?.value || 'all';
                const filterMonth = document.getElementById('creditsMonth')?.value || 'all';

                credits = filterByYearMonth(credits, filterYear, filterMonth);
                credits.sort((a, b) => safeDateMillis(b.date) - safeDateMillis(a.date));

                // Calculate totals
                const totalAmount = credits.reduce((sum, c) => sum + (parseFloat(c.amount) || 0), 0);
                document.getElementById('totalCreditsAmount').textContent = formatCurrency(totalAmount);

                const container = document.getElementById('creditsTableContainer');

                if (credits.length === 0) {
                    container.innerHTML = `

                            <div class="empty-title">${t('noCreditsFound')}</div>
                            <div class="empty-message">${t('addCreditPrompt')}</div>

                    let html = '';

        function renderCreditNewAttachments() {

                            <i class="fas fa-times"></i>
                        </button>
                    `;
                    preview.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
        }

            window.uploadedFiles.splice(index, 1);

        async function saveCredit() {
            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

            try {
                const creditData = {
                    userId: currentUser.uid,
                    date: firebase.firestore.Timestamp.fromDate(new Date(document.getElementById('creditDate').value)),
                    description: document.getElementById('creditDescription').value,
                    source: document.getElementById('creditSource').value,
                    mode: document.getElementById('creditMode').value,
                    amount: parseFloat(document.getElementById('creditAmount').value),
                    remarks: document.getElementById('creditRemarks').value,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                const files = window.uploadedFiles;
                const attachments = [];

                for (let file of files) {
                    const ref = storage.ref(`credits/${currentUser.uid}/${Date.now()}_${file.name}`);
                    await ref.put(file);
                    const url = await ref.getDownloadURL();
                    attachments.push(url);
                }

                creditData.attachments = attachments;

                await db.collection('credits').add(creditData);
                window.uploadedFiles = []; // Clear queue
                document.querySelector('.modal-overlay').remove();
                await loadCredits();
                showToast('Success', 'Credit added successfully!');
            } catch (error) {
                showToast('Error', error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-save"></i> ${t('save')}`;
            }
        }

                editingRowId = id;
                const row = document.getElementById(`credit-row-${id}`);
                row.classList.add('editing');

                const date = credit.date.toDate().toISOString().split('T')[0];

                row.innerHTML = `
                    <td><input type="date" class="form-input" value="${date}" id="edit-date-${id}"></td>
                    <td><input type="text" class="form-input" value="${credit.description}" id="edit-description-${id}"></td>
                    <td>
                        <select class="form-select" id="edit-mode-${id}">
                            <option value="Cash" ${credit.mode === 'Cash' ? 'selected' : ''}>Cash</option>

                            <option value="Other" ${credit.mode === 'Other' ? 'selected' : ''}>Other</option>
                        </select>
                    </td>
                    <td><input type="text" class="form-input" value="${credit.remarks || ''}" id="edit-remarks-${id}"></td>
                    <td><input type="number" step="0.01" class="form-input" value="${credit.amount}" id="edit-amount-${id}"></td>
                    <td>
                        <div class="attachments" id="edit-attachments-${id}">
                            ${credit.attachments && credit.attachments.length > 0 ? credit.attachments.map((url, idx) => `
                                <div class="attachment">
                                    <img src="${url}" alt="Attachment ${idx + 1}">
                                    <button class="attachment-remove" onclick="removeCreditAttachment('${id}', '${url}')">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                            `).join('') : ''}
                        </div>
                        <div id="edit-credit-new-attachments-preview-${id}" class="attachments" style="margin-top: 0.5rem;"></div>
                        <input type="file" class="form-input" id="edit-new-attachments-${id}" multiple accept="image" style="margin-top: 0.5rem;">
                        <small class="text-secondary" style="display: block; margin-top: 4px;">Max 5 total files, 9MB each</small>
                    </td>
                    <td>
                        <div class="actions">
                            <button class="action-btn success" onclick="saveEditCredit('${id}')">
                                <i class="fas fa-check"></i>
                            </button>
                            <button class="action-btn danger" onclick="cancelEdit('${id}')">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </td>
                `;

                // Setup attachment handling for edit
                window.uploadedFiles = [];
                const existingCount = credit.attachments ? credit.attachments.length : 0;
                document.getElementById(`edit-new-attachments-${id}`).addEventListener('change', (e) => {
                    const preview = document.getElementById(`edit-credit-new-attachments-preview-${id}`);
                    const files = Array.from(e.target.files);

                    for (const file of files) {
                        if (window.uploadedFiles.length + existingCount >= 5) {
                            showToast('Warning', 'Maximum 5 attachments allowed', 'error');
                            break;
                        }
                        if (file.size > 9 * 1024 * 1024) {
                            showToast('Warning', `File ${file.name} exceeds 9MB limit`, 'error');
                            continue;
                        }
                        window.uploadedFiles.push(file);
                    }

                    renderCreditEditNewAttachments(id);
                    e.target.value = '';
                });

                window.renderCreditEditNewAttachments = (id) => {
                    const preview = document.getElementById(`edit-credit-new-attachments-preview-${id}`);
                    if (!preview) return;
                    preview.innerHTML = '';
                    window.uploadedFiles.forEach((file, idx) => {
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            const div = document.createElement('div');
                            div.className = 'attachment';
                            div.innerHTML = `
                                <img src="${ev.target.result}" alt="Preview ${idx + 1}">
                                <button class="attachment-remove" onclick="removeCreditEditNewAttachment('${id}', ${idx})">
                                    <i class="fas fa-times"></i>
                                </button>
                            `;
                            preview.appendChild(div);
                        };
                        reader.readAsDataURL(file);
                    });
                };

                window.removeCreditEditNewAttachment = (id, index) => {
                    window.uploadedFiles.splice(index, 1);
                    renderCreditEditNewAttachments(id);
                };

            } catch (error) {
                showToast('Error', error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        async function saveEditCredit(id) {
            showLoading();
            try {
                const doc = await db.collection('credits').doc(id).get();
                const oldData = doc.data();

                const updateData = {
                    date: firebase.firestore.Timestamp.fromDate(new Date(document.getElementById(`edit-date-${id}`).value)),
                    description: document.getElementById(`edit-description-${id}`).value,
                    mode: document.getElementById(`edit-mode-${id}`).value,
                    remarks: document.getElementById(`edit-remarks-${id}`).value,
                    amount: parseFloat(document.getElementById(`edit-amount-${id}`).value),
                    attachments: oldData.attachments || []
                };

                const newFiles = window.uploadedFiles;
                for (let file of newFiles) {
                    const ref = storage.ref(`credits/${currentUser.uid}/${Date.now()}_${file.name}`);
                    await ref.put(file);
                    const url = await ref.getDownloadURL();
                    updateData.attachments.push(url);
                }

                await db.collection('credits').doc(id).update(updateData);
                window.uploadedFiles = []; // Clear queue
                editingRowId = null;
                await loadCredits();
                showToast('Success', 'Credit updated successfully!');
            } catch (error) {
                showToast('Error', error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        async function cancelEdit(id) {

        async function removeCreditAttachment(id, urlToRemove) {
            try {
                const doc = await db.collection('credits').doc(id).get();
                const data = doc.data();
                const attachments = (data.attachments || []).filter(url => url !== urlToRemove);

                await db.collection('credits').doc(id).update({ attachments });

                // Update UI by finding the specific attachment element with matching image src
                const container = document.getElementById(`edit-attachments-${id}`);
                const images = container.querySelectorAll('img');
                for (let img of images) {
                    if (img.src === urlToRemove) {
                        img.closest('.attachment').remove();
                        break;
                    }
                }
            } catch (error) {
                showToast('Error', error.message, 'error');
            }
        }

        // Export Credits PDF
        async function exportCreditsPDF() {
            showLoading();
            try {
                // Get current language from settings
                const currentLang = localStorage.getItem('language') || currentLanguage || 'en';
                const t = (key) => translations[currentLang]?.[key] || translations['en'][key] || key;

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                const yearFilter = document.getElementById('creditsYear')?.value || 'all';
                const monthFilter = document.getElementById('creditsMonth')?.value || 'all';

                const snapshot = await db.collection('credits')
                    .where('userId', '==', currentUser.uid)
                    .get();

                let credits = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                // Apply filters
                credits = filterByYearMonth(credits, yearFilter, monthFilter);
                credits.sort((a, b) => safeDateMillis(b.date) - safeDateMillis(a.date));

                // Header with orange color
                doc.setFillColor(255, 140, 66);
                doc.rect(0, 0, 210, 30, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(20);
                doc.text(`SplitEra - ${t('creditsReport')}`, 105, 15, { align: 'center' });
                doc.setFontSize(12);
                doc.text(`${t('generated')}: ${new Date().toLocaleDateString()}`, 105, 23, { align: 'center' });

                doc.setTextColor(0, 0, 0);
                let yPos = 40;

                const total = credits.reduce((sum, c) => sum + (parseFloat(c.amount) || 0), 0);
                doc.setFontSize(12);
                doc.text(`${t('totalCreditsLabel')}: ${formatCurrency(total, true)}`, 14, yPos);
                yPos += 15;

                const grouped = groupByMonth(credits);

                Object.keys(grouped).sort().reverse().forEach(monthKey => {
                    const [year, month] = monthKey.split('-');
                    const monthName = getMonthName(parseInt(month) - 1);

                    if (yPos > 250) {
                        doc.addPage();
                        yPos = 20;
                    }

                    doc.setFontSize(12);
                    doc.setFont(undefined, 'bold');
                    doc.text(`${monthName} ${year}`, 14, yPos);
                    doc.setFont(undefined, 'normal');
                    yPos += 7;

                    let monthTotal = 0;

                    const tableData = grouped[monthKey].map(credit => {
                        const amt = parseFloat(credit.amount) || 0;
                        monthTotal += amt;
                        return [
                            safeDate(credit.date).toLocaleDateString(),
                            credit.description,
                            credit.mode,
                            credit.remarks || '-',
                            formatCurrency(amt, true)
                        ];
                    });

                    // Add Total Row
                    tableData.push([
                        { content: t('monthTotal'), colSpan: 4, styles: { fontStyle: 'bold', halign: 'right' } },
                        { content: formatCurrency(monthTotal, true), styles: { fontStyle: 'bold', textColor: [255, 140, 66] } }
                    ]);

                    doc.autoTable({
                        startY: yPos,
                        head: [[t('date'), t('description'), t('mode'), t('remarks'), t('amount')]],
                        body: tableData,
                        theme: 'grid',
                        headStyles: { fillColor: [255, 140, 66], lineWidth: 0.1, lineColor: [200, 200, 200] },
                        styles: { lineWidth: 0.1, lineColor: [200, 200, 200] },
                        columnStyles: {
                            4: { fontStyle: 'bold', halign: 'right' }
                        },
                        margin: { left: 14, right: 14 }
                    });

                    yPos = doc.lastAutoTable.finalY + 15;
                });

                doc.save(`credits-report-${Date.now()}.pdf`);
                showToast('Success', 'PDF exported successfully!');
            } catch (error) {
                showToast('Error', 'Failed to export PDF: ' + error.message, 'error');
            } finally {
                hideLoading();
            }
        }

                const yearFilter = document.getElementById('personalYear')?.value || 'all';
                const monthFilter = document.getElementById('personalMonth')?.value || 'all';

                let expenses = [...dataState.personalExpenses];

                expenses = filterBySearch(expenses, searchTerm, ['description', 'category', 'mode', 'remarks', 'amount']);
                expenses = filterByYearMonth(expenses, yearFilter, monthFilter);
                expenses.sort((a, b) => safeDateMillis(b.date) - safeDateMillis(a.date));

                const total = expenses.reduce((sum, e) => sum + e.amount, 0);

                    for (const file of files) {
                        if (window.uploadedFiles.length + existingCount >= 5) {
                            showToast('Warning', 'Maximum 5 attachments allowed', 'error');

                        if (file.size > 9 * 1024 * 1024) {

                window.renderPersonalEditNewAttachments = (id) => {
                    const preview = document.getElementById(`edit-personal-new-attachments-preview-${id}`);

                };

                showToast('Error', error.message, 'error');

        // Export Personal PDF
        async function exportPersonalPDF() {
            showLoading();
            try {
                // Get current language from settings
                const currentLang = localStorage.getItem('language') || currentLanguage || 'en';
                const t = (key) => translations[currentLang]?.[key] || translations['en'][key] || key;

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                const yearFilter = document.getElementById('personalYear')?.value || 'all';
                const monthFilter = document.getElementById('personalMonth')?.value || 'all';

                const snapshot = await db.collection('personal_expenses')
                    .where('userId', '==', currentUser.uid)
                    .get();

                let expenses = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                // Apply filters
                expenses = filterByYearMonth(expenses, yearFilter, monthFilter);
                expenses.sort((a, b) => safeDateMillis(b.date) - safeDateMillis(a.date));

                doc.setFillColor(255, 140, 66);
                doc.rect(0, 0, 210, 30, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(20);
                doc.text(`SplitEra - ${t('personalExpensesReport')}`, 105, 15, { align: 'center' });
                doc.setFontSize(12);
                doc.text(`${t('generated')}: ${new Date().toLocaleDateString()}`, 105, 23, { align: 'center' });

                doc.setTextColor(0, 0, 0);
                let yPos = 40;

                const total = expenses.reduce((sum, e) => sum + (parseFloat(e.amount) || 0), 0);
                doc.setFontSize(12);
                doc.text(`${t('totalPersonalExpenses')}: ${formatCurrency(total, true)}`, 14, yPos);
                yPos += 15;

                const grouped = groupByMonth(expenses);

                Object.keys(grouped).sort().reverse().forEach(monthKey => {
                    const [year, month] = monthKey.split('-');
                    const monthName = getMonthName(parseInt(month) - 1);

                    if (yPos > 250) {
                        doc.addPage();
                        yPos = 20;
                    }

                    doc.setFontSize(12);
                    doc.setFont(undefined, 'bold');
                    doc.text(`${monthName} ${year}`, 14, yPos);
                    doc.setFont(undefined, 'normal');
                    yPos += 7;

                    let monthTotal = 0;
                    const tableData = grouped[monthKey].map(expense => {
                        const amt = parseFloat(expense.amount) || 0;
                        monthTotal += amt;
                        return [
                            safeDate(expense.date).toLocaleDateString(),
                            expense.description,
                            expense.mode,
                            expense.remarks || '-',
                            formatCurrency(amt, true)
                        ];
                    });

                    // Add Total Row
                    tableData.push([
                        { content: t('monthTotal'), colSpan: 4, styles: { fontStyle: 'bold', halign: 'right' } },
                        { content: formatCurrency(monthTotal, true), styles: { fontStyle: 'bold' } }
                    ]);

                    doc.autoTable({
                        startY: yPos,
                        head: [[t('date'), t('description'), t('mode'), t('remarks'), t('amount')]],
                        body: tableData,
                        theme: 'grid',
                        headStyles: { fillColor: [255, 140, 66], lineWidth: 0.1, lineColor: [200, 200, 200] },
                        styles: { lineWidth: 0.1, lineColor: [200, 200, 200] },
                        columnStyles: {
                            4: { fontStyle: 'bold', halign: 'right' }
                        },
                        margin: { left: 14, right: 14 }
                    });

                    yPos = doc.lastAutoTable.finalY + 15;
                });

                doc.save(`personal-expenses-${Date.now()}.pdf`);
                showToast('Success', 'PDF exported successfully!');
            } catch (error) {
                showToast('Error', 'Failed to export PDF: ' + error.message, 'error');
            } finally {
                hideLoading();
            }
        }

        async function updateGroup(groupId) {
            showLoading();
            try {
                const name = document.getElementById('editGroupName').value;
                const description = document.getElementById('editGroupDescription').value;
                const dateVal = document.getElementById('editGroupDate').value;
                const invitesVal = document.getElementById('editGroupInvites').value;

                // Process invites and guests
                const inputList = invitesVal.split(',').map(e => e.trim()).filter(e => e);
                const emailsToInvite = [];
                const guestNames = [];
                const phonesToCheck = [];

                inputList.forEach(item => {
                    if (item.includes('@')) {
                        emailsToInvite.push(item);
                    } else if (/^[\d+\-\s()]{7,}$/.test(item)) {
                        phonesToCheck.push(item);
                    } else {
                        guestNames.push(item);
                    }
                });

                // Check Phones
                for (const phone of phonesToCheck) {
                    const cleanPhone = phone.replace(/[^\d+]/g, '');
                    const userSnap = await db.collection('users').where('phone', '==', cleanPhone).get();
                    if (!userSnap.empty) {
                        const user = userSnap.docs[0].data();
                        if (user.email) emailsToInvite.push(user.email);
                        // If no email, we could still add to a 'toPhone' invite, 
                        // but sticking to the email-based invite system for now.
                        else guestNames.push(phone); // Fallback to guest if no email
                    } else {
                        guestNames.push(phone);
                    }
                }

                const simplifyElement = document.getElementById('editGroupSimplify');
                const simplify = simplifyElement ? simplifyElement.checked : false;
                const updates = {
                    name,
                    description,
                    simplify,
                    creationDate: firebase.firestore.Timestamp.fromDate(new Date(dateVal))
                };
                if (guestNames.length > 0) {
                    updates.guestMembers = firebase.firestore.FieldValue.arrayUnion(...guestNames);
                }

                await db.collection('groups').doc(groupId).update(updates);

                // Send Invites
                if (emailsToInvite.length > 0) {
                    const batch = db.batch();
                    for (let email of emailsToInvite) {
                        const inviteRef = db.collection('group_invites').doc();
                        batch.set(inviteRef, {
                            groupId: groupId,
                            groupName: name,
                            toEmail: email.toLowerCase(),
                            invitedBy: currentUser.uid,
                            invitedByName: `${currentUser.firstName} ${currentUser.lastName || ''}`,
                            status: 'pending',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    }
                    await batch.commit();
                }

                document.querySelector('.modal-overlay').remove();
                await loadGroups();
                showToast(t('success'), t('groupUpdated'));
            } catch (e) {
                showToast('Error', e.message, 'error');
            } finally {
                hideLoading();
            }
        }

        async function loadGroups() {
            if (!dataState.isLoaded.groups) {
                showLoading();
                return;
            }
            hideLoading();

            try {
                const groups = dataState.groups;

                // Calculate user's total share in groups and individual expenses
                let userTotalShare = 0;
                let userIndividualExpenses = 0;

                const allGroupExpenses = dataState.groupExpenses;
                for (let group of groups) {
                    const groupExpenses = allGroupExpenses.filter(e => e.groupId === group.id);

                    // Calculate user's share in this group
                    const breakdowns = calculateExpenseBreakdown(groupExpenses, [...(group.members || []), ...(group.guestMembers || [])], {});
                    groupExpenses.forEach(expense => {
                        const breakdown = breakdowns[expense.id];
                        if (breakdown?.contributions?.[currentUser.uid]) {
                            userTotalShare += breakdown.contributions[currentUser.uid];
                        }
                        // Track individual expenses paid by user
                        if (expense.paidBy === currentUser.uid || expense.userId === currentUser.uid) {
                            userIndividualExpenses += expense.amount;
                        }
                    });
                }

                // Update banner with user's total group expenses (their share)
                document.getElementById('totalGroupAmount').innerHTML = `
                    <div style="font-size: 1.9rem; color: #ffffff;">
                        ${t('')} ${formatCurrency(userTotalShare)}
                    </div>
                `;

                const container = document.getElementById('groupsContainer');
                if (groups.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon"><i class="fas fa-users"></i></div>
                            <div class="empty-title">${t('noGroupsFound')}</div>
                            <div class="empty-message">${t('groupsMessage')}</div>
                        </div>
                    `;
                } else {
                    let html = '<div class="groups-grid">';
                    for (let group of groups) {
                        const groupExpensesList = allGroupExpenses.filter(e => e.groupId === group.id);
                        const totalExpenses = groupExpensesList.reduce((sum, exp) => {
                            // Exclude settlement expenses to avoid double counting
                            if (exp.category === 'Settlement' || exp.isSettlement) return sum;
                            return sum + (parseFloat(exp.amount) || 0);
                        }, 0);

                        // Pending requests logic
                        let requestsHtml = '';
                        if (group.createdBy === currentUser.uid && group.pendingRequests && group.pendingRequests.length > 0) {
                            // Ideally fetch names, for now just show count or fetch inline if few

                        html += `

                                <div class="group-header">
                                    <h3>${group.name}</h3>
                                    <span class="badge badge-info">${(group.members?.length || 0) + (group.guestMembers?.length || 0)} ${t('membersCount')}</span>
                                </div>
                                <div class="group-body">
                                    <p><strong>${t('groupCode')}:</strong> <span class="badge badge-secondary">${group.code}</span></p>
                                    <p><strong>${t('totalExpensesLabel')}:</strong> ${formatCurrency(totalExpenses)}</p>

                                    ${group.createdBy === currentUser.uid ? `

                                        </button>
                                    `}
                                </div>
                            </div>
                        `;
                    }
                    html += '</div>';

                showToast('Error', error.message, 'error');
